    sage:'« Avant que le kunai ne soit forgé, il y a le métal. Avant que le ninja ne soit formé, il y a les règles. Aujourd\'hui, nous posons ensemble les fondations de ce que vous deviendrez. »',
    dur:'« Vous pensez peut-être que les règles sont des chaînes. Détrompez-vous — elles sont la seule raison pour laquelle vous rentrerez vivants de vos missions. Chaque mot compte, chaque interdiction a été écrite dans le sang de quelqu\'un. »',
    guerrier:'« Un guerrier sans discipline est une lame qui se brise sur elle-même. Ces huit règles ne vous limitent pas — elles vous aiguisent. Gravez-les dans votre chair si nécessaire. »',
    bienveillant:'« Je sais que les règles peuvent sembler austères au premier abord, mais chacune d\'elles a été pensée pour vous protéger, vous et vos futurs coéquipiers. Prenons le temps de les comprendre ensemble, vraiment. »',
    mysterieux:'« Huit règles. Huit chemins qui mènent tous au même endroit : la survie. Mais la survie de quoi exactement — de votre corps, ou de ce qui fait de vous un shinobi de Konoha ? »',
    stratege:'« Ces huit règles constituent le protocole opérationnel minimal d\'un shinobi de Konoha. Chaque infraction crée une faille — dans une mission, dans une équipe, dans vous-même. Nous allons analyser chacune avec précision. »',
    veteran:'« J\'ai vu des ninjas briller comme des étoiles filantes et disparaître tout aussi vite, parce qu\'ils avaient méprisé ces règles. On ne les respecte pas par obéissance — on les respecte parce qu\'on tient à vivre. »',
    fraternel:'« Bon, les règles, j\'entends déjà certains soupirer. Mais croyez-moi, une fois sur le terrain quand les choses se compliquent, vous serez contents de les avoir ancrées dans la tête. Allez, on y va ensemble. »',
    ironique:'« Ah, les Règles d\'Or — parce que visiblement, le bon sens naturel ne suffit pas. Ne vous inquiétez pas, après ce cours vous saurez exactement quoi ne pas faire pour qu\'on ne retrouve pas votre portrait sur un monument aux morts. »',
    ermite:'« La forêt a ses propres lois, non écrites, gravées dans l\'instinct de chaque créature. Les shinobi ont couché les leurs sur parchemin. Ce n\'est pas moins sage — c\'est juste plus humain. »',
    ombre:'« Huit règles. Mémorisez-les intégralement d\'ici la fin de cette session. Toute violation en mission constitue un risque pour l\'équipe et sera traitée comme telle. Commençons. »',
    sensei_noble:'« La grandeur d\'un shinobi ne se mesure pas à la puissance de son chakra, mais à la rigueur avec laquelle il honore le code qui régit notre village. Ces règles sont notre héritage — traitez-les comme tel. »',
    rebelle:'« Je sais, les règles c\'est chiant. Mais même moi je les respecte, et ce n\'est pas parce qu\'on me l\'ordonne — c\'est parce que j\'ai compris pourquoi elles existent. Alors écoutez avant de les remettre en question. »',
    mentor:'« Chaque règle est une intention cristallisée — la sagesse de ceux qui nous ont précédés, offerte sous forme de garde-fou. Recevez-les non comme des contraintes, mais comme un legs que vous transmettrez à votre tour. »',
    chasseur:'« Un prédateur sans règles devient une proie pour ses propres instincts. Ces huit lois sont votre cadre — elles vous permettent de traquer sans vous perdre, d\'agir sans vous trahir. »',
    tacticien:'« Toute opération repose sur un référentiel commun. Ces huit règles sont le vôtre. Sans elles, la coordination est impossible, les décisions deviennent erratiques. Ce n\'est pas de la morale — c\'est de la logistique. »'
  },
  nature:{
    katon:'Le feu non maîtrisé consume tout sur son passage — allié ou ennemi. Les règles sont le foyer qui contient la flamme et lui donne son vrai pouvoir.',
    futon:'Le vent est libre, insaisissable — mais même lui suit les courants de l\'air. La liberté du shinobi existe à l\'intérieur de ses règles, pas en dehors.',
    raiton:'La foudre frappe vite et précis, mais toujours selon les mêmes lois immuables. La puissance sans cadre n\'est qu\'un orage aveugle.',
    doton:'Une fondation mal posée fait s\'effondrer tout l\'édifice. Ces règles sont la roche sur laquelle se construit chaque shinobi de Konoha.',
    suiton:'L\'eau s\'adapte, s\'écoule, contourne — mais elle ne défie jamais la gravité. Les règles sont cette force naturelle que le shinobi apprend à accompagner.'
  }
},
nindo:{
  intro:{
    sage:'« Le Nindo n\'est pas une déclaration que l\'on récite — c\'est une vérité que l\'on découvre en soi, souvent dans les moments où tout s\'effondre. Aujourd\'hui, nous cherchons ensemble ce socle intérieur. »',
    dur:'« Beaucoup d\'entre vous n\'ont pas de Nindo. Ils ont des envies, des humeurs, des excuses. Un Nindo, c\'est ce qui vous maintient debout quand vous n\'avez plus de raison de l\'être. Trouvez-le. »',
    guerrier:'« Le Nindo n\'est pas un poème. C\'est le cri que vous pousserez quand vos genoux céderont et que vous devrez vous relever quand même. Il doit brûler en vous comme une braise que rien ne peut éteindre. »',
    bienveillant:'« Votre Nindo, c\'est votre voix la plus profonde — celle qui sait ce qui compte vraiment pour vous, même quand tout le monde essaie de vous convaincre du contraire. Laissez-moi vous aider à l\'écouter. »',
    mysterieux:'« Il existe une question que personne ne peut répondre à votre place : pourquoi continuez-vous ? La réponse à cette question — c\'est votre Nindo. Cherchez bien, elle est déjà là. »',
    stratege:'« Le Nindo est votre axiome fondamental — le postulat à partir duquel chaque décision difficile devient claire. Un shinobi sans Nindo défini prendra des décisions incohérentes sous pression. »',
    veteran:'« J\'ai vu des ninjas mourir en paix et des ninjas mourir en regrettant. La différence, c\'était qu\'ils avaient vécu selon leur Nindo ou qu\'ils l\'avaient trahi. Choisissez ce qui vaut la peine d\'être défendu. »',
    fraternel:'« Votre Nindo, c\'est un peu votre boussole intérieure — quand tout part en vrille et que vous ne savez plus quoi faire, il vous dit où aller. On va prendre le temps de trouver la vôtre aujourd\'hui. »',
    ironique:'« Le Nindo — parce que se battre sans savoir pourquoi, c\'est juste de la violence avec un bandeau. Cherchons ensemble cette raison profonde qui vous empêchera de finir nihiliste. »',
    ermite:'« Les arbres ne se demandent pas pourquoi ils poussent vers la lumière. Vous si, et c\'est votre force. Votre Nindo, c\'est votre soleil personnel — trouvez-le avant que les ombres ne vous engloutissent. »',
    ombre:'« Un shinobi sans conviction intérieure est vulnérable à la manipulation. Le Nindo est votre ancre opérationnelle. Identifiez-le, internalisez-le, ne le divulguez qu\'à bon escient. »',
    sensei_noble:'« Un shinobi de Konoha porte en lui la dignité de son village. Le Nindo est l\'expression personnelle de cette dignité — la promesse que vous vous faites à vous-même d\'être digne. »',
    rebelle:'« Pas question de vous imposer un Nindo. Le vôtre, il vient de vous — de vos colères, de vos cicatrices, de ce qui vous a construit. Tout ce que je vous demande, c\'est de l\'assumer pleinement. »',
    mentor:'« Avant que la technique ne soit maîtrisée, il y a l\'intention. Le Nindo est cette intention première — la graine spirituelle dont tout le reste est le fruit. Cultivez-la avec soin. »',
    chasseur:'« Une proie sans but erre. Un prédateur sans but s\'épuise. Votre Nindo, c\'est l\'instinct affiné en conscience — il vous dit quoi traquer, et pourquoi ça vaut la peine. »',
    tacticien:'« Chaque système a besoin d\'un objectif premier pour que tous les autres paramètres s\'alignent. Votre Nindo est cet objectif — sans lui, vos décisions seront perpétuellement contradictoires. »'
  },
  nature:{
    katon:'La flamme du Nindo ne s\'allume pas d\'elle-même — elle exige une étincelle, un moment de vérité où vous avez décidé que quelque chose valait la peine de brûler.',
    futon:'Le vent ne se voit pas, mais on le ressent partout. Un Nindo fort, c\'est pareil — invisible de l\'extérieur, mais perceptible dans chacun de vos gestes.',
    raiton:'La foudre suit le chemin de moindre résistance vers la vérité de la terre. Votre Nindo est cette vérité en vous, le point vers lequel tout votre être converge.',
    doton:'Les racines d\'un arbre centenaire ne se voient pas, mais elles décident de tout. Votre Nindo est ce système racinaire intérieur.',
    suiton:'L\'eau prend la forme de tout ce qui la contient, mais reste toujours elle-même. Un Nindo solide vous permet de vous adapter sans jamais perdre ce que vous êtes.'
  }
},
volonte_feu:{
  intro:{
    sage:'« La Volonté du Feu n\'est pas un sentiment. C\'est une transmission — une flamme passée de main en main depuis les fondateurs de Konoha. Aujourd\'hui, nous parlons de ce que vous allez en faire. »',
    dur:'« La Volonté du Feu ne consiste pas à aimer Konoha quand tout va bien. Elle consiste à défendre ce village quand ça coûte quelque chose — et ça coûtera quelque chose, croyez-moi. »',
    guerrier:'« Il y a des shinobi qui se battent pour eux-mêmes, et des shinobi qui se battent pour quelque chose de plus grand. La Volonté du Feu, c\'est le carburant de ces derniers — et ce sont eux qui changent le cours des guerres. »',
    bienveillant:'« La Volonté du Feu, dans son essence la plus pure, c\'est l\'amour. L\'amour de ce village, de ses habitants, de ceux qui viendront après nous. C\'est pourquoi cet amour est une force, et non une faiblesse. »',
    mysterieux:'« On dit que la Volonté du Feu ne meurt jamais. Mais une flamme peut s\'éteindre si on ne l\'entretient pas. Qu\'êtes-vous prêts à brûler pour la garder en vie ? »',
    stratege:'« La Volonté du Feu est le fondement idéologique de Konoha — le principe unificateur qui permet à des individualités diverses de former un village cohérent. Comprendre ce principe, c\'est comprendre pourquoi Konoha tient debout. »',
    veteran:'« J\'ai perdu des camarades qui croyaient en cette flamme. Leur sacrifice n\'a de sens que si vous continuez à la porter. Ce n\'est pas une figure de style — c\'est une responsabilité réelle. »',
    fraternel:'« La Volonté du Feu, au fond, c\'est simple : on se bat pour les autres, pas seulement pour soi. Pour le gosse dans la rue, pour le vieux marchand, pour le coéquipier qui compte sur vous. »',
    ironique:'« La Volonté du Feu — ce concept grandiose qui explique pourquoi des shinobi font des choses dangereuses pour des gens qui ne sauront même pas leur nom. Et pourtant, ça fonctionne. Voyons pourquoi. »',
    ermite:'« Un feu isolé s\'éteint vite. Mais un feu partagé entre mille foyers peut résister à n\'importe quelle tempête. La Volonté du Feu, c\'est ce que vous devenez quand vous acceptez d\'être l\'un de ces foyers. »',
    ombre:'« La Volonté du Feu est le cadre idéologique qui justifie notre existence. Comprenez-la pleinement — pas pour la célébrer, mais pour savoir exactement ce que vous défendez et pourquoi. »',
    sensei_noble:'« Porter la Volonté du Feu, c\'est accepter un mandat qui dépasse notre propre vie. Les Senju, les Uchiha — ils nous l\'ont confié. Il appartient à chacun de vous d\'en être digne. »',
    rebelle:'« La Volonté du Feu, ce n\'est pas aveuglément servir un symbole. C\'est protéger les gens qui vivent derrière les murs. Nuance importante. »',
    mentor:'« La Volonté du Feu est la conscience collective de Konoha. En l\'embrassant, vous devenez plus grand que vous-même. Réfléchissez à ce que cela signifie vraiment. »',
    chasseur:'« Le prédateur le plus redoutable n\'est pas celui qui chasse pour lui — c\'est celui qui chasse pour protéger sa meute. La Volonté du Feu est cet instinct de protection élevé au rang de doctrine. »',
    tacticien:'« La Volonté du Feu transforme un groupe d\'individus en système cohérent. Elle aligne les motivations, stabilise le moral sous pression et fournit un objectif supérieur quand les objectifs personnels s\'épuisent. »'
  },
  nature:{
    katon:'La Volonté du Feu porte son nom pour une raison — elle se transmet comme une flamme, de sensei à élève. Votre rôle n\'est pas seulement de brûler, mais de transmettre cette braise.',
    futon:'Le vent porte les graines là où elles n\'auraient jamais pu aller seules. La Volonté du Feu se répand de la même façon — invisible, mais présente partout.',
    raiton:'La Volonté du Feu est instantanée comme la foudre — elle vous traverse dans les moments critiques et vous fait agir avant même de réfléchir.',
    doton:'Konoha ne tient pas grâce à ses murailles — il tient grâce aux racines que ses shinobi ont plantées dans le cœur de chaque génération.',
    suiton:'Comme un fleuve qui s\'adapte aux reliefs sans jamais cesser d\'avancer, la Volonté du Feu coule toujours dans le même sens : vers la protection de ce village.'
  }
},
histoire:{
  intro:{
    sage:'« Ceux qui ignorent leur histoire marchent à l\'aveugle vers leur avenir. Konoha n\'est pas né d\'un décret — il est né d\'un choix, courageux et fragile, fait par des hommes qui avaient toutes les raisons de se haïr. »',
    dur:'« L\'histoire de Konoha n\'est pas un conte. C\'est une série de sacrifices, de trahisons évitées de justesse et de paris fous. Retenez-le bien — parce que ce que ce village est aujourd\'hui a coûté très cher. »',
    guerrier:'« Konoha a été fondé sur le champ de bataille — par deux guerriers qui ont décidé que leur combat commun valait plus que leur rivalité. C\'est de ce courage-là que vous êtes les héritiers. »',
    bienveillant:'« Chaque pierre de ce village porte la mémoire de ceux qui ont rêvé qu\'un endroit sûr pouvait exister. Aujourd\'hui, je veux que vous sentiez le poids et la beauté de cet héritage. »',
    mysterieux:'« Avant Konoha, il n\'y avait que des clans — des îles séparées par des océans de méfiance. Comment deux hommes ont-ils réussi à construire un pont ? L\'histoire ne le dit qu\'à ceux qui écoutent vraiment. »',
    stratege:'« Comprendre la fondation de Konoha, c\'est comprendre les forces qui ont façonné notre présent. Chaque alliance, chaque tension entre clans résonne encore dans notre structure actuelle. »',
    veteran:'« J\'ai grandi avec ces histoires. Mais avec le temps, j\'ai compris qu\'elles n\'étaient pas des légendes — c\'étaient des rapports de mission de gens qui avaient peur et qui ont quand même avancé. »',
    fraternel:'« L\'histoire de Konoha, c\'est l\'histoire de gens qui ont décidé d\'arrêter de se battre les uns contre les autres pour se battre ensemble. Pas très compliqué — et pourtant, ça a changé le monde. »',
    ironique:'« L\'histoire de Konoha — fondée par deux clans qui se détestaient cordialement depuis des générations. Si ça ne vous donne pas espoir pour l\'avenir, rien ne le fera. »',
    ermite:'« Un village naît comme une graine — d\'une idée unique, dans un sol de hasard, sous un ciel incertain. Konoha a eu ses deux jardiniers fondateurs et ses racines qui ont fini par tenir. »',
    ombre:'« Connaître l\'histoire de Konoha, c\'est connaître ses vulnérabilités structurelles, ses lignes de fracture internes et les forces qui l\'ont maintenu cohérent. Analyse indispensable. »',
    sensei_noble:'« L\'histoire de Konoha est notre généalogie collective. Connaître les noms des fondateurs, comprendre leurs sacrifices, c\'est savoir d\'où vient le sang qui coule dans les veines de ce village. »',
    rebelle:'« Avant de critiquer ce système, encore faut-il savoir comment il est né. L\'histoire de Konoha est loin d\'être parfaite — et c\'est justement pour ça qu\'elle vaut la peine d\'être connue. »',
    mentor:'« Chaque génération est le fruit de celle qui l\'a précédée. Avant de construire votre propre chemin, prenez le temps de comprendre sur quelles épaules vous vous tenez. »',
    chasseur:'« Un chasseur connaît le terrain avant d\'y mettre les pieds. Konoha est votre terrain — ses origines, ses alliances, ses fragilités. Aujourd\'hui, nous cartographions les fondations. »',
    tacticien:'« L\'histoire est le seul laboratoire où les stratégies ont été testées à grande échelle. Étudier la fondation de Konoha, c\'est analyser l\'une des réussites politiques les plus improbables. »'
  },
  nature:{
    katon:'Konoha a été fondé sur une idée incandescente — que deux clans ennemis pouvaient partager la même flamme. Comme le Katon, cette idée a tout consumé pour ne laisser que l\'essentiel.',
    futon:'Les Senju et les Uchiha auraient pu rester des vents contraires. Ils ont choisi de souffler dans le même sens — et c\'est ce souffle commun qui a donné naissance à Konoha.',
    raiton:'Deux clans rivaux qui s\'allient — c\'est aussi inattendu qu\'un éclair dans un ciel clair. La fondation de Konoha a été cet instant de rupture qui a redéfini ce qui semblait impossible.',
    doton:'Les villages ne sont pas construits en une nuit — ils sont construits couche par couche. Chaque clan qui a rejoint Konoha a ajouté une strate à ce que vous habitez aujourd\'hui.',
    suiton:'Les rivières ne naissent pas grandes — elles commencent par de minces filets d\'eau qui se rejoignent. Konoha a commencé par deux clans, puis les autres ont afflué.'
  }
},
decomposition_chakra:{
  intro:{
    sage:'« Le chakra est la langue dans laquelle votre corps parle à l\'univers. Avant d\'apprendre à le façonner, il faut comprendre ce qu\'il est — d\'où il vient, comment il circule. »',
    dur:'« Le chakra ne vous obéira que si vous le comprenez. Les ninjas qui brûlent leur énergie sans discernement sont des bougies qui durent une heure. Nous allons apprendre à être des torches. »',
    guerrier:'« Le chakra, c\'est votre carburant de combat — mais un carburant qu\'on gaspille, c\'est un combat qu\'on perd. Comprendre sa composition, c\'est ne jamais tomber à sec au moment crucial. »',
    bienveillant:'« Chaque être vivant possède du chakra — c\'est ce qui vous relie à la vie elle-même. Aujourd\'hui, je voudrais que vous ressentiez cette énergie en vous avant de l\'analyser. »',
    mysterieux:'« Deux rivières coulent en vous depuis votre naissance — l\'une physique, l\'autre spirituelle. Quand elles se mêlent, il se passe quelque chose d\'extraordinaire. Regardons ce mystère en face. »',
    stratege:'« Le chakra est un système à deux composantes interdépendantes. La maîtrise tactique passe par la compréhension précise de ce ratio et de son optimisation selon les situations. »',
    veteran:'« Après des années de combat, j\'ai appris à sentir quand mon chakra baissait avant même que mes muscles ne faiblissent. Ce cours vous apprend cette conscience — elle peut sauver votre vie. »',
    fraternel:'« Le chakra, vous l\'utilisez peut-être déjà sans trop savoir ce que c\'est. Aujourd\'hui on ouvre le capot ensemble — promis, ça va tout changer dans votre façon de pratiquer. »',
    ironique:'« Le chakra — cette énergie mystérieuse que vous avez en vous depuis la naissance sans que personne ne vous demande votre avis. Voyons ensemble ce que vous êtes censés en faire. »',
    ermite:'« Posez une main sur votre sternum. Sentez-vous cette chaleur diffuse ? Ce n\'est pas votre imagination — c\'est votre réseau de chakra qui travaille en ce moment même. »',
    ombre:'« La maîtrise du chakra commence par sa compréhension structurelle. Réseau, tenketsu, ratio physique/spirituel — chaque composante a une implication opérationnelle directe. »',
    sensei_noble:'« Le chakra est le souffle de vie que le monde a insufflé en chacun de vous. Comprendre sa nature profonde est la première marque de respect envers ce don. »',
    rebelle:'« Oubliez tout ce qu\'on vous a dit sur le chakra comme si c\'était de la magie. C\'est une énergie réelle, avec des mécanismes réels. On va tout décortiquer. »',
    mentor:'« Le chakra est la rencontre entre le corps et l\'esprit. Apprendre à le comprendre, c\'est apprendre à vous comprendre. »',
    chasseur:'« Un chasseur connaît ses réserves avant d\'entrer en terrain hostile. Le chakra est votre ressource la plus précieuse — en connaître la structure, c\'est savoir combien de temps vous pouvez tenir. »',
    tacticien:'« Le chakra est une ressource à durée limitée dont la gestion détermine l\'issue de tout engagement. Aujourd\'hui, nous cartographions ce système pour en comprendre les flux et les leviers. »'
  },
  nature:{
    katon:'Le chakra Katon se nourrit d\'énergie physique intense — il consume vite, brille fort. Comprendre la décomposition, c\'est doser sa chaleur pour ne pas brûler vos propres circuits.',
    futon:'L\'énergie spirituelle, légère et insaisissable comme le vent, est ce qui donne au Futon sa finesse tranchante. Un chakra bien décomposé est un souffle maîtrisé.',
    raiton:'La précision du Raiton exige un chakra parfaitement équilibré. Une décomposition mal maîtrisée, et l\'éclair se retourne contre vous.',
    doton:'Le Doton puise sa force dans l\'énergie physique brute. Mais sans la composante spirituelle pour le guider, votre chakra devient une masse inerte.',
    suiton:'Le chakra Suiton coule quand les deux composantes sont en harmonie — l\'énergie physique comme le courant, l\'énergie spirituelle comme le lit de la rivière.'
  }
},
mudras_cours:{
  intro:{
    sage:'« Les Mudras ne sont pas de simples gestes — ce sont des clés. Chacun ouvre une porte différente dans votre réseau de chakra, alignant votre intention avec votre énergie. »',
    dur:'« Un Mudra mal exécuté, c\'est une technique qui rate. Dans le meilleur cas, vous perdez du temps. Dans le pire, vous vous blessez. La précision n\'est pas optionnelle. »',
    guerrier:'« Les Mudras sont les mots d\'une langue que votre chakra comprend instinctivement. Plus vous les maîtrisez, plus vite vous les parlez — et en combat, la vitesse d\'exécution change tout. »',
    bienveillant:'« Ne soyez pas intimidés par les douze Mudras — chacun a été appris par des milliers de ninjas avant vous, parfois maladroitement au début. Ce qui compte, c\'est de commencer. »',
    mysterieux:'« Douze gestes, appris par des milliers de ninjas sur des générations. En les apprenant, vous rejoignez quelque chose de très ancien. »',
    stratege:'« Les douze Mudras forment un système symbolique précis dont chaque composante a une fonction spécifique. La séquence n\'est pas arbitraire — elle est la méthode la plus efficace découverte à ce jour. »',
    veteran:'« Quand vous aurez pratiqué assez longtemps, vos mains les exécuteront sans que votre tête n\'ait à les réclamer. Ce jour-là, vous aurez gagné quelque chose d\'irremplaçable. »',
    fraternel:'« Les Mudras, c\'est un peu comme apprendre à jouer d\'un instrument — les premiers temps, les doigts ne coopèrent pas. Persévérez. Un jour vos mains le feront seules. »',
    ironique:'« Les Mudras — douze façons élégantes de demander à votre chakra de faire ce que vous voulez, avec vos mains, parce que lui parler ne suffit pas. »',
    ermite:'« Regardez vos mains. Elles connaissent déjà des gestes complexes — écrire, saisir, façonner. Les Mudras sont juste une nouvelle façon de converser avec votre énergie intérieure. »',
    ombre:'« Les douze Mudras doivent être exécutés avec fluidité et sans hésitation. Tout temps mort dans une séquence est une faille exploitable. Mémorisez jusqu\'à l\'automatisme. »',
    sensei_noble:'« Les Mudras sont l\'héritage technique des shinobi — une grammaire du chakra affinée sur des générations. Les apprendre avec soin, c\'est honorer ceux qui les ont perfectionnés. »',
    rebelle:'« Je ne vous demande pas d\'être amoureux des Mudras. Je vous demande de les maîtriser — parce que sans eux, la moitié de vos techniques ne décolleront jamais du sol. »',
    mentor:'« Chaque Mudra est une posture de l\'âme autant que du corps — une façon d\'aligner votre intention avec votre énergie. Exécutez-les comme des actes de présence. »',
    chasseur:'« Un piège bien posé nécessite des gestes précis et silencieux. Les Mudras sont votre arsenal silencieux — chaque enchaînement est un piège que vous tendez à la réalité. »',
    tacticien:'« Les Mudras sont un protocole d\'activation séquentielle du chakra. En comprendre la logique, c\'est pouvoir adapter les séquences à des contextes tactiques variés. »'
  },
  nature:{
    katon:'Le Katon exige des Mudras exécutés avec une intention ardente — pas brutale, mais concentrée. Une main hésitante produit une flamme hésitante.',
    futon:'Le Futon glisse entre les Mudras comme le vent entre les branches — avec légèreté et précision. Des doigts trop crispés étranglent le flux.',
    raiton:'Le Raiton ne pardonne pas les Mudras approximatifs — un angle faux et la décharge part dans la mauvaise direction. L\'éclair exige la vérité du geste.',
    doton:'Le Doton attend que vos Mudras soient solides avant de répondre. Ne cherchez pas la vitesse au détriment de la précision. La terre ne se déplace que pour ceux qui demandent correctement.',
    suiton:'Le Suiton s\'écoule à travers des Mudras fluides et continus. Toute rupture crée un remous — passez d\'un signe à l\'autre comme l\'eau passe d\'un rocher à l\'autre.'
  }
},
nature_theorie:{
  intro:{
    sage:'« Le chakra n\'est pas une force que l\'on possède — c\'est un dialogue entre soi et le monde. Aujourd\'hui, vous apprendrez à reconnaître la langue que la nature vous a appris à parler. »',
    dur:'« Vous ignorez quelle nature sommeille en vous. C\'est une lacune inacceptable pour un ninja de Konoha — corrigeons ça, maintenant. »',
    guerrier:'« Connaître sa nature de chakra, c\'est découvrir quel feu brûle au cœur de votre combat. Sans cette connaissance, vous vous battez les yeux fermés. »',
    bienveillant:'« Chaque shinobi porte en lui une nature unique — la vôtre n\'est ni meilleure ni inférieure aux autres. Prenons le temps de la découvrir ensemble. »',
    mysterieux:'« La feuille que vous allez tenir dans vos mains sait déjà ce que vous ignorez encore. Écoutez ce qu\'elle vous révèle sur vous-même. »',
    stratege:'« Identifier sa nature primaire est la première variable d\'une équation qui déterminera l\'ensemble de votre développement tactique. Commençons par les fondations. »',
    veteran:'« J\'ai vu des ninjas mourir parce qu\'ils ne comprenaient pas leur propre chakra. Vous n\'aurez pas cette excuse — pas après ce cours. »',
    fraternel:'« Allez, on va faire quelque chose de sympa aujourd\'hui : découvrir votre nature de chakra. C\'est un peu comme apprendre quel clan vous auriez dû rejoindre, en moins dramatique. »',
    ironique:'« Fascinant — on vous envoie sur des missions et personne n\'a pensé à vérifier si votre chakra préférait brûler les choses ou les noyer. Commençons. »',
    ermite:'« La nature choisit l\'arbre avant même que la graine touche la terre. Votre chakra a fait pareil — venez découvrir quelle pousse vous êtes destiné à devenir. »',
    ombre:'« Votre affinité naturelle détermine vos angles d\'approche en mission. Identifier cette affinité n\'est pas optionnel — c\'est opérationnel. »',
    sensei_noble:'« La tradition des Cinq Grandes Nations repose sur l\'équilibre des natures élémentaires. Il vous appartient de comprendre votre place dans cet équilibre. »',
    rebelle:'« On va pas tourner autour du pot : votre chakra a une couleur, et vous méritez de le savoir. Feuille, chakra, vérité — c\'est parti. »',
    mentor:'« Avant de maîtriser quoi que ce soit, il faut se connaître. La feuille que vous allez tenir est un miroir — regardez-la avec honnêteté. »',
    chasseur:'« Chaque proie laisse une trace. Votre chakra laisse la sienne. Apprenez à lire la vôtre avant que vos ennemis ne le fassent à votre place. »',
    tacticien:'« La nature de votre chakra définit vos forces brutes et vos angles d\'attaque optimaux. Ce cours est le premier nœud du réseau que vous allez construire. »'
  },
  nature:{
    katon:'Une flamme ne choisit pas sa couleur — elle brûle selon le combustible qu\'on lui donne. Votre nature Katon est ce combustible : plus vous la comprenez, plus elle embrase tout.',
    futon:'Le vent ne se voit pas, mais il plie les arbres les plus anciens. Votre nature Futon est cette force invisible — apprenez à la diriger.',
    raiton:'La foudre frappe là où la tension est la plus forte. Votre nature Raiton fonctionne de même : identifiez le point de rupture et frappez.',
    doton:'La montagne n\'a pas toujours été montagne — elle a été sédiment, pression, patience. Votre nature Doton est cette mémoire de la terre.',
    suiton:'L\'eau n\'a pas de forme propre, mais elle prend la forme de tout ce qui l\'accueille. Votre nature Suiton est cette adaptabilité absolue.'
  }
},
taijutsu_theorie:{
  intro:{
    sage:'« Le Taijutsu est la forme la plus honnête du combat : aucun signe, aucun artifice — seulement ce que vous êtes, confronté à ce qu\'est l\'autre. »',
    dur:'« Oubliez vos techniques de chakra cinq minutes. Si vous ne savez pas vous battre à mains nues, vous êtes un fardeau pour votre équipe. On repart de zéro. »',
    guerrier:'« Le Taijutsu, c\'est votre dernier rempart quand tout le reste s\'effondre. C\'est la flamme qui reste allumée quand vous n\'avez plus une once de chakra. »',
    bienveillant:'« Ne vous inquiétez pas si le corps-à-corps vous intimide — chaque geste que vous allez apprendre deviendra un réflexe avec le temps et la pratique. »',
    mysterieux:'« On dit que le premier shinobi n\'avait pas de chakra — seulement ses mains, ses pieds, et la volonté de survivre. Tout le Taijutsu est né de ce moment-là. »',
    stratege:'« Le corps-à-corps obéit à des lois précises : distance, angle, timing, levier. Comprenez ces lois et vous pourrez vaincre un adversaire deux fois plus fort. »',
    veteran:'« J\'ai combattu sans chakra pendant trois jours dans la forêt du Pays de la Pluie. Le Taijutsu m\'a gardé en vie. Il fera pareil pour vous — si vous prenez ça au sérieux. »',
    fraternel:'« Aujourd\'hui on parle de ce que tout le monde fait sans vraiment y réfléchir : se battre. Sauf que nous, on va y réfléchir, et ça va changer votre façon de voir les combats. »',
    ironique:'« Bienvenue au cours qui prouve que vos ancêtres n\'avaient pas besoin de chakra pour casser des mâchoires. Rassurant, non ? »',
    ermite:'« L\'ours ne connaît pas les mudras. Le tigre n\'a jamais ouvert un parchemin. Et pourtant, ils sont redoutables. Le Taijutsu, c\'est retrouver cette vérité animale en vous. »',
    ombre:'« En mission, votre chakra peut être scellé, épuisé ou détecté. Votre corps, lui, est toujours disponible. Le Taijutsu n\'est pas une option — c\'est votre assurance-vie. »',
    sensei_noble:'« Les fondateurs de Konoha forgeaient leurs corps avant de forger leurs techniques. Le Taijutsu est l\'héritage de cette discipline — honorez-le. »',
    rebelle:'« Pas de grands discours : les gens qui méprisent le Taijutsu finissent par se faire démolir par quelqu\'un qui a juste appris à frapper mieux qu\'eux. »',
    mentor:'« Le corps est un temple et une arme à la fois. Le Taijutsu, c\'est apprendre à habiter ce temple pleinement — chaque articulation, chaque souffle, chaque appui. »',
    chasseur:'« Sur le terrain, la distance peut s\'effondrer en un battement de cœur. Le Taijutsu, c\'est ce qui se passe dans cet espace-là — maîtrisez-le ou subissez-le. »',
    tacticien:'« Le Taijutsu est divisé en trois branches aux fonctions complémentaires. Comprendre leur articulation vous permettra de construire un style sans angles morts. »'
  },
  nature:{
    katon:'Le feu dévore l\'espace — un pratiquant Katon en Taijutsu fait pareil : il avance, il presse, il ne laisse aucun souffle à l\'adversaire.',
    futon:'Le vent coupe parce qu\'il est en mouvement constant. Une nature Futon se traduit par des enchaînements fluides et incessants — pas de pause, juste une pression continue.',
    raiton:'La foudre ne prépare pas sa frappe — elle arrive. Un pratiquant Raiton en Taijutsu cultive cette capacité : réduire le temps entre la décision et l\'impact à l\'imperceptible.',
    doton:'Le roc ne recule pas — il absorbe et redistribue. Votre nature Doton se manifeste dans vos appuis, votre centre de gravité, votre capacité à encaisser et retourner.',
    suiton:'L\'eau contourne l\'obstacle sans jamais s\'épuiser. Votre nature Suiton vous apprend à ne jamais opposer force à force — à dévier, absorber, rediriger.'
  }
},
armes_cours:{
  intro:{
    sage:'« Une arme n\'a pas de morale — elle amplifie simplement l\'intention de celui qui la tient. Avant de choisir la vôtre, choisissez ce que vous voulez être. »',
    dur:'« Un shinobi sans maîtrise de ses outils est un artisan sans mains. Vous apprendrez à connaître chaque arme que Konoha met à votre disposition — et vous les respecterez. »',
    guerrier:'« L\'acier prolonge le bras, mais c\'est la volonté qui donne la direction. Apprenez à connaître vos armes comme vous connaissez vos poings — elles font partie de vous au combat. »',
    bienveillant:'« Chaque arme que vous allez découvrir a été conçue pour un objectif précis. Prenez le temps de comprendre chacune — vous saurez ainsi laquelle vous correspond. »',
    mysterieux:'« On ne choisit pas vraiment son arme — c\'est elle qui finit par vous choisir. Regardez-les toutes avec attention et voyez laquelle vous regarde en retour. »',
    stratege:'« L\'efficacité d\'une arme dépend entièrement du contexte : distance, environnement, nombre d\'adversaires. Ce cours vous donne les données — à vous de construire les combinaisons. »',
    veteran:'« J\'en ai vu qui partaient en mission avec l\'arme la plus impressionnante et qui rentraient les mains vides parce qu\'ils ne savaient pas s\'en servir. Connaître son arsenal, c\'est survivre. »',
    fraternel:'« Aujourd\'hui on fait le tour de la boutique. Kunai, shuriken, katana — vous avez probablement déjà tout manipulé au moins une fois. Mais là, on va vraiment comprendre pourquoi chaque chose existe. »',
    ironique:'« Vous pensiez que le kunai était juste un couteau qu\'on lance en espérant toucher quelque chose ? Surprenante journée que vous avez devant vous. »',
    ermite:'« Les animaux ont leurs griffes, leurs crocs, leurs cornes. Nous avons forgé les nôtres. Chaque arme est une extension de l\'instinct shinobi — rien de plus, rien de moins. »',
    ombre:'« Votre sélection d\'armement définit votre profil opérationnel. Ce cours est un inventaire — soyez précis dans vos évaluations, votre vie en dépendra. »',
    sensei_noble:'« Les armes du shinobi sont le reflet de siècles de savoir-faire et de tradition. Les manier avec négligence, c\'est trahir ceux qui les ont perfectionnées. »',
    rebelle:'« Pas de cérémonie : une arme, c\'est un outil. Ce qui compte, c\'est de savoir lequel prendre, quand le prendre, et comment s\'en servir. Le reste, c\'est du folklore. »',
    mentor:'« Chaque arme que vous tenez porte l\'empreinte d\'un shinobi qui l\'a utilisée avant vous. Apprenez à en être digne — pas par la force, mais par la compréhension. »',
    chasseur:'« Le bon prédateur choisit son outil selon sa proie. Kunai pour le corps-à-corps rapide, shuriken pour interrompre une fuite — connaître votre arsenal, c\'est ne jamais être pris sans réponse. »',
    tacticien:'« Chaque arme couvre une plage de portée et un angle spécifiques. Comprendre ces paramètres vous permet de ne jamais laisser une situation sans solution tactique. »'
  },
  nature:{
    katon:'Le forgeron façonne l\'acier avec la chaleur — votre nature Katon vous rappelle que chaque arme est née du feu. Manier l\'acier avec ardeur, c\'est prolonger la flamme qui l\'a créé.',
    futon:'Une lame tranche parce qu\'elle concentre une force sur un fil. Votre nature Futon est exactement ça : invisible, insaisissable, mais capable de couper ce que rien d\'autre ne peut atteindre.',
    raiton:'La vitesse de dégainage, la précision du lancer — votre nature Raiton parle dans chacun de ces gestes. Une arme dans vos mains doit frapper avant que l\'adversaire ait compris.',
    doton:'Le bouclier est né de la pierre, la première arme de l\'os. Votre nature Doton vous rappelle que la robustesse d\'un outil vaut autant que son tranchant.',
    suiton:'L\'eau prend la forme du récipient. Votre nature Suiton vous apprend à couler d\'un outil à l\'autre selon ce que la situation exige, sans résistance.'
  }
},
kenjutsu_cours:{
  intro:{
    sage:'« Le Kenjutsu n\'est pas l\'art de tuer avec une lame — c\'est l\'art de comprendre la distance, le souffle et l\'intention de l\'autre. La lame ne fait que conclure ce que l\'esprit a résolu. »',
    dur:'« Tenir un katana mal, c\'est insulter les générations qui ont perfectionné cette discipline. On reprend depuis le début : posture, souffle, regard, distance. Dans l\'ordre. »',
    guerrier:'« Le katana est l\'arme qui exige tout de vous — corps, esprit, chakra alignés en un seul instant. Quand vous maîtrisez le Kenjutsu, chaque combat devient une déclaration. »',
    bienveillant:'« Le Kenjutsu peut sembler intimidant avec ses règles et ses postures — mais chaque concept que vous allez apprendre est là pour vous protéger autant que pour vous rendre efficace. »',
    mysterieux:'« On dit que le Kenjutsu parfait se termine avant de commencer : l\'adversaire voit quelque chose dans vos yeux et comprend qu\'il a déjà perdu. C\'est ce regard que vous allez cultiver. »',
    stratege:'« Le Kenjutsu repose sur quatre piliers interdépendants : le code, le souffle, le regard et la distance. Démontez-les un par un et vous comprendrez pourquoi un duelliste préparé bat un combattant plus fort. »',
    veteran:'« J\'ai survécu à des duels que je n\'aurais pas dû survivre. Pas parce que j\'étais le meilleur — parce que je contrôlais ma respiration quand l\'autre ne contrôlait plus rien. »',
    fraternel:'« Le katana, c\'est un engagement. Pas juste une arme qu\'on sort et qu\'on range — une relation. Aujourd\'hui, on commence cette relation du bon pied, ensemble. »',
    ironique:'« Le Kenjutsu : parce que parfois, un kunai ne suffit pas à exprimer ce qu\'on ressent. Mais on va commencer par les bases, ne vous emballez pas. »',
    ermite:'« Le roseau plie dans le vent sans se briser. Le Bushidō fonctionne pareil — ce n\'est pas une cage de règles, c\'est une colonne vertébrale souple qui vous garde debout sous la pression. »',
    ombre:'« La lame est l\'arme la plus silencieuse qui soit quand elle est bien maniée. Le Kenjutsu n\'est pas spectaculaire — il est définitif. »',
    sensei_noble:'« Le Bushidō n\'est pas qu\'un code de combat — c\'est une manière d\'être shinobi. L\'apprendre, c\'est comprendre pourquoi Konoha a survécu là où d\'autres ont péri. »',
    rebelle:'« Oubliez l\'image du sabreur élégant. Le Kenjutsu, dans la vraie vie, c\'est économie de gestes, efficacité maximale, et savoir exactement où vous mettez les pieds. »',
    mentor:'« Le katana ne s\'arrête pas à la lame — il commence dans la respiration, traverse le regard, et trouve sa résolution dans le mouvement. »',
    chasseur:'« La chasse commence bien avant le contact — elle commence dans le regard. Le Metsuke que vous allez apprendre, c\'est votre regard de traqueur : vaste, calme, qui ne rate rien. »',
    tacticien:'« Kokyu, Metsuke, Maai — trois variables qui définissent l\'issue de la majorité des duels à la lame. Comprenez leur interaction et vous aurez toujours une longueur d\'avance. »'
  },
  nature:{
    katon:'La forge est au cœur du Kenjutsu — votre nature Katon vous le rappelle à chaque duel. La chaleur de votre ardeur doit traverser la lame : frapper avec Kokyu, c\'est libérer une flamme contenue.',
    futon:'Le tranchant parfait ressemble au vent : il passe avant qu\'on l\'entende. Votre nature Futon s\'exprime dans le Maai — la gestion de la distance.',
    raiton:'L\'éclair ne s\'annonce pas : il est là avant le tonnerre. Votre nature Raiton transforme le Kenjutsu en art de la première frappe — Metsuke absolu, dégainage invisible.',
    doton:'Le Maai est une frontière. Votre nature Doton vous apprend à tenir cette frontière comme un mur de roche — impassible, impossible à franchir sans conséquences.',
    suiton:'La respiration est un flux, comme l\'eau. Votre nature Suiton s\'exprime dans le Kokyu — ce souffle qui ne s\'arrête jamais, qui s\'adapte à l\'intensité du duel.'
  }
},
kenjutsu_double:{
  intro:{
    sage:'« Deux lames, c\'est deux fois plus de décisions à prendre en une fraction de seconde. Le Nitōryū n\'est pas pour ceux qui cherchent la puissance — c\'est pour ceux qui ont trouvé la clarté. »',
    dur:'« Le Nitōryū est exigeant. Si vous pensez que tenir deux lames vous rend deux fois plus dangereux sans le double de travail, sortez de ce cours et réfléchissez. »',
    guerrier:'« Deux lames, c\'est le combat porté à son intensité maximale. Chaque bras devient une menace indépendante — vous n\'attaquez plus, vous submergez. »',
    bienveillant:'« Le Nitōryū demande beaucoup de coordination — ne vous découragez pas si les premiers gestes semblent désynchronisés. C\'est normal, et ça se règle avec patience. »',
    mysterieux:'« On raconte que les premiers maîtres du Nitōryū méditaient avec une lame dans chaque main pour apprendre à penser des deux côtés du silence. »',
    stratege:'« Le Nitōryū divise le champ de combat en deux zones d\'action simultanées. Maîtriser ce style, c\'est forcer l\'adversaire à gérer deux menaces — aucun système défensif ne couvre les deux. »',
    veteran:'« J\'ai combattu des utilisateurs du Nitōryū. La chose la plus déstabilisante, c\'est qu\'on ne sait jamais laquelle des deux lames va décider. Vous allez apprendre à construire cette incertitude. »',
    fraternel:'« Deux lames, ça semble compliqué — et ça l\'est, un peu. Mais une fois que vos deux bras commencent à parler le même langage, c\'est quelque chose d\'assez incroyable à voir. »',
    ironique:'« Parce qu\'une seule lame ne vous semblait apparemment pas suffisamment compliquée. Bienvenue au Nitōryū — le style pour ceux qui aiment se donner du travail. »',
    ermite:'« Le crabe a deux pinces et chacune agit selon ses propres lois. Le Nitōryū, c\'est ça : deux lames avec deux volontés, coordonnées par un seul esprit au centre. »',
    ombre:'« Le Nitōryū sert un objectif précis : saturer la défense adverse. Deux angles d\'attaque simultanés éliminent les fenêtres de parade — c\'est une question d\'architecture, pas de spectacle. »',
    sensei_noble:'« Le Nitōryū est un héritage rare — peu de traditions maîtrisent ce style. L\'aborder, c\'est entrer dans une lignée d\'exceptions. Faites-en honneur. »',
    rebelle:'« Deux lames, pas de fioritures. Le Nitōryū existe parce que parfois une seule lame ne clôt pas le débat. Apprenez à les faire fonctionner ensemble et vous ne manquerez plus d\'arguments. »',
    mentor:'« Chaque lame représente une moitié de vous-même — l\'une défend, l\'autre avance. Le Nitōryū est une pratique d\'unité intérieure autant que de combat extérieur. »',
    chasseur:'« Une proie peut esquiver une frappe. Deux frappes simultanées depuis des angles différents, c\'est une toute autre histoire. Le Nitōryū transforme chaque duel en piège à deux mâchoires. »',
    tacticien:'« Le Nitōryū repose sur la saturation du système défensif adverse. Chaque lame couvre un secteur, chaque mouvement force l\'adversaire à prioriser — et toute priorité crée un angle mort. »'
  },
  nature:{
    katon:'Deux flammes valent mieux qu\'une — mais seulement si elles brûlent en harmonie. Le Nitōryū, pour un pratiquant Katon, c\'est doubler la pression ardente jusqu\'à ce que la résistance fonde.',
    futon:'Le vent tourbillonnant coupe dans toutes les directions. Votre nature Futon est idéalement exprimée dans le Nitōryū : deux lames en flux constant créent une tempête sans refuge.',
    raiton:'La foudre bifurquée frappe deux points en un éclair. Votre nature Raiton dans le Nitōryū : deux impacts simultanés, trop rapides pour être distingués.',
    doton:'Deux piliers portent plus qu\'un. Votre nature Doton rappelle que le Nitōryū n\'est pas qu\'attaque — c\'est une architecture défensive : une lame bloque pendant que l\'autre répond.',
    suiton:'Le courant bifurqué entoure l\'obstacle et le dissout par les deux côtés. Votre nature Suiton dans le Nitōryū : encercler la défense, jamais frontalement, toujours en flux.'
  }
},
bourrasque:{
  intro:{
    sage:'« La Bourrasque Ardente est née d\'une question simple : que se passe-t-il quand un shinobi cesse de regarder dans une seule direction ? La réponse, vous allez l\'apprendre dans votre corps. »',
    dur:'« Cette technique demande une rotation parfaite, un équilibre sans faille. Imparfaite, elle vous laisse à découvert. On ne bâcle pas la Bourrasque. »',
    guerrier:'« La Bourrasque Ardente, c\'est l\'engagement total — vous ne défendez plus, vous n\'avancez plus, vous devenez la tempête elle-même. Tout le corps, toutes les directions, un seul instant. »',
    bienveillant:'« La Bourrasque peut sembler impressionnante, mais elle repose sur des principes que vous maîtrisez déjà. On va construire ça ensemble, étape par étape. »',
    mysterieux:'« Il existe un instant dans la rotation — une fraction de seconde où le pratiquant ne voit plus rien et voit tout en même temps. C\'est là que vit la vraie Bourrasque. »',
    stratege:'« La Bourrasque Ardente neutralise l\'avantage numérique en couvrant un arc de 360 degrés en une séquence unique. Son efficacité repose sur le timing d\'initiation. »',
    veteran:'« J\'ai vu cette technique briser une formation de quatre shinobi en moins de deux secondes. La Bourrasque est dévastatrice quand elle est bien placée. »',
    fraternel:'« Honnêtement ? Quand vous réussissez la Bourrasque pour la première fois et que ça sort proprement, c\'est un des meilleurs sentiments que le Taijutsu peut vous offrir. »',
    ironique:'« Un coup de pied à 360 degrés. Oui, ça tourne. Non, ce n\'est pas juste pour faire joli — bien que l\'effet visuel soit indéniable. »',
    ermite:'« La toupie, le tourbillon, le typhon — la nature tourne sur elle-même pour concentrer sa force. La Bourrasque, c\'est la même loi physique appliquée à un shinobi. »',
    ombre:'« La Bourrasque Ardente est une solution à la surnombre. Un seul mouvement, couverture totale. Si vous êtes encerclé, cette technique est votre sortie de secours. »',
    sensei_noble:'« La Bourrasque Ardente est une technique propre à l\'école de Taijutsu de Konoha. La maîtriser, c\'est porter quelque chose de notre village en vous. »',
    rebelle:'« Un coup de pied qui fait le tour complet. Efficace, brutal, difficile à parer. Exactement le genre de technique qui mérite qu\'on y consacre du temps. »',
    mentor:'« La Bourrasque vous demande de lâcher prise sur votre équilibre habituel pour en trouver un nouveau, en mouvement. C\'est une métaphore du shinobi accompli. »',
    chasseur:'« La proie encerclée cherche une sortie. La Bourrasque supprime cette sortie — elle ferme le cercle de l\'intérieur et frappe tout ce qui s\'approche. »',
    tacticien:'« La Bourrasque Ardente couvre l\'intégralité du périmètre immédiat en une séquence ininterrompue. Usage optimal : contre des cibles en arc ou en encerclement. »'
  },
  nature:{
    katon:'Une flamme tournoyante est plus difficile à éteindre. Votre nature Katon donne à la Bourrasque une dimension supplémentaire : chaque rotation attise l\'ardeur.',
    futon:'Le tourbillon est l\'expression la plus pure de votre nature Futon — une force centrifuge invisible qui étreint tout ce qui est à portée.',
    raiton:'La vitesse de rotation détermine la puissance d\'impact. Votre nature Raiton transforme la Bourrasque en décharge circulaire que l\'adversaire perçoit à peine.',
    doton:'La rotation prend son origine dans l\'appui au sol. Votre nature Doton vous rappelle que la Bourrasque commence dans les pieds, dans la terre.',
    suiton:'Un courant circulaire emporte tout ce qu\'il entoure sans effort. Votre nature Suiton exprime la Bourrasque comme un vortex fluide et inévitable.'
  }
},
pied_aube:{
  intro:{
    sage:'« Le Pied de l\'Aube n\'est pas une attaque — c\'est une question posée au ciel. Pouvez-vous convaincre la pesanteur de devenir votre alliée ? »',
    dur:'« Un saut sans intention n\'est qu\'une chute contrôlée. Recommencez jusqu\'à ce que chaque millimètre de cette trajectoire soit voulu. »',
    guerrier:'« Ce coup est né sur les champs de bataille, là où toucher le sol trop longtemps signifiait mourir. Chaque répétition doit brûler comme si votre vie en dépendait. »',
    bienveillant:'« Cette technique peut sembler intimidante au premier abord, mais elle n\'a qu\'un seul secret : faire confiance à son corps. Allez-y doucement, et elle viendra. »',
    mysterieux:'« Il est dit que l\'Aube frappe avant même que l\'obscurité réalise qu\'elle a été traversée. Apprenez à exister dans cet instant. »',
    stratege:'« Le Pied de l\'Aube convertit l\'élan vertical en force d\'impact. Maîtrisez l\'angle de descente et vous multiplierez la puissance par trois sans effort supplémentaire. »',
    veteran:'« J\'ai vu des genins briser des formations entières avec cette technique. Pas parce qu\'ils étaient forts — parce qu\'ils avaient répété jusqu\'à ce que leur corps le fasse seul. »',
    fraternel:'« Allez, on va pas se mentir — c\'est le genre de coup qui impressionne tout le monde dès la première fois qu\'on le sort proprement. Autant l\'apprendre bien dès le début ! »',
    ironique:'« Un coup de pied qui tombe du ciel. Révolutionnaire. Heureusement que quelqu\'un a pensé à ajouter le chakra, sinon on appellerait ça juste "tomber sur quelqu\'un". »',
    ermite:'« Les rapaces plongent à la verticale depuis les hauteurs — ils ne combattent pas la gravité, ils la chevauchent. C\'est exactement ce que vous allez apprendre. »',
    ombre:'« Cette technique efface la distance entre vous et la cible en moins d\'une seconde. Apprenez à la déclencher sans signal préalable. L\'ennemi ne doit rien anticiper. »',
    sensei_noble:'« Le Pied de l\'Aube est l\'une des techniques fondatrices du taijutsu de Konoha. C\'est un honneur de la maîtriser dignement. »',
    rebelle:'« Oubliez les postures parfaites. Ce coup, vous l\'apprenez avec vos jambes et vos tripes — pas avec un manuel. Faites-le tomber juste. »',
    mentor:'« Avant de frapper, demandez-vous : est-ce le poids du corps qui descend, ou est-ce l\'intention qui entraîne le corps ? La réponse change tout. »',
    chasseur:'« Une proie qui regarde vos mains ne voit jamais le coup venir d\'en haut. Le Pied de l\'Aube est une leçon sur les angles morts — les leurs. »',
    tacticien:'« Cette technique crée une zone de menace verticale que la plupart des adversaires ne savent pas défendre. Positionnez-vous correctement et elle force des ouvertures. »'
  },
  nature:{
    katon:'Une flamme ne reste pas au sol — elle s\'élève, cherche l\'air. Votre frappe doit naître de la même impulsion : monter pour mieux retomber avec toute la chaleur accumulée.',
    futon:'Le vent prend de la hauteur pour acquérir sa force de frappe. L\'altitude est une arme — chaque rafale qui descend des montagnes vous le prouve.',
    raiton:'La foudre tombe — elle ne remonte jamais. Elle choisit son point d\'impact avec une précision absolue. Votre descente doit avoir cette même certitude.',
    doton:'La terre appelle tout ce qui s\'en éloigne. Utilisez cette force — laissez le sol vous rappeler à lui, et rendez cet appel dévastateur pour celui qui se trouve dessous.',
