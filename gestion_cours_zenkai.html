<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenkai - Académie Ninja de Konoha</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Cinzel:wght@700;900&display=swap');

:root {
  /* Skin accent — overridden by [data-skin] */
  --skin-primary: #9a7b2e;
  --skin-primary-bright: #7a6020;
  --skin-secondary: #d97a1e;
  --skin-gradient: linear-gradient(90deg, #d43a1a, #d97a1e, #9a7b2e);
  --skin-glow: rgba(150,120,40,0.06);
  --skin-bg-tint: rgba(154,123,46,0.08);
  --skin-bg-tint-light: rgba(154,123,46,0.1);

  /* Light theme base */
  --bg-base: #f5f3ef;
  --bg-surface: #ffffff;
  --bg-card: #ffffff;
  --bg-card-alt: #faf8f5;
  --bg-hover: #f0ece5;
  --bg-input: #faf8f5;
  --bg-parchment: #fdf8f0;
  --header-bg: linear-gradient(180deg, #ffffff 0%, #f8f6f2 100%);
  --accent-fire: #d43a1a;
  --accent-orange: #d97a1e;
  --accent-gold: var(--skin-primary);
  --accent-gold-bright: var(--skin-primary-bright);
  --accent-leaf: #3a7a30;
  --accent-leaf-bright: #2e6e26;
  --konoha-red: #9b2020;
  --konoha-red-bright: #b33025;
  --text: #3a3632;
  --text-bright: #1a1816;
  --text-dim: #6b655c;
  --text-muted: #9a948a;
  --border: #ddd8d0;
  --border-warm: #d5cec2;
  --shadow: 0 2px 10px rgba(0,0,0,0.08);
  --shadow-glow: 0 0 12px var(--skin-glow);
  --radius: 6px;
  --radius-lg: 10px;
  --transition: 0.2s ease;
  --svg-fill: var(--skin-primary);
  /* Nature colors */
  --katon: #c43618;
  --futon: #2a8a70;
  --raiton: #a89020;
  --doton: #7a5530;
  --suiton: #1e6aa0;
}

/* ====== DARK THEME ====== */
[data-theme="dark"] {
  --bg-base: #121212;
  --bg-surface: #1a1a1a;
  --bg-card: #1e1e1e;
  --bg-card-alt: #232323;
  --bg-hover: #2a2a2a;
  --bg-input: #252525;
  --bg-parchment: #1c1a16;
  --header-bg: linear-gradient(180deg, #1a1a1a 0%, #151515 100%);
  --accent-leaf: #4a9a40;
  --accent-leaf-bright: #3e8e36;
  --konoha-red: #c03030;
  --konoha-red-bright: #d04040;
  --text: #d0ccc4;
  --text-bright: #eae6de;
  --text-dim: #908a80;
  --text-muted: #686058;
  --border: #333330;
  --border-warm: #3a3632;
  --shadow: 0 2px 10px rgba(0,0,0,0.3);
}

/* ====== SKIN: KATON (Feu) ====== */
[data-skin="katon"] {
  --skin-primary: #c43618;
  --skin-primary-bright: #a82e14;
  --skin-secondary: #e85a30;
  --skin-gradient: linear-gradient(90deg, #a82e14, #c43618, #e85a30);
  --skin-glow: rgba(196,54,24,0.10);
  --skin-bg-tint: rgba(196,54,24,0.10);
  --skin-bg-tint-light: rgba(196,54,24,0.14);
  --skin-ambient: radial-gradient(ellipse at 80% 20%, rgba(196,54,24,0.07) 0%, transparent 60%), radial-gradient(ellipse at 20% 80%, rgba(232,90,48,0.05) 0%, transparent 50%);
  --skin-header-accent: linear-gradient(90deg, transparent, rgba(196,54,24,0.08), transparent);
  --skin-particle: '🔥';
  --skin-icon: '🔥';
}
/* ====== SKIN: FUTON (Vent) ====== */
[data-skin="futon"] {
  --skin-primary: #2a8a70;
  --skin-primary-bright: #1e7a60;
  --skin-secondary: #40b898;
  --skin-gradient: linear-gradient(90deg, #1e7a60, #2a8a70, #40b898);
  --skin-glow: rgba(42,138,112,0.10);
  --skin-bg-tint: rgba(42,138,112,0.10);
  --skin-bg-tint-light: rgba(42,138,112,0.14);
  --skin-ambient: radial-gradient(ellipse at 70% 30%, rgba(42,138,112,0.07) 0%, transparent 60%), radial-gradient(ellipse at 30% 70%, rgba(64,184,152,0.05) 0%, transparent 50%);
  --skin-header-accent: linear-gradient(90deg, transparent, rgba(42,138,112,0.08), transparent);
  --skin-particle: '🌬️';
  --skin-icon: '🌬️';
}
/* ====== SKIN: RAITON (Foudre) ====== */
[data-skin="raiton"] {
  --skin-primary: #a89020;
  --skin-primary-bright: #8a7618;
  --skin-secondary: #d4b830;
  --skin-gradient: linear-gradient(90deg, #8a7618, #a89020, #d4b830);
  --skin-glow: rgba(168,144,32,0.10);
  --skin-bg-tint: rgba(168,144,32,0.10);
  --skin-bg-tint-light: rgba(168,144,32,0.14);
  --skin-ambient: radial-gradient(ellipse at 60% 10%, rgba(168,144,32,0.08) 0%, transparent 60%), radial-gradient(ellipse at 40% 90%, rgba(212,184,48,0.05) 0%, transparent 50%);
  --skin-header-accent: linear-gradient(90deg, transparent, rgba(168,144,32,0.10), transparent);
  --skin-particle: '⚡';
  --skin-icon: '⚡';
}
/* ====== SKIN: DOTON (Terre) ====== */
[data-skin="doton"] {
  --skin-primary: #7a5530;
  --skin-primary-bright: #644425;
  --skin-secondary: #a07040;
  --skin-gradient: linear-gradient(90deg, #644425, #7a5530, #a07040);
  --skin-glow: rgba(122,85,48,0.10);
  --skin-bg-tint: rgba(122,85,48,0.10);
  --skin-bg-tint-light: rgba(122,85,48,0.14);
  --skin-ambient: radial-gradient(ellipse at 50% 80%, rgba(122,85,48,0.08) 0%, transparent 60%), radial-gradient(ellipse at 80% 30%, rgba(160,112,64,0.05) 0%, transparent 50%);
  --skin-header-accent: linear-gradient(90deg, transparent, rgba(122,85,48,0.08), transparent);
  --skin-particle: '🌍';
  --skin-icon: '🌍';
}
/* ====== SKIN: SUITON (Eau) ====== */
[data-skin="suiton"] {
  --skin-primary: #1e6aa0;
  --skin-primary-bright: #185888;
  --skin-secondary: #3090d0;
  --skin-gradient: linear-gradient(90deg, #185888, #1e6aa0, #3090d0);
  --skin-glow: rgba(30,106,160,0.10);
  --skin-bg-tint: rgba(30,106,160,0.10);
  --skin-bg-tint-light: rgba(30,106,160,0.14);
  --skin-ambient: radial-gradient(ellipse at 30% 60%, rgba(30,106,160,0.08) 0%, transparent 60%), radial-gradient(ellipse at 70% 20%, rgba(48,144,208,0.05) 0%, transparent 50%);
  --skin-header-accent: linear-gradient(90deg, transparent, rgba(30,106,160,0.08), transparent);
  --skin-particle: '💧';
  --skin-icon: '💧';
}

/* ====== NATURE AMBIENT BG ====== */
[data-skin] .content { background-image: var(--skin-ambient); background-attachment: fixed; }
[data-skin] .header::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:2px;
  background: var(--skin-gradient); opacity:0.6;
}

/* ====== NATURE PARTICLES ====== */
@keyframes float-up { 0%{transform:translateY(0) scale(1);opacity:0.5} 50%{opacity:0.3} 100%{transform:translateY(-100vh) scale(0.5);opacity:0} }
@keyframes float-drift { 0%{transform:translate(0,0) rotate(0deg);opacity:0.4} 33%{transform:translate(30px,-33vh) rotate(120deg);opacity:0.25} 66%{transform:translate(-20px,-66vh) rotate(240deg);opacity:0.15} 100%{transform:translate(10px,-100vh) rotate(360deg);opacity:0} }
@keyframes pulse-glow { 0%,100%{opacity:0.3;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.1)} }
@keyframes lightning-flash { 0%,90%,100%{opacity:0} 92%{opacity:0.15} 94%{opacity:0} 96%{opacity:0.25} 98%{opacity:0} }
@keyframes ripple { 0%{transform:scale(0.8);opacity:0.3} 50%{transform:scale(1.2);opacity:0.15} 100%{transform:scale(0.8);opacity:0.3} }
@keyframes earth-pulse { 0%,100%{transform:translateY(0);opacity:0.2} 50%{transform:translateY(-4px);opacity:0.35} }

#nature-particles { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
#nature-particles .np {
  position:absolute; font-size:1rem; opacity:0;
  animation-timing-function: linear; animation-iteration-count: infinite;
}
/* Katon: rising embers */
[data-skin="katon"] #nature-particles .np { animation-name: float-up; }
/* Futon: drifting leaves */
[data-skin="futon"] #nature-particles .np { animation-name: float-drift; }
/* Raiton: lightning flashes */
[data-skin="raiton"] #nature-particles .np { animation-name: lightning-flash; font-size:1.5rem; }
/* Doton: pulsing stones */
[data-skin="doton"] #nature-particles .np { animation-name: earth-pulse; }
/* Suiton: ripple droplets */
[data-skin="suiton"] #nature-particles .np { animation-name: ripple; }

/* ====== SENSEI IDENTITY CARD ====== */
.sensei-card {
  background: var(--bg-card); border:1px solid var(--border);
  border-radius: var(--radius-lg); padding:18px 20px;
  display:flex; align-items:center; gap:16px;
  margin-bottom:20px; position:relative; overflow:hidden;
}
.sensei-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background: var(--skin-gradient);
}
.sensei-card-avatar {
  width:56px; height:56px; border-radius:50%;
  background: var(--skin-bg-tint); border:2px solid var(--skin-primary);
  display:flex; align-items:center; justify-content:center;
  font-size:1.6rem; flex-shrink:0;
}
.sensei-card-info { flex:1; }
.sensei-card-name {
  font-family:'Cinzel',serif; font-size:1.05rem;
  color:var(--text-bright); font-weight:700;
}
.sensei-card-meta { font-size:0.75rem; color:var(--text-dim); margin-top:2px; }
.sensei-card-nature {
  display:flex; align-items:center; gap:6px;
  padding:4px 12px; border-radius:16px;
  background:var(--skin-bg-tint); border:1px solid var(--skin-primary);
  font-size:0.78rem; font-weight:600; color:var(--skin-primary);
  flex-shrink:0;
}

/* ====== TYPE-SPECIFIC SENSEI CARD ANIMATIONS ====== */
@keyframes avatar-pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
@keyframes avatar-shake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-3deg)} 75%{transform:rotate(3deg)} }
@keyframes avatar-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
@keyframes avatar-flame { 0%,100%{box-shadow:0 0 8px rgba(212,58,26,0.3)} 50%{box-shadow:0 0 20px rgba(212,58,26,0.6)} }
@keyframes avatar-crackle { 0%,94%,100%{box-shadow:0 0 4px var(--skin-glow)} 95%{box-shadow:0 0 20px rgba(168,144,32,0.5)} 97%{box-shadow:0 0 4px var(--skin-glow)} }
@keyframes avatar-spin-slow { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
@keyframes avatar-breathe { 0%,100%{transform:scale(1);opacity:0.9} 50%{transform:scale(1.05);opacity:1} }
.sensei-card[data-type="guerrier"] .sensei-card-avatar { animation: avatar-flame 2s ease-in-out infinite; }
.sensei-card[data-type="dur"] .sensei-card-avatar { animation: avatar-shake 3s ease-in-out infinite; }
.sensei-card[data-type="bienveillant"] .sensei-card-avatar { animation: avatar-breathe 4s ease-in-out infinite; }
.sensei-card[data-type="mysterieux"] .sensei-card-avatar { animation: avatar-float 3s ease-in-out infinite; }
.sensei-card[data-type="ermite"] .sensei-card-avatar { animation: avatar-pulse 2.5s ease-in-out infinite; }
.sensei-card[data-type="ombre"] .sensei-card-avatar { animation: avatar-crackle 4s linear infinite; opacity:0.85; }
.sensei-card[data-type="rebelle"] .sensei-card-avatar { animation: avatar-shake 1.5s ease-in-out infinite; }
.sensei-card[data-type="chasseur"] .sensei-card-avatar { animation: avatar-pulse 1.8s ease-in-out infinite; }
.sensei-card[data-type="veteran"] .sensei-card-avatar { border-style:dashed; }
.sensei-card[data-type="sensei_noble"] .sensei-card-avatar { border-width:3px; box-shadow: 0 0 12px rgba(138,112,48,0.3); }
.sensei-card[data-type="tacticien"] .sensei-card-avatar { animation: avatar-float 5s ease-in-out infinite; opacity:0.9; }
.sensei-card[data-type="mentor"] .sensei-card-avatar { animation: avatar-breathe 5s ease-in-out infinite; }
.sensei-card[data-type="fraternel"] .sensei-card-avatar { animation: avatar-pulse 3s ease-in-out infinite; }
.sensei-card[data-type="ironique"] .sensei-card-avatar { animation: avatar-shake 4s ease-in-out infinite; }
.sensei-card[data-type="stratege"] .sensei-card-avatar { border-style:double; border-width:4px; }

/* ====== NATURE BANNER (page Natures) ====== */
.nature-banner {
  background: var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:20px;
  margin-bottom:20px; position:relative; overflow:hidden;
  text-align:center;
}
.nature-banner::before {
  content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background: var(--skin-gradient);
}
.nature-banner-icon {
  font-size:2.5rem; margin-bottom:6px;
  animation: pulse-glow 3s ease-in-out infinite;
}
.nature-banner-name { font-family:'Cinzel',serif; font-size:1.1rem; color:var(--skin-primary); font-weight:700; }
.nature-banner-desc { font-size:0.82rem; color:var(--text-dim); margin-top:4px; }

/* ====== NATURE CARD HIGHLIGHT ====== */
.nature-card.n-selected {
  border-color: var(--skin-primary); border-width:2px;
  box-shadow: 0 0 16px var(--skin-glow), 0 0 32px var(--skin-glow);
  transform: scale(1.04);
}
.nature-card.n-selected::after {
  content:'✓ Votre nature'; position:absolute; top:6px; right:8px;
  font-size:0.6rem; background:var(--skin-primary); color:#fff;
  padding:2px 8px; border-radius:8px; font-weight:600;
}

/* ====== DARK THEME EXTRAS ====== */
[data-theme="dark"] .toast {
  background:var(--bg-card); border-color:var(--accent-leaf);
  color:var(--accent-leaf-bright); box-shadow:0 0 20px rgba(46,110,38,0.15);
}
[data-theme="dark"] .modal {
  background:var(--bg-card); border-color:var(--border);
}
[data-theme="dark"] .modal textarea {
  background:var(--bg-input); border-color:var(--border); color:var(--text);
}
[data-theme="dark"] .annonce-field:hover { background:var(--bg-hover); }
[data-theme="dark"] .contenu-block { background:var(--bg-card); border-color:var(--border); }
[data-theme="dark"] .admin-card { background:var(--bg-parchment); border-color:var(--border-warm); }
[data-theme="dark"] .mudra-ref-card { background:var(--bg-card); border-color:var(--border); }
[data-theme="dark"] .nature-card { background:var(--bg-card); border-color:var(--border); }
[data-theme="dark"] .arme-card { background:var(--bg-card); border-color:var(--border); }
[data-theme="dark"] .kekkei-card { background:var(--bg-card); border-color:var(--border); }
[data-theme="dark"] .sidebar { background:var(--bg-surface); border-right-color:var(--border); }
[data-theme="dark"] .mobile-nav { background:var(--bg-surface); border-bottom-color:var(--border); }

/* ====== STYLE PARCHEMIN (historique) ====== */
.scroll-card {
  background:var(--bg-parchment); border:1px solid var(--border-warm);
  border-radius:var(--radius-lg); padding:24px;
  margin-bottom:16px; position:relative; overflow:hidden;
  box-shadow:inset 0 0 30px rgba(0,0,0,0.03);
}
.scroll-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background:var(--skin-gradient); opacity:0.7;
}
.scroll-card::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:3px;
  background:var(--skin-gradient); opacity:0.3;
}
.scroll-title {
  font-family:'Cinzel',serif; font-size:1rem; color:var(--skin-primary);
  margin-bottom:16px; padding-bottom:10px;
  border-bottom:1px dashed var(--border-warm);
  display:flex; align-items:center; gap:8px;
  letter-spacing:0.5px;
}
.scroll-title .scroll-brush {
  font-size:1.2rem;
}
.scroll-subtitle {
  font-size:0.7rem; color:var(--text-muted); font-style:italic;
  font-family:'Noto Sans JP',sans-serif; letter-spacing:0;
}
.scroll-stamp {
  position:absolute; top:14px; right:16px;
  width:48px; height:48px; border-radius:50%;
  border:2px solid var(--skin-primary); opacity:0.12;
  display:flex; align-items:center; justify-content:center;
  font-size:1.6rem; transform:rotate(-15deg);
}
.scroll-seal {
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 12px; border:1px dashed var(--skin-primary);
  border-radius:4px; font-size:0.72rem; color:var(--skin-primary);
  font-style:italic; margin-top:8px;
}
[data-theme="dark"] .scroll-card {
  background:var(--bg-card); border-color:var(--border);
  box-shadow:inset 0 0 30px rgba(0,0,0,0.1);
}
/* Sauvegarde */
.save-code {
  font-family:monospace; font-size:0.7rem; word-break:break-all;
  background:var(--bg-input); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px;
  color:var(--text); max-height:120px; overflow-y:auto;
  user-select:all; line-height:1.4;
}

/* ====== ONBOARDING ====== */
.onboard-overlay {
  position:fixed; inset:0; z-index:950;
  background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center;
  animation:fadeIn 0.4s; backdrop-filter:blur(6px);
}
.onboard-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:36px 32px;
  max-width:520px; width:90%; position:relative; overflow:hidden;
  text-align:center; animation:fadeIn 0.3s;
}
.onboard-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background:var(--skin-gradient);
}
.onboard-icon { font-size:3rem; margin-bottom:12px; }
.onboard-title { font-family:'Cinzel',serif; font-size:1.3rem; color:var(--accent-gold); margin-bottom:8px; }
.onboard-text { font-size:0.88rem; color:var(--text-dim); line-height:1.7; margin-bottom:20px; }
.onboard-steps { display:flex; justify-content:center; gap:6px; margin-bottom:20px; }
.onboard-dot {
  width:10px; height:10px; border-radius:50%;
  background:var(--border); transition:var(--transition);
}
.onboard-dot.active { background:var(--skin-primary); transform:scale(1.3); }
.onboard-dot.done { background:var(--accent-leaf); }
.onboard-btns { display:flex; gap:8px; justify-content:center; }

/* ====== TOOLTIP GUIDE ====== */
.tooltip-guide {
  position:fixed; z-index:960;
  background:var(--bg-card); border:2px solid var(--skin-primary);
  border-radius:var(--radius-lg); padding:16px 20px;
  max-width:320px; box-shadow:0 4px 30px rgba(0,0,0,0.3);
  animation:fadeIn 0.25s;
}
.tooltip-guide::after {
  content:''; position:absolute; width:12px; height:12px;
  background:var(--bg-card); border:2px solid var(--skin-primary);
  border-right:none; border-bottom:none;
  transform:rotate(45deg);
}
.tooltip-guide.arrow-left::after { left:-7px; top:20px; transform:rotate(-45deg); }
.tooltip-guide.arrow-top::after { top:-7px; left:50%; margin-left:-6px; transform:rotate(45deg); }
.tooltip-guide-title { font-weight:700; color:var(--skin-primary); font-size:0.88rem; margin-bottom:6px; }
.tooltip-guide-text { font-size:0.8rem; color:var(--text-dim); line-height:1.6; }
.tooltip-guide-btns { display:flex; gap:6px; margin-top:12px; justify-content:flex-end; }

/* ====== MODE PRÉSENTATION ====== */
.pres-overlay {
  position:fixed; inset:0; z-index:900;
  background:var(--bg-base); overflow-y:auto;
  padding:40px 60px; animation:fadeIn 0.3s;
}
.pres-overlay .pres-close {
  position:fixed; top:16px; right:24px; z-index:901;
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius); padding:8px 16px;
  cursor:pointer; font-size:0.85rem; font-family:inherit;
  color:var(--text); transition:var(--transition);
}
.pres-overlay .pres-close:hover { border-color:var(--accent-gold); }
.pres-overlay .pres-title {
  font-family:'Cinzel',serif; font-size:1.8rem;
  color:var(--skin-primary); margin-bottom:8px;
}
.pres-overlay .pres-meta {
  font-size:0.9rem; color:var(--text-dim); margin-bottom:30px;
  padding-bottom:16px; border-bottom:2px solid var(--skin-primary);
}
.pres-overlay .contenu-block {
  font-size:1.05rem; line-height:2; max-width:800px;
}
.pres-overlay .contenu-block h2 { font-size:1.25rem; margin:36px 0 16px; }
.pres-overlay .contenu-block h3 { font-size:1.1rem; margin:28px 0 12px; }

/* ====== ANIMATION TOGGLE ====== */
[data-no-anim] *, [data-no-anim] *::before, [data-no-anim] *::after {
  animation: none !important;
  transition: none !important;
}
[data-no-anim] #nature-particles { display:none !important; }

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Noto Sans JP', 'Segoe UI', sans-serif;
  background: var(--bg-base);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.7;
  font-size: 15px;
}

/* ====== SCROLLBAR ====== */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border-warm); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:var(--accent-gold); }

/* ====== HEADER ====== */
.header {
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-left { display:flex; align-items:center; gap:14px; }
.konoha-symbol {
  width:36px; height:36px; position:relative;
}
.konoha-symbol svg { width:100%; height:100%; }
.header-title {
  font-family: 'Cinzel', serif;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent-gold);
  letter-spacing: 2px;
}
.header-sub {
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-top: -2px;
}
.header-right { display:flex; align-items:center; gap:8px; }

/* ====== BUTTONS ====== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-card);
  color: var(--text);
  cursor: pointer;
  font-size: 0.78rem;
  font-family: inherit;
  transition: var(--transition);
  white-space: nowrap;
}
.btn:hover { background:var(--bg-hover); border-color:var(--accent-gold); color:var(--text-bright); }
.btn-danger { border-color: var(--konoha-red); color: var(--konoha-red-bright); }
.btn-danger:hover { background:rgba(139,32,32,0.2); border-color:var(--konoha-red-bright); }
.btn-primary {
  background: linear-gradient(135deg, var(--skin-primary) 0%, var(--skin-secondary) 100%);
  border:none; color:#ffffff; font-weight:600;
}
.btn-primary:hover { opacity:0.9; color:#fff; }
.btn-sm { padding:4px 10px; font-size:0.72rem; }

/* ====== SIDEBAR + LAYOUT ====== */
.layout { display:flex; min-height:calc(100vh - 56px); }
.sidebar {
  width: 220px;
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  padding: 16px 0;
  flex-shrink: 0;
  overflow-y: auto;
  position: sticky;
  top: 56px;
  height: calc(100vh - 56px);
}
.sidebar-section { margin-bottom: 20px; }
.sidebar-label {
  padding: 0 16px;
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  cursor: pointer;
  color: var(--text-dim);
  font-size: 0.82rem;
  transition: var(--transition);
  border-left: 2px solid transparent;
}
.sidebar-item:hover { color:var(--text-bright); background:rgba(0,0,0,0.03); }
.sidebar-item.active {
  color: var(--accent-gold);
  border-left-color: var(--accent-gold);
  background: var(--skin-bg-tint);
}
.sidebar-item .si-icon { font-size:1rem; width:20px; text-align:center; flex-shrink:0; }
.sidebar-item .si-badge {
  margin-left:auto;
  font-size:0.65rem;
  padding:1px 6px;
  border-radius:8px;
  background:var(--skin-bg-tint-light);
  color:var(--accent-gold);
}
.content { flex:1; padding:24px; max-width:1200px; overflow-y:auto; }

/* ====== VIEW ====== */
.view { display:none; animation: slideInRight 0.25s ease-out; }
.view.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideInRight { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }
@keyframes slideInLeft { from{opacity:0;transform:translateX(-30px)} to{opacity:1;transform:translateX(0)} }

/* ====== PAGE HEADER ====== */
.page-header { margin-bottom:24px; }
.page-title {
  font-family:'Cinzel',serif;
  font-size:1.4rem;
  color:var(--accent-gold-bright);
  letter-spacing:1px;
}
.page-desc { font-size:0.82rem; color:var(--text-dim); margin-top:4px; }

/* ====== STATS GRID ====== */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:24px; }
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px;
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content:'';
  position:absolute; top:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg, var(--skin-primary), transparent);
}
.stat-value { font-size:1.8rem; font-weight:700; color:var(--text-bright); line-height:1; }
.stat-label { font-size:0.72rem; color:var(--text-dim); margin-top:4px; text-transform:uppercase; letter-spacing:1px; }
.stat-sub { font-size:0.75rem; color:var(--text-dim); margin-top:8px; }
.stat-card.accent-fire::before { background:linear-gradient(90deg,var(--accent-fire),transparent); }
.stat-card.accent-leaf::before { background:linear-gradient(90deg,var(--accent-leaf-bright),transparent); }
.stat-card.accent-orange::before { background:linear-gradient(90deg,var(--accent-orange),transparent); }

/* ====== PROGRESS BAR ====== */
.pbar { width:100%; height:4px; background:rgba(0,0,0,0.06); border-radius:2px; overflow:hidden; }
.pbar-lg { height:6px; border-radius:3px; }
.pbar-fill {
  height:100%; border-radius:inherit;
  background:var(--skin-gradient);
  transition: width 0.4s ease;
}
.pbar-fill.complete { background:linear-gradient(90deg,var(--accent-leaf),var(--accent-leaf-bright)); }
.pbar-text { font-size:0.7rem; color:var(--text-dim); margin-top:3px; }

/* ====== CARDS ====== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
  transition: var(--transition);
}
.card-clickable { cursor:pointer; }
.card-clickable:hover { border-color:var(--border-warm); background:var(--bg-card-alt); transform:translateY(-1px); box-shadow:var(--shadow-glow); }

/* ====== BADGES ====== */
.badge {
  display:inline-flex; align-items:center; gap:4px;
  padding:2px 8px; border-radius:4px;
  font-size:0.65rem; font-weight:500;
  letter-spacing:0.5px; text-transform:uppercase;
}
.badge-theo { background:rgba(30,106,160,0.1); color:var(--suiton); }
.badge-prat { background:rgba(46,110,38,0.1); color:var(--accent-leaf-bright); }
.badge-rang { background:var(--skin-bg-tint-light); color:var(--accent-gold); }
.badge-admin { background:rgba(155,32,32,0.1); color:var(--konoha-red-bright); }
.badge-type { background:rgba(0,0,0,0.04); color:var(--text-dim); }

.state-badge {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 10px; border-radius:12px;
  font-size:0.68rem; font-weight:500;
}
.state-non-vue { background:rgba(0,0,0,0.04); color:var(--text-dim); }
.state-en-cours { background:rgba(217,122,30,0.12); color:var(--accent-orange); }
.state-maitrisee { background:rgba(46,110,38,0.12); color:var(--accent-leaf-bright); }

/* ====== FILTERS ====== */
.filters { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.filter-input, .filter-select {
  padding:7px 12px;
  background:var(--bg-input);
  border:1px solid var(--border);
  border-radius:var(--radius);
  color:var(--text);
  font-size:0.8rem;
  font-family:inherit;
  outline:none;
  transition:var(--transition);
}
.filter-input { min-width:220px; }
.filter-input:focus, .filter-select:focus { border-color:var(--accent-gold); }
.filter-input::placeholder { color:var(--text-muted); }

/* ====== MODULE SECTION ====== */
.module-section { margin-bottom:28px; }
.module-header {
  display:flex; align-items:center; gap:10px;
  margin-bottom:12px; padding-bottom:8px;
  border-bottom:1px solid var(--border);
}
.module-name {
  font-size:0.78rem; text-transform:uppercase;
  letter-spacing:2px; color:var(--accent-gold);
  font-weight:500;
}
.module-count { font-size:0.68rem; color:var(--text-muted); }

/* ====== COURS GRID ====== */
.cours-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
.cours-card-title { font-size:0.95rem; font-weight:600; color:var(--text-bright); }
.cours-card-desc { font-size:0.78rem; color:var(--text-dim); margin:6px 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.cours-card-footer { display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
.cours-badges { display:flex; gap:5px; flex-wrap:wrap; margin:6px 0; }

/* ====== DETAIL VIEW ====== */
.detail-header {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:20px;
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}
.detail-header::after {
  content:'';position:absolute;top:0;right:0;width:120px;height:120px;
  background:radial-gradient(circle,var(--skin-glow) 0%,transparent 70%);
  pointer-events:none;
}
.detail-title { font-family:'Cinzel',serif; font-size:1.2rem; color:var(--accent-gold-bright); }
.detail-meta { font-size:0.78rem; color:var(--text-dim); margin:6px 0; }
.detail-desc { font-size:0.85rem; color:var(--text); margin:10px 0; line-height:1.7; }

.back-link {
  display:inline-flex; align-items:center; gap:6px;
  font-size:0.8rem; color:var(--text-dim); cursor:pointer;
  margin-bottom:14px; transition:var(--transition);
}
.back-link:hover { color:var(--accent-gold); }

/* ====== TECHNIQUE ITEM ====== */
.tech-item {
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  margin-bottom:12px;
  overflow:hidden;
}
.tech-item.prereq-warn { border-left:3px solid var(--konoha-red-bright); }
.tech-head {
  padding:14px 16px;
  display:flex; align-items:center; justify-content:space-between;
  cursor:pointer; gap:10px; flex-wrap:wrap;
}
.tech-head:hover { background:rgba(0,0,0,0.02); }
.tech-name { font-weight:600; color:var(--text-bright); font-size:0.9rem; display:flex; align-items:center; gap:8px; }
.tech-name .t-icon { font-size:1.05rem; }
.tech-body { padding:0 16px 16px; }
.tech-desc { font-size:0.8rem; color:var(--text-dim); margin-bottom:10px; }

.prereq-alert {
  display:flex; align-items:flex-start; gap:8px;
  padding:10px 12px; margin-bottom:10px;
  background:rgba(139,32,32,0.08);
  border:1px solid rgba(192,57,43,0.2);
  border-radius:var(--radius);
  font-size:0.78rem; color:var(--konoha-red-bright);
}

/* ====== CHECKLIST ====== */
.checklist { margin:6px 0; }
.check-row {
  display:flex; align-items:center; gap:10px;
  padding:7px 10px; margin:2px 0;
  border-radius:var(--radius);
  cursor:pointer; user-select:none;
  transition:var(--transition);
}
.check-row:hover { background:rgba(0,0,0,0.02); }
.check-row.done { opacity:0.5; }
.check-box {
  width:18px; height:18px; border:1.5px solid var(--border-warm);
  border-radius:4px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  transition:var(--transition); font-size:10px; color:transparent;
}
.check-row.done .check-box {
  background:var(--accent-leaf); border-color:var(--accent-leaf);
  color:#fff;
}
.check-text { font-size:0.82rem; }
.check-row.done .check-text { text-decoration:line-through; color:var(--text-dim); }
.check-sub { font-size:0.7rem; color:var(--text-muted); margin-left:auto; max-width:40%; text-align:right; }

/* ====== MUDRA SEQUENCE ====== */
.mudra-seq { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.mudra-pill {
  display:flex; align-items:center; gap:6px;
  padding:6px 12px; border-radius:20px;
  background:rgba(0,0,0,0.03);
  border:1px solid var(--border);
  font-size:0.78rem; cursor:pointer;
  user-select:none; transition:var(--transition);
  position:relative;
}
.mudra-pill:hover { border-color:var(--accent-gold); }
.mudra-pill .mp-num {
  width:18px; height:18px; border-radius:50%;
  background:rgba(0,0,0,0.06); display:flex; align-items:center; justify-content:center;
  font-size:0.6rem; font-weight:700; color:var(--text-dim);
}
.mudra-pill.done { background:rgba(46,110,38,0.08); border-color:var(--accent-leaf); }
.mudra-pill.done .mp-num { background:var(--accent-leaf); color:#fff; }
.mudra-pill .mp-arrow {
  position:absolute; right:-10px; top:50%; transform:translateY(-50%);
  font-size:0.6rem; color:var(--text-muted);
}

/* ====== NOTES ====== */
.notes-section { margin-top:12px; }
.notes-toggle {
  font-size:0.75rem; color:var(--text-dim); cursor:pointer;
  display:flex; align-items:center; gap:4px;
}
.notes-toggle:hover { color:var(--text); }
.notes-area {
  width:100%; min-height:50px; max-height:150px;
  background:var(--bg-input); border:1px solid var(--border);
  border-radius:var(--radius); padding:8px 12px;
  color:var(--text); font-size:0.8rem; font-family:inherit;
  resize:vertical; outline:none; margin-top:6px;
  transition:var(--transition);
}
.notes-area:focus { border-color:var(--accent-gold); }

/* ====== MUDRAS REF ====== */
.mudra-ref-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
.mudra-ref-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:14px;
  display:flex; gap:12px; align-items:flex-start;
  transition:var(--transition);
}
.mudra-ref-card.mastered { border-color:var(--accent-leaf); }
.mrc-num {
  width:32px; height:32px; border-radius:50%;
  background:var(--bg-base); display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:0.85rem; color:var(--text-dim); flex-shrink:0;
}
.mudra-ref-card.mastered .mrc-num { background:var(--accent-leaf); color:#fff; }
.mrc-name { font-weight:600; color:var(--text-bright); font-size:0.9rem; }
.mrc-fn { font-size:0.75rem; color:var(--text-dim); margin-top:2px; }

/* ====== NATURES ====== */
.nature-wheel {
  display:flex; flex-wrap:wrap; gap:12px; margin:16px 0;
  justify-content:center;
}
.nature-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:16px;
  min-width:180px; flex:1; max-width:220px;
  text-align:center; position:relative; overflow:hidden;
}
.nature-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
}
.nature-card.n-katon::before { background:var(--katon); }
.nature-card.n-futon::before { background:var(--futon); }
.nature-card.n-raiton::before { background:var(--raiton); }
.nature-card.n-doton::before { background:var(--doton); }
.nature-card.n-suiton::before { background:var(--suiton); }
.nc-icon { font-size:1.6rem; margin-bottom:6px; }
.nc-name { font-weight:700; font-size:1rem; }
.nc-element { font-size:0.72rem; color:var(--text-dim); margin-bottom:6px; }
.nc-force { font-size:0.78rem; margin:6px 0; }
.nc-vs { font-size:0.72rem; margin-top:4px; }

/* ====== ARMES ====== */
.arme-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:16px;
}
.arme-name { font-weight:600; color:var(--text-bright); font-size:0.95rem; }
.arme-size { font-size:0.72rem; color:var(--accent-gold); margin:4px 0; }
.arme-desc { font-size:0.78rem; color:var(--text-dim); }

/* ====== KEKKEI GRID ====== */
.kekkei-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; margin-top:16px; }
.kekkei-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px;
}
.kekkei-name { font-weight:600; color:var(--text-bright); font-size:0.88rem; }
.kekkei-combo { font-size:0.75rem; color:var(--text-dim); margin:3px 0; }
.kekkei-art { font-size:0.78rem; }

/* ====== ADMIN RULES ====== */
.admin-card {
  background:var(--bg-parchment);
  border:1px solid var(--border-warm);
  border-radius:var(--radius-lg);
  padding:20px;
  position:relative;
}
.admin-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,var(--konoha-red),transparent);
}
.admin-title { font-family:'Cinzel',serif; color:var(--konoha-red-bright); font-size:1rem; margin-bottom:10px; }
.admin-sig { font-style:italic; color:var(--accent-gold); margin-top:12px; font-size:0.82rem; }

/* ====== ANNONCES ====== */
.annonce-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:14px 16px;
  margin-bottom:8px; transition:var(--transition);
}
.annonce-card:hover { border-color:var(--accent-gold); box-shadow:var(--shadow); }
.annonce-card-title {
  font-size:0.9rem; font-weight:700; color:var(--text-bright);
  margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border);
}
.annonce-fields { display:flex; flex-direction:column; gap:4px; }
.annonce-field {
  display:flex; align-items:center; gap:8px;
  padding:6px 10px; border-radius:var(--radius);
  cursor:pointer; transition:var(--transition);
}
.annonce-field:hover { background:var(--bg-hover); }
.annonce-field.copied { background:rgba(46,110,38,0.06); }
.af-label {
  font-size:0.7rem; text-transform:uppercase; letter-spacing:1px;
  color:var(--text-muted); width:110px; flex-shrink:0;
}
.af-value {
  flex:1; font-size:0.82rem; font-family:monospace;
  color:var(--text); user-select:all;
}
.af-copy { font-size:0.85rem; opacity:0.3; transition:var(--transition); }
.annonce-field:hover .af-copy { opacity:1; }
.annonce-field.copied .af-copy::after { content:' ✓'; color:var(--accent-leaf); font-weight:700; }

/* ====== MODAL ====== */
.modal-bg {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.3);
  display:none; align-items:center; justify-content:center;
  z-index:500; padding:20px;
  backdrop-filter:blur(4px);
}
.modal-bg.open { display:flex; }
.modal {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:24px;
  max-width:500px; width:100%; max-height:80vh; overflow-y:auto;
}
.modal h3 { font-family:'Cinzel',serif; color:var(--accent-gold); margin-bottom:12px; }
.modal textarea {
  width:100%; min-height:180px;
  background:var(--bg-input); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px;
  color:var(--text); font-family:monospace; font-size:0.78rem;
  resize:vertical; outline:none;
}
.modal-btns { display:flex; gap:8px; margin-top:14px; justify-content:flex-end; }

/* ====== TOAST ====== */
.toast {
  position:fixed; bottom:20px; right:20px;
  background:var(--bg-card); border:1px solid var(--accent-leaf);
  border-radius:var(--radius); padding:12px 22px;
  font-size:0.85rem; color:var(--accent-leaf-bright);
  box-shadow:0 0 20px rgba(46,110,38,0.3); z-index:600;
  opacity:0; transform:translateY(12px) scale(0.95);
  transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1); pointer-events:none;
}
.toast.show { opacity:1; transform:translateY(0) scale(1); }

/* ====== COPY SUCCESS ANIMATION ====== */
@keyframes copyPulse {
  0% { box-shadow:0 0 0 0 rgba(46,110,38,0.5); }
  50% { box-shadow:0 0 0 8px rgba(46,110,38,0); }
  100% { box-shadow:0 0 0 0 rgba(46,110,38,0); }
}
@keyframes copyCheck {
  0% { transform:scale(0) rotate(-45deg); opacity:0; }
  50% { transform:scale(1.3) rotate(0deg); opacity:1; }
  100% { transform:scale(1) rotate(0deg); opacity:1; }
}
.copy-success {
  animation:copyPulse 0.6s ease-out;
  border-color:var(--accent-leaf) !important;
  background:rgba(46,110,38,0.08) !important;
  transition:background 0.3s, border-color 0.3s;
}
.copy-success .copy-check {
  animation:copyCheck 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
.copy-check {
  display:inline-block;
  color:var(--accent-leaf);
  font-weight:700;
  margin-left:6px;
  opacity:0;
}

/* ====== SENSEI PROFILE ====== */
.sensei-form { max-width:600px; }
.sensei-field { margin-bottom:18px; }
.sensei-field label {
  display:block; font-size:0.72rem; text-transform:uppercase;
  letter-spacing:1.5px; color:var(--text-muted); margin-bottom:6px; font-weight:500;
}
.sensei-field input {
  width:100%; padding:10px 14px;
  background:var(--bg-input); border:1px solid var(--border);
  border-radius:var(--radius); color:var(--text);
  font-size:0.88rem; font-family:inherit; outline:none;
  transition:var(--transition);
}
.sensei-field input:focus { border-color:var(--accent-gold); }
.sensei-field input::placeholder { color:var(--text-muted); }
.nature-selector { display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
.nature-opt {
  flex:1; min-width:140px; padding:14px;
  background:var(--bg-card); border:2px solid var(--border);
  border-radius:var(--radius-lg); cursor:pointer;
  text-align:center; transition:var(--transition);
  position:relative; overflow:hidden;
}
.nature-opt::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  opacity:0.5; transition:var(--transition);
}
.nature-opt:hover { border-color:var(--border-warm); transform:translateY(-2px); box-shadow:var(--shadow); }
.nature-opt.selected { border-color:var(--accent-gold); background:var(--skin-bg-tint); }
.nature-opt.selected[style*="border-color"] { background:rgba(0,0,0,0.03); }
.nature-opt.selected::before { opacity:1; }
.nature-opt.n-katon::before { background:var(--katon); }
.nature-opt.n-futon::before { background:var(--futon); }
.nature-opt.n-raiton::before { background:var(--raiton); }
.nature-opt.n-doton::before { background:var(--doton); }
.nature-opt.n-suiton::before { background:var(--suiton); }
.nature-opt .no-icon { font-size:1.4rem; margin-bottom:4px; }
.nature-opt .no-name { font-weight:700; font-size:0.9rem; color:var(--text-bright); }
.nature-opt .no-element { font-size:0.72rem; color:var(--text-dim); }
.nature-opt .no-check { display:none; position:absolute; top:8px; right:10px; font-size:0.9rem; color:var(--accent-leaf); }
.nature-opt.selected .no-check { display:block; }
.sensei-preview {
  background:var(--bg-parchment); border:1px solid var(--border-warm);
  border-radius:var(--radius-lg); padding:18px; margin-top:24px;
  position:relative; overflow:hidden;
}
.sensei-preview::before {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,var(--accent-gold),transparent);
}
.sensei-preview-title {
  font-family:'Cinzel',serif; font-size:0.85rem;
  color:var(--accent-gold); margin-bottom:10px;
  text-transform:uppercase; letter-spacing:1px;
}

/* ====== RESPONSIVE ====== */
@media(max-width:900px) {
  .sidebar { display:none; }
  .layout { flex-direction:column; }
  .mobile-nav {
    display:flex !important;
    overflow-x:auto; background:var(--bg-surface);
    border-bottom:1px solid var(--border);
  }
  .content { padding:16px; }
  .cours-grid { grid-template-columns:1fr; }
}
@media(min-width:901px) {
  .mobile-nav { display:none !important; }
}
.mobile-nav {
  display:none;
  gap:0;
}
.mobile-nav-item {
  padding:10px 16px; white-space:nowrap;
  font-size:0.78rem; color:var(--text-dim);
  cursor:pointer; border-bottom:2px solid transparent;
  transition:var(--transition);
}
.mobile-nav-item:hover { color:var(--text); }
.mobile-nav-item.active { color:var(--skin-primary); border-bottom-color:var(--skin-primary); }

/* ====== HIERARCHY ====== */
.hierarchy-track {
  display:flex; align-items:center; gap:0;
  overflow-x:auto; padding:10px 0; margin:10px 0;
}
.hier-node {
  padding:6px 14px; background:var(--bg-card);
  border:1px solid var(--border); border-radius:16px;
  font-size:0.72rem; white-space:nowrap; color:var(--text-dim);
  flex-shrink:0;
}
.hier-node.current { background:var(--skin-bg-tint); border-color:var(--accent-gold); color:var(--accent-gold); }
.hier-arrow { color:var(--text-muted); font-size:0.6rem; margin:0 2px; flex-shrink:0; }

/* ====== CONTENU THÉORIQUE ====== */
.contenu-block {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:24px;
  margin-bottom:16px;
  line-height:1.85;
  font-size:0.9rem;
  color:var(--text);
}
.contenu-block h2 {
  font-family:'Cinzel',serif;
  font-size:1.05rem;
  color:var(--accent-gold-bright);
  margin:28px 0 12px;
  padding-bottom:6px;
  border-bottom:1px solid var(--border);
  letter-spacing:0.5px;
}
.contenu-block h2:first-child { margin-top:0; }
.contenu-block h3 {
  font-size:0.92rem;
  color:var(--text-bright);
  margin:18px 0 8px;
  font-weight:600;
}
.contenu-block p {
  margin:8px 0;
}
.contenu-block ul {
  margin:6px 0 6px 20px;
  list-style:disc;
}
.contenu-block ul li {
  margin:4px 0;
  font-size:0.85rem;
}
.contenu-block strong { color:var(--text-bright); }
.contenu-block .contenu-table {
  width:100%;
  border-collapse:collapse;
  margin:12px 0;
  font-size:0.82rem;
}
.contenu-block .contenu-table th {
  background:rgba(0,0,0,0.03);
  border:1px solid var(--border);
  padding:8px 12px;
  text-align:left;
  font-weight:600;
  color:var(--text-bright);
}
.contenu-block .contenu-table td {
  border:1px solid var(--border);
  padding:8px 12px;
}
.contenu-toggle {
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 16px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  margin-bottom:16px;
  cursor:pointer;
  font-size:0.88rem;
  font-weight:600;
  color:var(--accent-gold-bright);
  transition:var(--transition);
}
.contenu-toggle:hover { background:var(--bg-hover); }
.contenu-toggle .ct-arrow { transition:transform 0.2s; }
.contenu-toggle.open .ct-arrow { transform:rotate(90deg); }

/* ====== READING MODE TABS (théorique) ====== */
.reading-tabs {
  display:flex;
  gap:0;
  margin-bottom:0;
  border-bottom:2px solid var(--border);
}
.reading-tab {
  padding:10px 20px;
  cursor:pointer;
  font-size:0.82rem;
  font-weight:600;
  color:var(--text-dim);
  background:var(--bg-card);
  border:1px solid var(--border);
  border-bottom:none;
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  transition:var(--transition);
  position:relative;
  top:2px;
}
.reading-tab:hover { color:var(--text); background:var(--bg-hover); }
.reading-tab.active {
  color:var(--accent-gold-bright);
  background:var(--bg-main);
  border-bottom:2px solid var(--bg-main);
}
.reading-tab .tab-icon { margin-right:6px; }
.contenu-block.tab-content {
  border:1px solid var(--border);
  border-top:none;
  border-radius:0 0 var(--radius-lg) var(--radius-lg);
  margin-bottom:16px;
}
.resume-block { padding:20px 24px; }
.resume-block h3 { margin:0 0 12px; font-size:0.95rem; color:var(--accent-gold-bright); }
.resume-block ul { margin:0 0 16px; padding-left:20px; }
.resume-block li { margin-bottom:8px; line-height:1.5; font-size:0.85rem; }
.resume-block li strong { color:var(--accent-gold); }
.resume-section { margin-bottom:20px; }
.resume-section:last-child { margin-bottom:0; }

/* ====== COURSE FLAVOR (personality + nature) ====== */
.flavor-intro {
  background:linear-gradient(135deg,var(--skin-bg-tint),transparent);
  border-left:3px solid var(--skin-primary);
  padding:12px 16px;
  margin-bottom:18px;
  border-radius:0 var(--radius) var(--radius) 0;
  font-style:italic;
  font-size:0.88rem;
  line-height:1.6;
  color:var(--text);
}
.flavor-nature {
  background:rgba(var(--skin-primary-rgb,200,160,60),0.08);
  border:1px solid rgba(var(--skin-primary-rgb,200,160,60),0.2);
  padding:10px 14px;
  margin:14px 0;
  border-radius:var(--radius);
  font-size:0.82rem;
  line-height:1.5;
  color:var(--text-dim);
}
.flavor-nature::before {
  content:attr(data-icon) ' ';
  font-style:normal;
}

/* ====== INTERACTIVE COURSE ====== */
.interactif-wrapper{max-width:720px}
.interactif-steps{display:flex;align-items:center;gap:0;margin-bottom:20px;overflow-x:auto;padding:4px 0}
.interactif-dot{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;border:2px solid var(--border);background:var(--bg-card);color:var(--text-muted);cursor:default;transition:var(--transition)}
.interactif-dot.done{background:var(--accent-leaf);border-color:var(--accent-leaf);color:#fff;cursor:pointer}
.interactif-dot.active{border-color:var(--accent-gold);color:var(--accent-gold);background:rgba(154,123,46,0.1)}
.interactif-dot.done.active{background:var(--accent-leaf);border-color:var(--accent-gold);box-shadow:0 0 0 2px var(--skin-bg-tint-light)}
.interactif-line{flex:1;height:2px;background:var(--border);min-width:8px}
.interactif-line.done{background:var(--accent-leaf)}
.bloc-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:16px;animation:fadeIn 0.3s}
.bloc-titre{font-family:'Cinzel',serif;font-size:1.05rem;color:var(--accent-gold-bright);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bloc-titre .bloc-num{font-size:0.65rem;padding:2px 8px;border-radius:10px;background:var(--skin-bg-tint-light);color:var(--accent-gold)}
.bloc-texte{font-size:0.88rem;line-height:1.8;color:var(--text)}
.bloc-texte p{margin:8px 0}
.bloc-texte ul{margin:6px 0 6px 20px;list-style:disc}
.bloc-texte ul li{margin:4px 0;font-size:0.85rem}
.bloc-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 24px;margin-top:16px;border:none;border-radius:var(--radius);background:linear-gradient(135deg,var(--skin-primary),var(--skin-secondary));color:#fff;font-weight:600;font-size:0.85rem;font-family:inherit;cursor:pointer;transition:var(--transition)}
.bloc-btn:hover{opacity:0.9}
.bloc-btn:disabled{opacity:0.4;cursor:default}
.bloc-btn-outline{background:var(--bg-card);border:1px solid var(--border);color:var(--text);font-weight:500;padding:10px 24px;margin-top:16px;border-radius:var(--radius);font-size:0.85rem;font-family:inherit;cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;gap:6px}
.bloc-btn-outline:hover{border-color:var(--accent-gold);color:var(--accent-gold)}
.qcm-options{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.qcm-opt{padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:0.85rem;transition:var(--transition);display:flex;align-items:center;gap:10px}
.qcm-opt:hover:not(.locked){border-color:var(--accent-gold);background:rgba(0,0,0,0.02)}
.qcm-opt.selected{border-color:var(--accent-gold);background:var(--skin-bg-tint)}
.qcm-opt.correct{border-color:var(--accent-leaf);background:rgba(46,110,38,0.08)}
.qcm-opt.wrong{border-color:var(--konoha-red);background:rgba(155,32,32,0.06);opacity:0.7}
.qcm-opt.locked{cursor:default}
.qcm-marker{width:20px;height:20px;border-radius:50%;flex-shrink:0;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.7rem;transition:var(--transition)}
.qcm-opt.selected .qcm-marker{border-color:var(--accent-gold);background:var(--accent-gold);color:#fff}
.qcm-opt.correct .qcm-marker{border-color:var(--accent-leaf);background:var(--accent-leaf);color:#fff}
.qcm-opt.wrong .qcm-marker{border-color:var(--konoha-red);background:var(--konoha-red);color:#fff}
.qcm-feedback{padding:12px 16px;border-radius:var(--radius);margin-top:12px;font-size:0.82rem;line-height:1.6}
.qcm-feedback.ok{background:rgba(46,110,38,0.08);border:1px solid rgba(46,110,38,0.2);color:var(--accent-leaf-bright)}
.qcm-feedback.ko{background:rgba(155,32,32,0.08);border:1px solid rgba(155,32,32,0.2);color:var(--konoha-red-bright)}
.vf-item{padding:14px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px}
.vf-statement{font-size:0.85rem;margin-bottom:10px;font-style:italic;color:var(--text-bright)}
.vf-btns{display:flex;gap:8px}
.vf-btn{padding:6px 18px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--bg-card);font-family:inherit;font-size:0.8rem;cursor:pointer;transition:var(--transition);font-weight:500}
.vf-btn:hover:not(.locked){border-color:var(--accent-gold)}
.vf-btn.chosen{border-color:var(--accent-gold);background:rgba(154,123,46,0.1)}
.vf-btn.correct{border-color:var(--accent-leaf);background:rgba(46,110,38,0.12);color:var(--accent-leaf-bright);cursor:default}
.vf-btn.wrong{border-color:var(--konoha-red);background:rgba(155,32,32,0.08);color:var(--konoha-red-bright);cursor:default}
.vf-btn.locked{cursor:default;opacity:0.5}
.vf-justif{margin-top:8px;font-size:0.78rem;padding:8px 12px;border-radius:var(--radius);line-height:1.6}
.vf-justif.ok{background:rgba(46,110,38,0.06);color:var(--accent-leaf-bright)}
.vf-justif.ko{background:rgba(155,32,32,0.06);color:var(--konoha-red-bright)}
.tri-item{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;flex-wrap:wrap;transition:var(--transition)}
.tri-text{flex:1;min-width:150px;font-style:italic;font-size:0.85rem}
.tri-btns{display:flex;gap:6px;flex-shrink:0}
.tri-btn{padding:4px 12px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--bg-card);font-family:inherit;font-size:0.72rem;cursor:pointer;transition:var(--transition);white-space:nowrap}
.tri-btn:hover:not(.locked){border-color:var(--accent-gold)}
.tri-btn.chosen{border-color:var(--accent-gold);background:rgba(154,123,46,0.1);font-weight:600}
.tri-btn.correct{border-color:var(--accent-leaf);background:rgba(46,110,38,0.12);color:var(--accent-leaf-bright);cursor:default}
.tri-btn.wrong{border-color:var(--konoha-red);background:rgba(155,32,32,0.08);color:var(--konoha-red-bright);cursor:default}
.tri-btn.locked{cursor:default;opacity:0.5}
.tri-correction{padding:12px 16px;border-radius:var(--radius);margin-top:12px;font-size:0.82rem;line-height:1.6;background:rgba(46,110,38,0.06);border:1px solid rgba(46,110,38,0.15);color:var(--accent-leaf-bright)}
.reflexion-area,.synthese-area{width:100%;min-height:80px;padding:12px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:0.85rem;font-family:inherit;resize:vertical;outline:none;transition:var(--transition);line-height:1.7}
.reflexion-area:focus,.synthese-area:focus{border-color:var(--accent-gold)}
.synthese-area{min-height:50px;max-height:80px;resize:none}
.char-count{font-size:0.68rem;color:var(--text-muted);text-align:right;margin-top:4px}
.score-final{background:var(--bg-parchment);border:1px solid var(--border-warm);border-radius:var(--radius-lg);padding:20px;text-align:center;margin:16px 0}
.score-final .sf-value{font-size:2rem;font-weight:900;color:var(--accent-gold-bright)}
.score-final .sf-label{font-size:0.78rem;color:var(--text-dim);margin-top:4px}
.completion-banner{background:linear-gradient(135deg,var(--skin-bg-tint-light),rgba(46,110,38,0.08));border:1px solid var(--skin-bg-tint-light);border-radius:var(--radius-lg);padding:24px;text-align:center;margin-top:16px}
.completion-banner .cb-title{font-family:'Cinzel',serif;font-size:1.1rem;color:var(--accent-gold-bright);margin-top:8px}
.completion-banner .cb-text{font-size:0.82rem;color:var(--text-dim);margin-top:6px;line-height:1.6}
.interactif-notes{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-top:16px}
.interactif-notes h4{font-size:0.82rem;font-weight:600;color:var(--text-bright);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.interactif-note-item{padding:10px;background:var(--bg-input);border-radius:var(--radius);margin-bottom:8px;font-size:0.82rem;color:var(--text);line-height:1.6;white-space:pre-wrap}
.interactif-note-label{font-size:0.68rem;color:var(--accent-gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.bloc-score-inline{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:0.68rem;font-weight:600;margin-left:auto}
.bloc-score-inline.good{background:rgba(46,110,38,0.1);color:var(--accent-leaf-bright)}
.bloc-score-inline.partial{background:rgba(217,122,30,0.1);color:var(--accent-orange)}
@media(max-width:900px){
  .tri-item{flex-direction:column;align-items:flex-start}
  .tri-btns{width:100%}
  .tri-btn{flex:1;text-align:center}
  .bloc-card{padding:16px}
}
</style>
</head>
<body>

<!-- ====== HEADER ====== -->
<div class="header">
  <div class="header-left">
    <div class="konoha-symbol" id="konohaSymbol">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" stroke="var(--svg-fill)" stroke-width="2" fill="none" opacity="0.4"/>
        <path d="M50 10 C55 30, 70 40, 90 50 C70 55, 60 70, 50 90 C45 70, 30 55, 10 50 C30 40, 45 30, 50 10Z" fill="var(--svg-fill)" opacity="0.8"/>
        <circle cx="50" cy="50" r="8" fill="var(--svg-fill)" opacity="0.6"/>
      </svg>
    </div>
    <div>
      <div class="header-title"><span id="headerNatureIcon"></span> ZENKAI</div>
      <div class="header-sub" id="headerSub">Académie Ninja de Konoha</div>
    </div>
  </div>
  <div class="header-right">

    <button class="btn btn-sm" id="themeToggle" onclick="toggleTheme()" title="Mode sombre / clair">🌙</button>

</div>

  <div class="content" id="content"></div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3>Importer la progression</h3>
    <p style="font-size:0.8rem;color:var(--text-dim);margin-bottom:10px">Collez le JSON exporté :</p>
    <textarea id="importArea"></textarea>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="doImport()">Importer</button>
    </div>
  </div>

<div id="nature-particles"></div>
<div class="toast" id="toast"></div>

<script>
// ================================================================
