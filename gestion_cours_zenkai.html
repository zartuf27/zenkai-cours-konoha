  }

  if(missing.length)h+=`<div class="prereq-alert">⚠ <div><strong>Prérequis non remplis :</strong> ${missing.map(pid=>{const pc=cours(pid);return pc?`<span style="cursor:pointer;text-decoration:underline" onclick="openCours('${pid}')">${pc.titre}</span>`:pid}).join(', ')}</div></div>`;
  if(met.length)h+=`<div style="font-size:0.75rem;color:var(--accent-leaf);margin-bottom:12px;padding:8px 12px;background:rgba(74,140,63,0.06);border:1px solid rgba(74,140,63,0.15);border-radius:var(--radius)">✓ Prérequis validés : ${met.map(pid=>{const pc=cours(pid);return pc?pc.titre:pid}).join(', ')}</div>`;

  // Interactive course
  if(INTERACTIF[c.id]){
    if(CONTENU[c.id]){
      h+=`<div style="display:flex;gap:8px;margin-bottom:16px;align-items:center">
        <button class="btn btn-sm${modeProf?' btn-primary':''}" onclick="modeProf=!modeProf;render()" style="font-size:0.8rem">
          ${modeProf?'📖 Mode Prof (1 page)':'🎮 Mode Interactif'}
        </button>
        <span style="font-size:0.72rem;color:var(--text-muted)">${modeProf?'Tout le contenu affiché — 0 clic nécessaire':'Cliquer pour basculer en mode 1 page'}</span>
      </div>`;
      if(modeProf){
        h+=`<div class="contenu-block">${applySenseiName(CONTENU[c.id],c.id)}</div>`;
        return h;
      }
    }
    h+=renderInteractif(c);return h;
  }

  // Contenu théorique
  if(CONTENU[c.id]){
    const cKey='contenu_open_'+c.id;
    const isOpen=S.c[cKey];
    const hasResume=!!RESUME[c.id];
    const tabKey='contenu_tab_'+c.id;
    if(hasResume && !S.c[tabKey]) S.c[tabKey]='retenir';
    const curTab=hasResume?S.c[tabKey]||'retenir':'oral';
    h+=`<div class="contenu-toggle${isOpen?' open':''}" onclick="S.c['${cKey}']=!S.c['${cKey}'];save();render()">
      <span class="ct-arrow">▶</span> Contenu du cours
    </div>`;
    if(isOpen){
      if(hasResume){
        h+=`<div class="reading-tabs">
          <div class="reading-tab${curTab==='retenir'?' active':''}" onclick="S.c['${tabKey}']='retenir';save();render()"><span class="tab-icon">📋</span>À retenir</div>
          <div class="reading-tab${curTab==='oral'?' active':''}" onclick="S.c['${tabKey}']='oral';save();render()"><span class="tab-icon">🎤</span>Guide oral</div>
        </div>`;
        if(curTab==='retenir'){
          h+=`<div class="contenu-block tab-content">${RESUME[c.id]}</div>`;
        } else {
          h+=`<div class="contenu-block tab-content">${applySenseiName(CONTENU[c.id],c.id)}</div>`;
        }
      } else {
        h+=`<div class="contenu-block">${applySenseiName(CONTENU[c.id],c.id)}</div>`;
      }
    }
  }

  // Techs
  c.techs.forEach(t=>{
    const ts=techState(t),tp=techProg(t),it=items(t);
    const hasMudras=t.mudras?.length>0;
    const tpw=(t.prereq||[]).filter(pid=>!prereqOk(pid));
    h+=`<div class="tech-item${tpw.length?' prereq-warn':''}">
      <div class="tech-head" onclick="this.parentElement.querySelector('.tech-body').style.display=this.parentElement.querySelector('.tech-body').style.display==='none'?'block':'none'">
        <span class="tech-name"><span class="t-icon">${tIcon(t.type)}</span>${t.nom}</span>
        <div style="display:flex;align-items:center;gap:6px"><span class="badge badge-type" style="font-size:0.6rem">${t.type}</span><span class="badge badge-rang" style="font-size:0.6rem">${t.rang}</span>${stBadge(ts)}</div>
      </div>
      <div class="tech-body">
        <div class="tech-desc">${t.desc}</div>`;

    if(tpw.length)h+=`<div class="prereq-alert">⚠ Prérequis : ${tpw.map(pid=>{const f=findTech(pid);return f?f.t.nom:pid}).join(', ')}</div>`;

    if(it.length){
      h+=`<div class="pbar" style="margin-bottom:6px"><div class="pbar-fill${tp.p===100?' complete':''}" style="width:${tp.p}%"></div></div>
        <div class="pbar-text">${tp.p}% · ${tp.d}/${tp.t}</div>`;

      if(hasMudras){
        h+=`<div style="font-size:0.72rem;color:var(--accent-gold);margin:10px 0 4px;text-transform:uppercase;letter-spacing:1px">Séquence de mudras</div><div class="mudra-seq">`;
        it.forEach((x,i)=>{
          h+=`<div class="mudra-pill${chk(x.k)?' done':''}" onclick="tog('${x.k}');render()">
            <span class="mp-num">${x.i}</span><span>${x.l}</span>
            ${i<it.length-1?'<span class="mp-arrow">→</span>':''}
          </div>`;
        });
        h+=`</div>`;
      }else{
        h+=`<div class="checklist">`;
        it.forEach(x=>{
          h+=`<div class="check-row${chk(x.k)?' done':''}" onclick="tog('${x.k}');render()">
            <div class="check-box">${chk(x.k)?'✓':''}</div>
            <span class="check-text">${x.l}</span>
            ${x.s?`<span class="check-sub">${x.s}</span>`:''}
          </div>`;
        });
        h+=`</div>`;
      }
    }

    // Toggle all
    if(it.length>1){
      const allDone=it.every(x=>chk(x.k));
      h+=`<div style="margin-top:8px"><button class="btn btn-sm" onclick="event.stopPropagation();${allDone?`[${it.map(x=>`'${x.k}'`).join(',')}].forEach(k=>{delete S.c[k]});save();render()`:`[${it.map(x=>`'${x.k}'`).join(',')}].forEach(k=>{S.c[k]=true});save();render()`}">${allDone?'Tout décocher':'Tout valider'}</button></div>`;
    }

    // Notes
    const note=getNote(t.id);
    h+=`<div class="notes-section">
      <div class="notes-toggle" onclick="const a=this.nextElementSibling;a.style.display=a.style.display==='none'?'block':'none'">📝 Notes personnelles ${note?'('+note.length+' car.)':''}</div>
      <textarea class="notes-area" style="display:${note?'block':'none'}" placeholder="Vos notes..." onchange="setNote('${t.id}',this.value)">${esc(note)}</textarea>
    </div>`;

    h+=`</div></div>`;
  });
  return h;
}

// ================================================================
// INTERACTIVE COURSE RENDERING
// ================================================================
function renderInteractif(c){
  const cid=c.id,blocs=INTERACTIF[cid],ist=getIState(cid);
  if(iStep>=blocs.length)iStep=blocs.length-1;if(iStep<0)iStep=0;
  let h='<div class="interactif-wrapper">';
  // Progress dots
  h+='<div class="interactif-steps">';
  blocs.forEach((b,i)=>{
    const done=ist.done.includes(i),active=i===iStep;
    const canGo=done||(i===0||ist.done.includes(i-1));
    let cls=done?'done':'';if(active)cls+=' active';
    h+=`<div class="interactif-dot ${cls}" tabindex="${canGo?'0':'-1'}" role="button" ${canGo?`onclick="iGoTo('${cid}',${i})" onkeydown="if(event.key==='Enter')iGoTo('${cid}',${i})"`:''} title="Bloc ${i+1} : ${esc(b.titre)}">${i+1}</div>`;
    if(i<blocs.length-1)h+=`<div class="interactif-line${done?' done':''}"></div>`;
  });
  h+='</div>';
  h+=`<div id="bloc-content">${renderBloc(cid,iStep)}</div>`;
  // Score + completion
  const allDone=ist.done.length>=blocs.length;
  if(allDone){
    const sc=iCalcScore(cid);
    if(sc.total>0){const pct=Math.round(sc.obtained/sc.total*100);h+=`<div class="score-final"><div class="sf-value">${sc.obtained} / ${sc.total}</div><div class="sf-label">Score final (${pct}%)</div></div>`}
    h+=`<div class="completion-banner"><div style="font-size:2rem">\ud83d\udd25</div><div class="cb-title">Cours termin\u00e9</div><div class="cb-text">Tu as achev\u00e9 le parcours \u00ab ${esc(c.titre)} \u00bb.<br>Que la Volont\u00e9 du Feu guide tes pas.</div></div>`;
  }
  // Notes
  if(ist.notes.reflexion||ist.notes.synthese){
    h+='<div class="interactif-notes"><h4>\ud83d\udcdd Notes personnelles</h4>';
    if(ist.notes.reflexion)h+=`<div class="interactif-note-item"><div class="interactif-note-label">Introspection</div>${esc(ist.notes.reflexion)}</div>`;
    if(ist.notes.synthese)h+=`<div class="interactif-note-item"><div class="interactif-note-label">Mon Nindo</div><strong>\u00ab ${esc(ist.notes.synthese)} \u00bb</strong></div>`;
    h+='</div>';
  }
  h+=`<div style="margin-top:20px;text-align:center"><button class="btn btn-sm btn-danger" onclick="iReset('${cid}')">Recommencer le cours</button></div>`;
  h+='</div>';
  return h;
}

function renderBloc(cid,idx){
  const blocs=INTERACTIF[cid],b=blocs[idx],ist=getIState(cid),done=ist.done.includes(idx);
  let h='<div class="bloc-card">';
  h+=`<div class="bloc-titre"><span class="bloc-num">Bloc ${idx+1}/${blocs.length}</span>${esc(b.titre)}`;
  if(done&&b.scored){
    if(b.type==='qcm'){const ok=ist.answers[idx]===b.correct;h+=`<span class="bloc-score-inline ${ok?'good':'partial'}">${ok?'1/1':'0/1'}</span>`}
    if(b.type==='vrai_faux'){const ans=ist.answers[idx]||{};let sc=0;b.items.forEach((it,j)=>{if(ans[j]===it.reponse)sc++});h+=`<span class="bloc-score-inline ${sc===b.items.length?'good':'partial'}">${sc}/${b.items.length}</span>`}
    if(b.type==='tri'){const ans=ist.answers[idx]||{};let sc=0;b.items.forEach((it,j)=>{if(ans[j]===it.cat)sc++});h+=`<span class="bloc-score-inline ${sc===b.items.length?'good':'partial'}">${sc}/${b.items.length}</span>`}
  }
  h+='</div>';
  switch(b.type){
    case 'lecture':h+=renderBlocLecture(cid,idx,b,ist,done);break;
    case 'tableau':h+=renderBlocTableau(cid,idx,b,ist,done);break;
    case 'qcm':h+=renderBlocQcm(cid,idx,b,ist,done);break;
    case 'vrai_faux':h+=renderBlocVF(cid,idx,b,ist,done);break;
    case 'tri':h+=renderBlocTri(cid,idx,b,ist,done);break;
    case 'reflexion':h+=renderBlocReflexion(cid,idx,b,ist,done);break;
    case 'synthese':h+=renderBlocSynthese(cid,idx,b,ist,done);break;
  }
  h+=renderBlocNav(cid,idx,done);
  h+='</div>';
  return h;
}

function renderBlocLecture(cid,idx,b,ist,done){
  let h=`<div class="bloc-texte">${b.contenu}</div>`;
  if(!done)h+=`<button class="bloc-btn" onclick="iComplete('${cid}',${idx})">J'ai lu \u2713</button>`;
  else h+=`<div style="color:var(--accent-leaf);font-size:0.8rem;margin-top:12px">\u2713 Lu</div>`;
  return h;
}

function renderBlocTableau(cid,idx,b,ist,done){
  let h='';
  if(b.intro)h+=`<div class="bloc-texte" style="margin-bottom:12px">${b.intro}</div>`;
  h+=`<table class="contenu-table"><tr>${b.colonnes.map(c=>`<th>${c}</th>`).join('')}</tr>`;
  b.lignes.forEach(l=>{h+=`<tr>${l.map(c=>`<td>${c}</td>`).join('')}</tr>`});
  h+='</table>';
  if(!done)h+=`<button class="bloc-btn" onclick="iComplete('${cid}',${idx})">J'ai lu \u2713</button>`;
  else h+=`<div style="color:var(--accent-leaf);font-size:0.8rem;margin-top:12px">\u2713 Lu</div>`;
  return h;
}

function renderBlocQcm(cid,idx,b,ist,done){
  const answered=ist.answers.hasOwnProperty(String(idx));
  const selected=ist.answers[idx];
  let h=`<div class="bloc-texte" style="margin-bottom:12px;font-weight:500">${b.question}</div><div class="qcm-options">`;
  b.options.forEach((opt,i)=>{
    let cls='qcm-opt';
    if(answered){cls+=' locked';if(i===b.correct)cls+=' correct';else if(i===selected)cls+=' wrong'}
    else if(i===window._qcmSel)cls+=' selected';
    h+=`<div class="${cls}" tabindex="0" role="button" ${!answered?`onclick="iQcmSelect('${cid}',${idx},${i})" onkeydown="if(event.key==='Enter')iQcmSelect('${cid}',${idx},${i})"`:''}>
      <div class="qcm-marker">${answered?(i===b.correct?'\u2713':i===selected?'\u2717':''):(i===window._qcmSel?'\u25cf':'')}</div>
      <span>${opt}</span></div>`;
  });
  h+='</div>';
  if(!answered&&window._qcmSel!==undefined)h+=`<button class="bloc-btn" onclick="iQcmValidate('${cid}',${idx})">Valider</button>`;
  if(answered){const ok=selected===b.correct;h+=`<div class="qcm-feedback ${ok?'ok':'ko'}">${ok?'\u2713 Bonne r\u00e9ponse !':'\u2717 Mauvaise r\u00e9ponse.'} ${b.justification}</div>`}
  return h;
}

function renderBlocVF(cid,idx,b,ist,done){
  const validated=ist.done.includes(idx);
  const savedAns=ist.answers[idx];
  const answers=validated&&savedAns?savedAns:(window._vfAnswers||{});
  let h='';
  b.items.forEach((it,i)=>{
    const userAns=answers[i];const answered=userAns!==undefined;
    h+=`<div class="vf-item"><div class="vf-statement">${i+1}. \u00ab ${it.enonce} \u00bb</div><div class="vf-btns">`;
    let vCls='vf-btn';
    if(validated){if(it.reponse===true)vCls+=' correct';else if(userAns===true)vCls+=' wrong';else vCls+=' locked'}
    else if(userAns===true)vCls+=' chosen';
    h+=`<button class="${vCls}" ${!validated?`onclick="iVfSelect('${cid}',${idx},${i},true)"`:''}>Vrai</button>`;
    let fCls='vf-btn';
    if(validated){if(it.reponse===false)fCls+=' correct';else if(userAns===false)fCls+=' wrong';else fCls+=' locked'}
    else if(userAns===false)fCls+=' chosen';
    h+=`<button class="${fCls}" ${!validated?`onclick="iVfSelect('${cid}',${idx},${i},false)"`:''}>Faux</button>`;
    h+='</div>';
    if(validated){const ok=userAns===it.reponse;h+=`<div class="vf-justif ${ok?'ok':'ko'}">${ok?'\u2713':'\u2717'} ${it.justification}</div>`}
    h+='</div>';
  });
  const allAnswered=b.items.every((_,i)=>answers[i]!==undefined);
  if(!validated&&allAnswered)h+=`<button class="bloc-btn" onclick="iVfValidate('${cid}',${idx})">V\u00e9rifier</button>`;
  if(validated){let sc=0;b.items.forEach((it,i)=>{if((savedAns||{})[i]===it.reponse)sc++});h+=`<div style="margin-top:12px;font-size:0.85rem;font-weight:600;color:var(--accent-gold)">Score : ${sc}/${b.items.length}</div>`}
  return h;
}

function renderBlocTri(cid,idx,b,ist,done){
  const validated=ist.done.includes(idx);
  const savedAns=ist.answers[idx];
  const answers=validated&&savedAns?savedAns:(window._triAnswers||{});
  let h='';
  b.items.forEach((it,i)=>{
    const userAns=answers[i];
    h+=`<div class="tri-item"><span class="tri-text">${it.texte}</span><div class="tri-btns">`;
    b.categories.forEach((cat,ci)=>{
      let cls='tri-btn';
      if(validated){if(it.cat===ci)cls+=' correct';else if(userAns===ci)cls+=' wrong';else cls+=' locked'}
      else if(userAns===ci)cls+=' chosen';
      h+=`<button class="${cls}" ${!validated?`onclick="iTriSelect('${cid}',${idx},${i},${ci})"`:''} title="${esc(cat)}">${cat}</button>`;
    });
    h+='</div></div>';
  });
  const allAnswered=b.items.every((_,i)=>answers[i]!==undefined);
  if(!validated&&allAnswered)h+=`<button class="bloc-btn" onclick="iTriValidate('${cid}',${idx})">V\u00e9rifier</button>`;
  if(validated){let sc=0;b.items.forEach((it,i)=>{if((savedAns||{})[i]===it.cat)sc++});h+=`<div style="margin-top:12px;font-size:0.85rem;font-weight:600;color:var(--accent-gold)">Score : ${sc}/${b.items.length}</div>`;h+=`<div class="tri-correction">${b.correction}</div>`}
  return h;
}

function renderBlocReflexion(cid,idx,b,ist,done){
  const note=ist.notes[b.noteKey]||'';
  let h=`<div class="bloc-texte" style="margin-bottom:12px">${b.question}</div>`;
  h+=`<textarea class="reflexion-area" id="reflexion-${idx}" placeholder="\u00c9cris ta r\u00e9ponse ici..." oninput="window._reflexionText=this.value">${esc(note)}</textarea>`;
  if(!done)h+=`<button class="bloc-btn" onclick="iReflexionSave('${cid}',${idx},'${b.noteKey}')">Sauvegarder et continuer</button>`;
  else h+=`<div style="color:var(--accent-leaf);font-size:0.8rem;margin-top:8px">\u2713 R\u00e9ponse sauvegard\u00e9e</div><button class="bloc-btn-outline" style="font-size:0.78rem;padding:6px 14px;margin-top:6px" onclick="iReflexionSave('${cid}',${idx},'${b.noteKey}')">Modifier</button>`;
  return h;
}

function renderBlocSynthese(cid,idx,b,ist,done){
  const note=ist.notes[b.noteKey]||'';const max=b.maxChars||120;
  let h=`<div class="bloc-texte" style="margin-bottom:12px"><p><strong>Rappel :</strong> ${b.rappel}</p></div>`;
  h+=`<div style="font-size:0.82rem;color:var(--text-dim);margin-bottom:8px">Formule ton nindo :</div>`;
  h+=`<textarea class="synthese-area" id="synthese-${idx}" maxlength="${max}" placeholder="Mon nindo..." oninput="window._syntheseText=this.value;document.getElementById('synth-count').textContent=this.value.length+'/${max}'">${esc(note)}</textarea>`;
  h+=`<div class="char-count" id="synth-count">${note.length}/${max}</div>`;
  if(!done)h+=`<button class="bloc-btn" onclick="iSyntheseSave('${cid}',${idx},'${b.noteKey}')">Sceller mon Nindo \ud83d\udd25</button>`;
  else h+=`<div style="color:var(--accent-leaf);font-size:0.8rem;margin-top:8px">\u2713 Nindo scell\u00e9</div><button class="bloc-btn-outline" style="font-size:0.78rem;padding:6px 14px;margin-top:6px" onclick="iSyntheseSave('${cid}',${idx},'${b.noteKey}')">Modifier</button>`;
  return h;
}

function renderBlocNav(cid,idx,done){
  const blocs=INTERACTIF[cid];
  let h='<div style="display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">';
  if(idx>0)h+=`<button class="bloc-btn-outline" style="margin-top:0" onclick="iGoTo('${cid}',${idx-1})">\u2190 Pr\u00e9c\u00e9dent</button>`;
  if(done&&idx<blocs.length-1)h+=`<button class="bloc-btn" style="margin-top:0;margin-left:auto" onclick="iGoTo('${cid}',${idx+1})">Continuer \u2192</button>`;
  h+='</div>';
  return h;
}

// Interactive event handlers
function iGoTo(cid,idx){iStep=idx;window._qcmSel=undefined;window._vfAnswers=undefined;window._triAnswers=undefined;window._reflexionText=undefined;window._syntheseText=undefined;render()}
function iComplete(cid,idx){const ist=getIState(cid);if(!ist.done.includes(idx))ist.done.push(idx);saveIState(cid,ist);if(idx<INTERACTIF[cid].length-1){iStep=idx+1}render()}
function iQcmSelect(cid,idx,optIdx){window._qcmSel=optIdx;document.getElementById('bloc-content').innerHTML=renderBloc(cid,idx)}
function iQcmValidate(cid,idx){const ist=getIState(cid);ist.answers[idx]=window._qcmSel;if(!ist.done.includes(idx))ist.done.push(idx);saveIState(cid,ist);window._qcmSel=undefined;render()}
function iVfSelect(cid,idx,itemIdx,val){if(!window._vfAnswers){const ist=getIState(cid);window._vfAnswers={...(ist.answers[idx]||{})}}window._vfAnswers[itemIdx]=val;document.getElementById('bloc-content').innerHTML=renderBloc(cid,idx)}
function iVfValidate(cid,idx){const ist=getIState(cid);ist.answers[idx]={...window._vfAnswers};if(!ist.done.includes(idx))ist.done.push(idx);saveIState(cid,ist);window._vfAnswers=undefined;render()}
function iTriSelect(cid,idx,itemIdx,catIdx){if(!window._triAnswers){const ist=getIState(cid);window._triAnswers={...(ist.answers[idx]||{})}}window._triAnswers[itemIdx]=catIdx;document.getElementById('bloc-content').innerHTML=renderBloc(cid,idx)}
function iTriValidate(cid,idx){const ist=getIState(cid);ist.answers[idx]={...window._triAnswers};if(!ist.done.includes(idx))ist.done.push(idx);saveIState(cid,ist);window._triAnswers=undefined;render()}
function iReflexionSave(cid,idx,noteKey){const txt=window._reflexionText||document.getElementById('reflexion-'+idx)?.value||'';if(!txt.trim()){toast('\u00c9cris quelque chose avant de continuer');return}const ist=getIState(cid);ist.notes[noteKey]=txt.trim();if(!ist.done.includes(idx))ist.done.push(idx);saveIState(cid,ist);if(idx<INTERACTIF[cid].length-1)iStep=idx+1;render()}
function iSyntheseSave(cid,idx,noteKey){const txt=window._syntheseText||document.getElementById('synthese-'+idx)?.value||'';if(!txt.trim()){toast('Formule ton nindo avant de continuer');return}const ist=getIState(cid);ist.notes[noteKey]=txt.trim();if(!ist.done.includes(idx))ist.done.push(idx);saveIState(cid,ist);render()}
function iReset(cid){if(!confirm('Recommencer le cours ? Ta progression et tes r\u00e9ponses seront effac\u00e9es.'))return;delete S.n[cid+'::istate'];save();iStep=0;window._qcmSel=undefined;window._vfAnswers=undefined;window._triAnswers=undefined;render();toast('Cours r\u00e9initialis\u00e9')}

function renderMudras(){
  let h=`<div class="page-header"><div class="page-title">Les 12 Mudras</div>
    <div class="page-desc">Signes de main — le langage du chakra. Précision, rapidité, fluidité.</div></div>`;

function clipCopy(txt,label,srcEl){
  // Méthode 1 : Clipboard API (contexte sécurisé uniquement)
  if(window.isSecureContext&&navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>{
      copyOk(label,srcEl);
    }).catch(()=>clipFallback(txt,label,srcEl));
    return;
  }
  // Méthode 2 : fallback textarea
  clipFallback(txt,label,srcEl);
}
function copyOk(label,srcEl){
  playClick();
  toast('✅ '+label+' copié !');
  if(!srcEl)return;
  // Animation sur le bouton/élément source
  srcEl.classList.add('copy-success');
  // Ajouter le check animé s'il n'existe pas déjà
  if(!srcEl.querySelector('.copy-check')){
    const ck=document.createElement('span');
    ck.className='copy-check';
    ck.textContent='✓ Copié';
    srcEl.appendChild(ck);
  }
  setTimeout(()=>{
    srcEl.classList.remove('copy-success');
    const ck=srcEl.querySelector('.copy-check');
    if(ck)ck.remove();
  },1800);
}
function clipFallback(txt,label,srcEl){
  try{
    const ta=document.createElement('textarea');
    ta.value=txt;
    ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;left:-9999px;top:-9999px;opacity:0';
    document.body.appendChild(ta);
    // iOS fix
    const range=document.createRange();
    range.selectNodeContents(ta);
    const sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    ta.setSelectionRange(0,ta.value.length);
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok){
      copyOk(label,srcEl);
    }else{
      clipPopup(txt,label);
    }
  }catch(e){
    clipPopup(txt,label);
  }
}
function clipPopup(txt,label){
  // Dernier recours : popup avec sélection automatique pour copie manuelle
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:10000;display:flex;align-items:center;justify-content:center';
  const box=document.createElement('div');
  box.style.cssText='background:var(--bg-card,#1a1a2e);border:2px solid var(--accent-gold,#c8a84e);border-radius:12px;padding:20px;max-width:600px;width:90%;max-height:70vh;display:flex;flex-direction:column;gap:12px';
  box.innerHTML=`<div style="color:var(--accent-gold,#c8a84e);font-weight:700">📋 ${label} — Ctrl+C pour copier</div>`;
  const ta=document.createElement('textarea');
  ta.value=txt;
  ta.readOnly=true;
  ta.style.cssText='width:100%;min-height:150px;max-height:50vh;background:var(--bg-main,#0f0f23);color:var(--text,#e0d8c8);border:1px solid var(--border,#2a2a3e);border-radius:8px;padding:12px;font-size:0.85rem;font-family:inherit;resize:vertical';
  box.appendChild(ta);
  const btn=document.createElement('button');
  btn.textContent='Fermer';
  btn.style.cssText='align-self:flex-end;padding:6px 18px;border-radius:6px;border:1px solid var(--border,#2a2a3e);background:var(--bg-hover,#1e1e3a);color:var(--text,#e0d8c8);cursor:pointer;font-size:0.85rem';
  btn.onclick=()=>document.body.removeChild(overlay);
  box.appendChild(btn);
  overlay.appendChild(box);
  overlay.onclick=(e)=>{if(e.target===overlay)document.body.removeChild(overlay)};
  document.body.appendChild(overlay);
  ta.focus();
  ta.select();
}

function getCoursHistory(){
  try{return JSON.parse(getNote('cours_history')||'[]')}catch(e){return[]}
}
function saveCoursHistory(h){setNote('cours_history',JSON.stringify(h))}
function addCoursGiven(coursId,noEleve){
  const c=cours(coursId);if(!c)return;
  const now=new Date();
  // Arrondi au quart d'heure
  const mins=now.getMinutes();const rounded=Math.round(mins/15)*15;
  const rnd=new Date(now);rnd.setMinutes(rounded%60);if(rounded===60)rnd.setHours(rnd.getHours()+1);rnd.setSeconds(0);
  const entry={id:coursId,titre:c.titre,date:now.toLocaleDateString('fr-FR'),heure:rnd.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),ts:now.getTime()};
  if(noEleve)entry.noEleve=true;
  const hist=getCoursHistory();hist.push(entry);saveCoursHistory(hist);
  const k='given_count_'+coursId;setNote(k,String((parseInt(getNote(k))||0)+1));
  setNote('given_last_'+coursId,entry.date);
}
function removeCoursGiven(coursId){
  const hist=getCoursHistory();
  const idx=hist.map(e=>e.id).lastIndexOf(coursId);
  if(idx>=0)hist.splice(idx,1);
  saveCoursHistory(hist);
  const k='given_count_'+coursId;
  const n=Math.max(0,(parseInt(getNote(k))||0)-1);
  if(n){
    setNote(k,String(n));
    // Update given_last_ to reflect the actual last remaining entry
    const remaining=hist.filter(e=>e.id===coursId);
    if(remaining.length){setNote('given_last_'+coursId,remaining[remaining.length-1].date)}
  }else{setNote(k,'');setNote('given_last_'+coursId,'');}
}

      <div class="no-element">${count} cours</div>
    </div>`;
  });
  h+=`</div></div>`;

  // Message Discord
  h+=`<div class="card" style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-weight:600;color:var(--text-bright)">📜 Parchemin — ${selDate}</div>
      <button class="btn btn-sm btn-primary" onclick="clipCopy(document.getElementById('bilanText').getAttribute('data-raw'),'Bilan')">📋 Copier</button>
    </div>
    <pre id="bilanText" data-raw="${esc(discord)}" style="background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-family:'Noto Sans JP',monospace;font-size:0.85rem;color:var(--text);white-space:pre-wrap;line-height:1.8;margin:0">${esc(discord)}</pre>
  </div>`;

  // Détail des cours du jour sélectionné
  h+=`<div style="font-weight:600;color:var(--text-bright);margin-bottom:10px">Cours du ${selDate} — ${selHist.length} cours</div>`;
  if(selHist.length===0){
    h+=`<div class="card" style="text-align:center;color:var(--text-muted);font-style:italic;padding:30px">Aucun cours enregistré ce jour.</div>`;
  }else{
    const parCours={};
    selHist.forEach(e=>{if(!parCours[e.id])parCours[e.id]={titre:e.titre,entries:[]};parCours[e.id].entries.push(e)});
    Object.values(parCours).forEach(group=>{
      h+=`<div class="card" style="margin-bottom:8px;padding:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-weight:600;color:var(--text-bright);font-size:0.9rem">${group.titre}</span>
          <span style="font-size:0.78rem;color:var(--skin-primary);font-weight:600">${group.entries.length}×</span>
        </div>
        <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">
          ${group.entries.map(e=>`<span style="font-size:0.72rem;padding:2px 8px;background:${e.noEleve?'rgba(217,122,30,0.1)':'var(--bg-input)'};border:1px solid ${e.noEleve?'var(--accent-orange)':'var(--border)'};border-radius:12px;color:${e.noEleve?'var(--accent-orange)':'var(--text-dim)'}">${e.heure}${e.noEleve?' · 0 élève':''}</span>`).join('')}
        </div>
      </div>`;
    });
  }

  // Lien historique
  h+=`<div style="margin-top:20px;text-align:center">
    <button class="btn" onclick="nav('historique')" style="font-size:0.85rem">📜 Voir l'historique complet & statistiques</button>
  </div>`;

  // Reset
  h+=`<div style="margin-top:24px;display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:0.75rem;color:var(--text-muted)">Total : ${hist.length} cours depuis le début</span>
    <button class="btn btn-sm btn-danger" onclick="resetBilan()">🗑️ Remettre à zéro</button>
  </div>`;

  return h;
}

  D.cours.forEach(c=>{setNote('given_count_'+c.id,'');setNote('given_last_'+c.id,'');});
  toast('Compteurs réinitialisés');render();
}

// SVG Camembert helper
function svgPie(slices,size){
  if(!slices.length||slices.every(s=>!s.val))return'';
  const total=slices.reduce((a,s)=>a+s.val,0);
  if(!total)return'';
  const r=size/2-2,cx=size/2,cy=size/2;
  let startAngle=-Math.PI/2,svg=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  slices.forEach(s=>{
    if(!s.val)return;
    const angle=(s.val/total)*Math.PI*2;
    const endAngle=startAngle+angle;
    const large=angle>Math.PI?1:0;
    const x1=cx+r*Math.cos(startAngle),y1=cy+r*Math.sin(startAngle);
    const x2=cx+r*Math.cos(endAngle),y2=cy+r*Math.sin(endAngle);
    if(s.val===total){svg+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${s.color}"/>`}
    else{svg+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${s.color}"/>`}
    startAngle=endAngle;
  });
  svg+=`</svg>`;return svg;
}

let histoFilter=null; // null=global, 'dd/mm/yyyy'=jour
function setHistoFilter(d){histoFilter=d;render();}

function renderHistorique(){
  const s=getSensei();
  const allHist=getCoursHistory();
  const nat=s.nature?D.natures.find(n=>n.id===s.nature):null;
  const typeInfo=senseiTypeInfo();

  if(allHist.length===0){
    return`<div class="page-header"><div class="page-title">📜 Registre du Sensei</div>
      <div class="page-desc">Statistiques et parcours d'enseignement</div></div>
      <div class="card" style="text-align:center;padding:60px 20px">
        <div style="font-size:2.5rem;margin-bottom:12px">${nat?nat.icon:typeInfo.icon}</div>
        <div style="font-size:1rem;color:var(--text-bright);font-weight:600;margin-bottom:6px">Aucun cours enregistré</div>
        <div style="font-size:0.82rem;color:var(--text-dim)">Utilisez le bouton "✅ Cours donné +1" sur vos cours pour commencer à construire votre historique.</div>
      </div>`;
  }

  // Jours disponibles
  const allDays={};
  allHist.forEach(e=>{if(!allDays[e.date])allDays[e.date]=[];allDays[e.date].push(e)});
  const dayKeys=Object.keys(allDays).sort((a,b)=>{const pa=a.split('/'),pb=b.split('/');return new Date(pb[2],pb[1]-1,pb[0])-new Date(pa[2],pa[1]-1,pa[0])});

  // Filtre
  const isGlobal=!histoFilter;
  const hist=isGlobal?allHist:(allDays[histoFilter]||[]);
  const filterLabel=isGlobal?'Global':histoFilter+' (mois IG)';

  // ====== CALCULS ======
  const totalCours=hist.length;
  const totalDonnes=hist.filter(e=>!e.noEleve).length;
  const totalProposes=hist.filter(e=>e.noEleve).length;
  const tauxPresence=totalCours?Math.round(totalDonnes/totalCours*100):0;

  const parJour={};
  hist.forEach(e=>{if(!parJour[e.date])parJour[e.date]=[];parJour[e.date].push(e)});
  const jourKeys2=Object.keys(parJour);
  const nbJours=jourKeys2.length;
  const moyParJour=nbJours?Math.round(totalCours/nbJours*10)/10:0;

  const parModule={};
  hist.forEach(e=>{const c=cours(e.id);if(c){if(!parModule[c.mod])parModule[c.mod]=0;parModule[c.mod]++}});
  const modEntries=Object.entries(parModule).sort((a,b)=>b[1]-a[1]);
  const maxMod=modEntries.length?modEntries[0][1]:0;

  const parCours2={};
  hist.forEach(e=>{if(!parCours2[e.id])parCours2[e.id]={titre:e.titre,count:0,noEleve:0};parCours2[e.id].count++;if(e.noEleve)parCours2[e.id].noEleve++});
  const coursEntries=Object.entries(parCours2).sort((a,b)=>b[1].count-a[1].count);
  const maxCours=coursEntries.length?coursEntries[0][1].count:0;

  const parHeure={};
  hist.forEach(e=>{const hr=e.heure?e.heure.split(':')[0]:'??';if(!parHeure[hr])parHeure[hr]=0;parHeure[hr]++});
  const maxHeure=Object.values(parHeure).length?Math.max(...Object.values(parHeure)):0;

  let nbTheo=0,nbPrat=0;
  hist.forEach(e=>{const c=cours(e.id);if(c){if(c.cat==='theorique')nbTheo++;else nbPrat++}});

  const dates=hist.map(e=>e.ts).sort();
  const premier=new Date(dates[0]).toLocaleDateString('fr-FR');
  const dernier=new Date(dates[dates.length-1]).toLocaleDateString('fr-FR');

  // Couleurs pour camemberts
  const pieColors=['var(--skin-primary)','var(--skin-secondary)','var(--accent-leaf)','var(--accent-orange)','var(--konoha-red)','var(--suiton)','var(--futon)','var(--doton)'];
  const getPC=(i)=>pieColors[i%pieColors.length];

  // ====== RENDU ======
  let h=`<div class="page-header"><div class="page-title">📜 Registre du Sensei</div>
    <div class="page-desc">Parcours d'enseignement de ${senseiFullName()} — ${filterLabel}</div></div>`;

  // ====== SÉLECTEUR GLOBAL / JOUR ======
  h+=`<div class="card" style="margin-bottom:20px;padding:14px">
    <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:8px">Période</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      <div class="nature-opt ${isGlobal?'selected':''}" onclick="setHistoFilter(null)" style="min-width:auto;flex:0 0 auto;padding:6px 14px">
        <div class="no-check">✓</div>
        <div class="no-name" style="font-size:0.78rem">🌐 Global</div>
        <div class="no-element">${allHist.length} cours</div>
      </div>`;
  dayKeys.forEach(d=>{
    const sel=histoFilter===d?'selected':'';
    h+=`<div class="nature-opt ${sel}" onclick="setHistoFilter('${d}')" style="min-width:auto;flex:0 0 auto;padding:6px 14px">
      <div class="no-check">✓</div>
      <div class="no-name" style="font-size:0.78rem">${d}</div>
      <div class="no-element">${allDays[d].length} cours</div>
    </div>`;
  });
  h+=`</div></div>`;

  // ====== CARTE SENSEI ======
  const _hAvatar=getNote('sensei_avatar');
  h+=`<div class="sensei-card" data-type="${s.type}" style="margin-bottom:24px">
    <div class="sensei-card-avatar">${_hAvatar?`<img src="${_hAvatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:nat?nat.icon:typeInfo.icon}</div>
    <div class="sensei-card-info">
      <div class="sensei-card-name">${esc(senseiFullName())}</div>
      <div class="sensei-card-meta">${s.rang?s.rang+' · ':''}${typeInfo.icon} ${typeInfo.nom}</div>
      <div style="font-size:0.75rem;color:var(--text-dim);margin-top:2px">${isGlobal?'Actif depuis le '+premier+' · Dernier cours : '+dernier:'Jour : '+histoFilter}</div>
    </div>
    ${nat?`<div class="sensei-card-nature">${nat.icon} ${nat.nom}</div>`:''}
  </div>`;

  // ====== STATS ======
  h+=`<div class="stats-grid" style="margin-bottom:24px">
    <div class="stat-card"><div class="stat-value">${totalCours}</div><div class="stat-label">Cours${isGlobal?' total':''}</div>
      <div class="stat-sub">${totalDonnes} donnés · ${totalProposes} proposés</div></div>
    ${isGlobal?`<div class="stat-card accent-fire"><div class="stat-value">${nbJours}</div><div class="stat-label">Jours d'activité</div>
      <div class="stat-sub">Moyenne ${moyParJour} cours/jour</div></div>`:''}
    <div class="stat-card accent-leaf"><div class="stat-value">${tauxPresence}%</div><div class="stat-label">Taux de présence</div>
      <div class="pbar pbar-lg" style="margin-top:8px"><div class="pbar-fill${tauxPresence===100?' complete':''}" style="width:${tauxPresence}%"></div></div></div>
    <div class="stat-card accent-orange"><div class="stat-value">${nbTheo}<span style="font-size:0.9rem;color:var(--text-dim)">/${nbPrat}</span></div><div class="stat-label">Théo / Prat</div>
      <div class="stat-sub">${totalCours?Math.round(nbTheo/totalCours*100):0}% · ${totalCours?Math.round(nbPrat/totalCours*100):0}%</div></div>
  </div>`;

  // ====== CAMEMBERTS ======
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-bottom:20px">`;

  // Camembert Théo/Prat
  h+=`<div class="scroll-card" style="text-align:center">
    <div class="scroll-stamp">${nat?nat.icon:'📜'}</div>
    <div class="scroll-title" style="justify-content:center"><span class="scroll-brush">📖</span> Théorique vs Pratique</div>
    <div style="display:flex;justify-content:center;margin-bottom:12px">${svgPie([{val:nbTheo,color:'var(--skin-primary)'},{val:nbPrat,color:'var(--skin-secondary)'}],130)}</div>
    <div style="display:flex;justify-content:center;gap:16px;font-size:0.75rem">
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--skin-primary);margin-right:4px"></span>Théo ${nbTheo}</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--skin-secondary);margin-right:4px"></span>Prat ${nbPrat}</span>
    </div>
  </div>`;

  // Camembert Donnés/Proposés
  h+=`<div class="scroll-card" style="text-align:center">
    <div class="scroll-stamp">${typeInfo.icon}</div>
    <div class="scroll-title" style="justify-content:center"><span class="scroll-brush">✅</span> Donnés vs Proposés</div>
    <div style="display:flex;justify-content:center;margin-bottom:12px">${svgPie([{val:totalDonnes,color:'var(--accent-leaf)'},{val:totalProposes,color:'var(--accent-orange)'}],130)}</div>
    <div style="display:flex;justify-content:center;gap:16px;font-size:0.75rem">
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent-leaf);margin-right:4px"></span>Donnés ${totalDonnes}</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent-orange);margin-right:4px"></span>Proposés ${totalProposes}</span>
    </div>
  </div>`;

  // Camembert par module
  if(modEntries.length>1){
    h+=`<div class="scroll-card" style="text-align:center">
      <div class="scroll-title" style="justify-content:center"><span class="scroll-brush">🏯</span> Par module</div>
      <div style="display:flex;justify-content:center;margin-bottom:12px">${svgPie(modEntries.map(([m,c],i)=>({val:c,color:getPC(i)})),130)}</div>
      <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-size:0.68rem">
        ${modEntries.map(([m,c],i)=>`<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${getPC(i)};margin-right:3px"></span>${modIcons[m]||''} ${c}</span>`).join('')}
      </div>
    </div>`;
  }
  h+=`</div>`;

  // ====== GRAPHE ACTIVITÉ (barres) — uniquement en mode global ======
  if(isGlobal&&jourKeys2.length>1){
    h+=`<div class="scroll-card">
      <div class="scroll-stamp">📅</div>
      <div class="scroll-title"><span class="scroll-brush">📅</span> Activité par jour <span class="scroll-subtitle">(1 jour IRL = 1 mois IG)</span></div>`;
    const joursSorted=jourKeys2.sort((a,b)=>{const pa=a.split('/'),pb=b.split('/');return new Date(pa[2],pa[1]-1,pa[0])-new Date(pb[2],pb[1]-1,pb[0])});
    const maxJour=Math.max(...joursSorted.map(d=>parJour[d].length));
    joursSorted.forEach(d=>{
      const entries=parJour[d];
      const proposed=entries.filter(e=>e.noEleve).length;
      const given=entries.length-proposed;
      const pct=maxJour?Math.round(entries.length/maxJour*100):0;
      h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer" onclick="setHistoFilter('${d}')">
        <span style="font-size:0.72rem;color:var(--text-dim);width:70px;flex-shrink:0;text-align:right">${d}</span>
        <div style="flex:1;height:22px;background:rgba(0,0,0,0.04);border-radius:4px;overflow:hidden;position:relative">
          <div style="height:100%;width:${pct}%;background:var(--skin-gradient);border-radius:4px;transition:width 0.3s"></div>
          <span style="position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:0.65rem;font-weight:600;color:var(--text-dim)">${given}${proposed?'+'+proposed+'⚠':''}</span>
        </div>
      </div>`;
    });
    h+=`</div>`;
  }

  // ====== RÉPARTITION PAR MODULE (barres) ======
  h+=`<div class="scroll-card">
    <div class="scroll-stamp">🏯</div>
    <div class="scroll-title"><span class="scroll-brush">🏯</span> Répartition par module</div>`;
  modEntries.forEach(([mod,count])=>{
    const pct=maxMod?Math.round(count/maxMod*100):0;
    const icon=modIcons[mod]||'📚';
    h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="font-size:0.78rem;width:120px;flex-shrink:0;display:flex;align-items:center;gap:4px">${icon} <span style="color:var(--text)">${mod}</span></span>
      <div style="flex:1;height:24px;background:rgba(0,0,0,0.04);border-radius:4px;overflow:hidden;position:relative">
        <div style="height:100%;width:${pct}%;background:var(--skin-gradient);border-radius:4px"></div>
      </div>
      <span style="font-size:0.78rem;font-weight:700;color:var(--skin-primary);width:30px;text-align:right">${count}</span>
    </div>`;
  });
  h+=`</div>`;

  // ====== HEURES (colonnes) ======
  h+=`<div class="scroll-card">
    <div class="scroll-stamp">⏰</div>
    <div class="scroll-title"><span class="scroll-brush">⏰</span> Heures d'enseignement</div>
    <div style="display:flex;align-items:flex-end;gap:3px;height:120px;padding:0 4px">`;
  for(let hr=7;hr<=23;hr++){
    const k=String(hr).padStart(2,'0');
    const val=parHeure[k]||0;
    const pct=maxHeure?Math.round(val/maxHeure*100):0;
    h+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:flex-end" title="${k}h : ${val} cours">
      <span style="font-size:0.58rem;color:var(--text-dim);font-weight:600">${val||''}</span>
      <div style="width:100%;height:${pct}%;min-height:${val?2:0}px;background:${val?'var(--skin-gradient)':'transparent'};border-radius:3px 3px 0 0;transition:height 0.3s"></div>
      <span style="font-size:0.55rem;color:var(--text-muted)">${k}h</span>
    </div>`;
  }
  h+=`</div></div>`;

  // ====== CLASSEMENT ======
  h+=`<div class="scroll-card">
    <div class="scroll-stamp">🏆</div>
    <div class="scroll-title"><span class="scroll-brush">🏆</span> Classement des cours</div>`;
  coursEntries.forEach(([id,data],i)=>{
    const c=cours(id);
    const pct=maxCours?Math.round(data.count/maxCours*100):0;
    const icon=c?modIcons[c.mod]||'📚':'📚';
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer" onclick="openCours('${id}')">
      <span style="font-size:0.85rem;width:24px;text-align:center">${medal||`<span style="font-size:0.7rem;color:var(--text-muted)">${i+1}</span>`}</span>
      <span style="font-size:0.78rem;flex-shrink:0;width:16px">${icon}</span>
      <span style="font-size:0.8rem;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${data.titre}</span>
      <div style="width:80px;height:8px;background:rgba(0,0,0,0.04);border-radius:4px;overflow:hidden;flex-shrink:0">
        <div style="height:100%;width:${pct}%;background:var(--skin-gradient);border-radius:4px"></div>
      </div>
      <span style="font-size:0.75rem;font-weight:700;color:var(--skin-primary);width:25px;text-align:right">${data.count}</span>
      ${data.noEleve?`<span style="font-size:0.6rem;color:var(--accent-orange)">(${data.noEleve}⚠)</span>`:''}
    </div>`;
  });
  h+=`</div>`;

  // ====== JOURNAL ======
  h+=`<div class="scroll-card">
    <div class="scroll-stamp">📋</div>
    <div class="scroll-title"><span class="scroll-brush">📋</span> Journal${isGlobal?' complet':' — '+histoFilter}</div>
    <table style="width:100%;border-collapse:collapse;font-size:0.78rem">
      <tr style="border-bottom:2px solid var(--border);color:var(--text-muted);font-size:0.65rem;text-transform:uppercase;letter-spacing:1px">
        ${isGlobal?'<td style="padding:8px 6px">Date</td>':''}<td style="padding:8px 6px">Heure</td><td style="padding:8px 6px">Cours</td><td style="padding:8px 6px">Module</td><td style="padding:8px 6px;text-align:center">Statut</td></tr>`;
  [...hist].reverse().forEach((e,i)=>{
    const c=cours(e.id);
    const mod=c?c.mod:'—';
    const icon=c?modIcons[mod]||'':'';
    h+=`<tr style="border-bottom:1px solid var(--border);${i%2?'background:var(--bg-card-alt)':''}">
      ${isGlobal?`<td style="padding:6px;color:var(--text-dim)">${e.date}</td>`:''}
      <td style="padding:6px;color:var(--text)">${e.heure}</td>
      <td style="padding:6px;color:var(--text-bright);cursor:pointer" onclick="openCours('${e.id}')">${e.titre}</td>
      <td style="padding:6px;color:var(--text-dim)">${icon} ${mod}</td>
      <td style="padding:6px;text-align:center">${e.noEleve?'<span style="color:var(--accent-orange);font-size:0.7rem">📭 0 élève</span>':'<span style="color:var(--accent-leaf);font-size:0.7rem">✅ Donné</span>'}</td>
    </tr>`;
  });
  h+=`</table></div>`;

  return h;
}

function openPresentation(coursId){
  const c=cours(coursId);if(!c)return;
  const content=CONTENU[coursId]?applySenseiName(CONTENU[coursId],coursId):'';
  const np=NOTES_PROF[coursId];
  const npHtml=np?applySenseiName(np.html,coursId):'';
  const natInfo=coursNature(coursId)?D.natures.find(n=>n.id===coursNature(coursId)):null;
  const overlay=document.createElement('div');
  overlay.className='pres-overlay';
  overlay.innerHTML=`

function loadAvatar(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    // Resize to max 150px to keep localStorage small
    const img=new Image();
    img.onload=function(){
      const max=150;const ratio=Math.min(max/img.width,max/img.height,1);
      const c=document.createElement('canvas');c.width=img.width*ratio;c.height=img.height*ratio;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      setNote('sensei_avatar',c.toDataURL('image/jpeg',0.7));
      render();toast('Avatar mis à jour');
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function generateSaveCode(){
  try{return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){return''}
}
function validateSaveData(d){
  if(!d||typeof d!=='object'||Array.isArray(d))return false;
  const keys=['c','n','sensei','darkMode','noAnim'];
  return keys.some(k=>k in d);
}
function restoreSaveCode(code){
  try{
    const json=decodeURIComponent(escape(atob(code.trim())));
    const data=JSON.parse(json);
    if(!validateSaveData(data)){toast('Format de sauvegarde non reconnu');return false}
    if(data.c)S.c={...S.c,...data.c};
    if(data.n)S.n={...S.n,...data.n};
    if(data.sensei)S.sensei={...S.sensei,...data.sensei};
    if(data.darkMode!==undefined)S.darkMode=data.darkMode;
    if(data.noAnim!==undefined)S.noAnim=data.noAnim;
    save();applyThemeOnLoad();buildSidebar();render();
    toast('Parchemin restauré — bienvenue, '+senseiFullName()+' !');
    return true;
  }catch(e){toast('Code invalide');return false}
}

function doExport(){
  const j=JSON.stringify(S,null,2);
  const b=new Blob([j],{type:'application/json'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;
  a.download='zenkai_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(u);toast('Progression exportée');
}
function showModal(){document.getElementById('modalBg').classList.add('open');document.getElementById('importArea').value=''}
function closeModal(){document.getElementById('modalBg').classList.remove('open')}
function doImport(){
  try{const d=JSON.parse(document.getElementById('importArea').value);
    if(!validateSaveData(d)){toast('Format de sauvegarde non reconnu');return}
    if(d.c)S.c={...S.c,...d.c};if(d.n)S.n={...S.n,...d.n};
    if(d.sensei)S.sensei={...S.sensei,...d.sensei};
    if(d.darkMode!==undefined)S.darkMode=d.darkMode;

  }catch(e){toast('JSON invalide')}
}

// Sons (synthèse audio, pas de fichier externe)
function playClick(){
  try{const a=new AudioContext();const o=a.createOscillator();const g=a.createGain();
  o.connect(g);g.connect(a.destination);o.frequency.value=600;o.type='sine';
  g.gain.setValueAtTime(0.08,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.12);
  o.start(a.currentTime);o.stop(a.currentTime+0.12)}catch(e){}
}
function playSuccess(){
  try{const a=new AudioContext();const now=a.currentTime;
  [523,659,784].forEach((f,i)=>{const o=a.createOscillator();const g=a.createGain();
  o.connect(g);g.connect(a.destination);o.frequency.value=f;o.type='sine';
  g.gain.setValueAtTime(0.06,now+i*0.12);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.12+0.3);
  o.start(now+i*0.12);o.stop(now+i*0.12+0.3)})}catch(e){}
}

function getTourTip(viewId){

  const typed=TOUR_TIPS_TYPED[s.type];

let onboardStep=0;

// Phase 1 : Accueil → ouvre la page sensei
function showOnboarding(){
  const html=`<div class="onboard-overlay" id="onboardOverlay" style="animation:fadeIn 0.4s">
    <div class="onboard-card" style="animation:slideInRight 0.35s ease-out">
      <div class="onboard-icon" style="animation:pulse-glow 2s ease-in-out infinite">🍃</div>
      <div class="onboard-title">Bienvenue à l'Académie de Konoha</div>
      <div class="onboard-text">Ce support de cours s'adapte entièrement à vous.<br>Commencez par <strong>configurer votre profil</strong> — le reste suivra.</div>
      <div class="onboard-btns">
        <button class="btn btn-primary" onclick="playClick();closeOnboarding();nav('sensei')">👤 Configurer mon profil</button>
      </div>
      <div style="margin-top:12px"><span style="font-size:0.72rem;color:var(--text-muted);cursor:pointer" onclick="finishOnboarding();nav('dashboard')">Passer le tutoriel</span></div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}

function closeOnboarding(){
  const el=document.getElementById('onboardOverlay');
  if(el){el.style.opacity='0';el.style.transition='opacity 0.3s';setTimeout(()=>el.remove(),300)}
}

// Phase 2 : Tuto des onglets (lancé après le profil)
function startTourGuide(){
  if(localStorage.getItem('zenkai_onboarded'))return; // déjà fait
  const s=getSensei();
  const t=senseiTypeInfo();
  const nat=D.natures.find(n=>n.id===s.nature);
  const tourViews=['dashboard','cours','annonces','bilan','historique'];
  let step=0;

  function showTourStep(){
    closeTourStep();
    if(step>=tourViews.length){
      // Fin du tour — mot personnalisé
      const finalMsg=ONBOARD_FINAL[s.type]||ONBOARD_FINAL.sage;
      const html=`<div class="onboard-overlay" id="onboardOverlay" style="animation:fadeIn 0.3s">
        <div class="onboard-card" style="animation:slideInRight 0.35s ease-out">
          <div class="onboard-icon" style="animation:pulse-glow 2s ease-in-out infinite">${nat?nat.icon:t.icon}</div>
          <div class="onboard-title">C'est prêt, ${esc(s.prenom)} !</div>
          <div class="onboard-text">
            <div style="font-style:italic;color:${t.couleur};font-size:0.95rem;margin-bottom:16px;line-height:1.7">« ${finalMsg} »</div>
            <div style="font-size:0.82rem;color:var(--text-dim)"><strong>Astuce :</strong> Cliquez sur "✅ Cours donné +1" quand vous donnez un cours.</div>
          </div>
          <div class="onboard-steps">${tourViews.map((_,i)=>'<div class="onboard-dot done"></div>').join('')}<div class="onboard-dot active"></div></div>
          <div class="onboard-btns">
            <button class="btn btn-primary" onclick="playSuccess();finishOnboarding();nav('dashboard')">Commencer à enseigner</button>
          </div>
        </div>
      </div>`;
      document.body.insertAdjacentHTML('beforeend',html);
      return;
    }
    const vid=tourViews[step];
    const lbl=getSidebarLabel(vid);
    const v=VIEWS.find(x=>x.id===vid);
    const tip=getTourTip(vid);
    nav(vid);
    setTimeout(()=>{
      const dots=tourViews.map((_,i)=>`<div class="onboard-dot ${i<step?'done':''} ${i===step?'active':''}"></div>`).join('');
      const html=`<div class="onboard-overlay" id="onboardOverlay" style="animation:fadeIn 0.25s;background:rgba(0,0,0,0.5)">
        <div class="onboard-card" style="animation:slideInRight 0.3s ease-out;text-align:left">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <span style="font-size:1.6rem">${v?v.icon:''}</span>
            <div>
              <div class="onboard-title" style="font-size:1.05rem;margin:0">${lbl}</div>
              <div style="font-size:0.68rem;color:var(--text-muted)">Étape ${step+1}/${tourViews.length}</div>
            </div>
          </div>
          <div class="onboard-text" style="text-align:left;font-size:0.85rem">${tip}</div>
          <div class="onboard-steps">${dots}</div>
          <div class="onboard-btns">
            ${step>0?'<button class="btn" onclick="playClick();onboardTourBack()">← Retour</button>':''}
            <button class="btn btn-primary" onclick="playClick();onboardTourNext()">Suivant →</button>
          </div>
          <div style="margin-top:10px;text-align:center"><span style="font-size:0.72rem;color:var(--text-muted);cursor:pointer" onclick="finishOnboarding();nav('dashboard')">Passer</span></div>
        </div>
      </div>`;
      document.body.insertAdjacentHTML('beforeend',html);
    },150);
  }

  window.onboardTourNext=function(){step++;showTourStep()};
  window.onboardTourBack=function(){step--;showTourStep()};
  showTourStep();
}

function closeTourStep(){
  const el=document.getElementById('onboardOverlay');
  if(el)el.remove();
}

    link.href=fc.toDataURL();
  }catch(e){}
}
