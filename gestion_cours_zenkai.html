"regles_or":`
<h2>Guide de cours oral — Les 8 Règles d'Or</h2>
<p style="color:var(--text-dim);font-style:italic;border-left:3px solid var(--accent-gold);padding-left:12px;margin-bottom:16px">Support professeur - à enseigner à l'oral, pas à distribuer aux élèves.</p>

<hr style="border-color:var(--border);margin:18px 0">
<h3 style="color:var(--accent-gold)">OUVERTURE</h3>

<p><strong>Accroche à dire :</strong></p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">"Aujourd'hui, on parle des fondations. Pas des techniques, pas du chakra - des règles qui font de vous des ninjas de Konoha et pas de simples combattants. Ces 8 règles, vous les connaissez par coeur avant votre première mission. Pas parce que je vous y oblige - parce que le jour où vous en aurez besoin, vous n'aurez pas le temps de réfléchir."</p>

<p><strong>Question à poser :</strong></p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « Selon vous, pourquoi un ninja a besoin de règles ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Laisser 2-3 élèves répondre. L'objectif est de les amener à l'idée que sans règles communes, un groupe de combattants n'est qu'une meute. Ce sont les règles qui font un village.</p>

<hr style="border-color:var(--border);margin:18px 0">
<h3 style="color:var(--accent-gold)">PARTIE 1 - Les règles de loyauté (Règles 1 à 3)</h3>

<p><strong>Règle 1 - Loyauté envers le village</strong></p>
<p>Un ninja doit agir en toutes circonstances dans l'intérêt du village et sous l'autorité du Hokage. Le village passe avant les intérêts personnels, les amitiés et même la famille si nécessaire.</p>

<p><strong>Point clé à marteler :</strong> <em>Le village d'abord. Toujours. Même quand c'est douloureux.</em></p>

<p><strong>Question à poser :</strong></p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « Est-ce que "loyauté envers le village" signifie obéir aveuglément à n'importe qui ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Non - la loyauté va au village, pas à une personne. L'autorité du Hokage est légitime parce qu'il représente le village. C'est une nuance importante à souligner.</p>

<p><strong>Règle 2 - Respect de la hiérarchie</strong></p>
<p>Les ordres des supérieurs doivent être respectés et exécutés avec discipline. On ne conteste pas un ordre sur le terrain. La discussion vient après, au rapport.</p>

<p><strong>Accroche à dire :</strong></p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">"Sur le terrain, un ordre discuté est un ordre qui arrive trop tard. Si vous avez un désaccord, vous le soulevez au rapport, pas au milieu d'une mission. C'est pas de la soumission - c'est de l'efficacité."</p>

<p><strong>Règle 3 - Priorité à la mission</strong></p>
<p>La mission confiée par le village doit être accomplie avec sérieux et détermination. Abandonner sans raison valable est une faute grave. En cas de dilemme (mission vs camarade en danger), la doctrine officielle dit : la mission d'abord. La Volonté du Feu nuance ce point.</p>

<p><strong>Point clé à marteler :</strong> <em>La doctrine dit "mission d'abord". La Volonté du Feu nuance ce point - et c'est une tension que vous devrez assumer.</em></p>

<p><strong>Question à poser :</strong></p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « Un camarade est blessé, la mission est compromise si vous vous arrêtez. Que faites-vous ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Pas de bonne réponse unique ici - c'est voulu. L'objectif est que les élèves comprennent que c'est une vraie tension dans la doctrine ninja, pas un choix simple. Le débat est pédagogique.</p>

<hr style="border-color:var(--border);margin:18px 0">
<h3 style="color:var(--accent-gold)">PARTIE 2 - Les règles de protection et de discrétion (Règles 4 et 5)</h3>

<p><strong>Règle 4 - Protection des habitants</strong></p>
<p>Un shinobi est avant tout un protecteur du village et de ses civils. Les civils sont la raison pour laquelle les ninjas existent. Sans eux, pas de village à protéger.</p>

<p><strong>Accroche à dire :</strong></p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">"Retenez bien ça : vous n'existez pas pour vous battre. Vous existez pour que les civils de ce village puissent vivre sans avoir à se battre. C'est votre raison d'être. Pas la gloire - la protection."</p>

<p><strong>Règle 5 - Secret et discrétion</strong></p>
<p>Les informations relatives aux missions, techniques et stratégies du village doivent rester confidentielles. La confidentialité s'applique même entre shinobi non concernés.</p>

<p><strong>Question à poser :</strong></p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « Pourquoi la confidentialité s'applique même entre ninjas du même village ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Amener l'idée du cloisonnement de l'information : un ninja capturé ne peut révéler que ce qu'il sait. Moins un ninja en sait sur ce qui ne le concerne pas, moins il représente un risque en cas d'interrogatoire ennemi.</p>

<hr style="border-color:var(--border);margin:18px 0">
<h3 style="color:var(--accent-gold)">PARTIE 3 - Les règles de cohésion et d'honneur (Règles 6 à 8)</h3>

<p><strong>Règle 6 - Respect entre shinobi</strong></p>
<p>Les ninjas doivent faire preuve de respect envers leurs camarades et préserver l'unité du village. Les rivalités personnelles ne doivent jamais compromettre la cohésion. Un village divisé est un village vulnérable.</p>

<p><strong>Point clé à marteler :</strong> <em>Rivalités personnelles et unité du village ne sont pas compatibles. Un village divisé est un village vulnérable.</em></p>

<p><strong>Règle 7 - Maîtrise de soi</strong></p>
<p>Un ninja doit contrôler ses émotions et éviter toute violence inutile. Contrôler ses émotions ne signifie pas ne rien ressentir. C'est ne pas laisser ses émotions décider à sa place.</p>

<p><strong>Accroche à dire :</strong></p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">"On me demande souvent si un ninja doit être froid, sans émotions. La réponse est non. Ce qu'on vous demande, c'est que ce soit vous qui décidez - pas votre colère, pas votre peur. Vous ressentez, mais vous choisissez."</p>

<p><strong>Règle 8 - Honneur et responsabilité</strong></p>
<p>Chaque shinobi est responsable de ses actes et représente le village. Vos actions reflètent Konoha. Un comportement déshonorant retombe sur l'ensemble du village.</p>

<p><strong>Question à poser :</strong></p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « Quand vous portez le bandeau de Konoha, qui représentez-vous ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">L'objectif est que les élèves intègrent qu'ils ne sont jamais "juste eux-mêmes" en mission - ils sont l'image du village. Chaque acte, bon ou mauvais, rejaillit sur Konoha.</p>

<hr style="border-color:var(--border);margin:18px 0">
<h3 style="color:var(--accent-gold)">FERMETURE</h3>

<p><strong>Récap' des 8 règles :</strong></p>
<ol>
  <li>Loyauté envers le village - le village passe avant tout</li>
  <li>Respect de la hiérarchie - les ordres s'exécutent, la discussion vient au rapport</li>
  <li>Priorité à la mission - accomplir avec sérieux, ne pas abandonner sans raison valable</li>
  <li>Protection des habitants - les civils sont la raison d'être du ninja</li>
  <li>Secret et discrétion - confidentialité même entre shinobi non concernés</li>
  <li>Respect entre shinobi - les rivalités ne compromettent pas la cohésion</li>
  <li>Maîtrise de soi - contrôler ses émotions, pas les nier</li>
  <li>Honneur et responsabilité - vos actes reflètent Konoha</li>
</ol>

<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">"Ces 8 règles ne sont pas une cage. Ce sont les piliers qui vous permettent de tenir debout quand tout le reste s'effondre. Apprenez-les. Comprenez-les. Et un jour, vous les transmettrez à votre tour."</p>
`,

"nindo":`
<h2>Guide de cours oral — Le Nindo</h2>
<p style="color:var(--text-dim);font-style:italic;border-left:3px solid var(--accent-gold);padding-left:12px;margin-bottom:16px">Support professeur — à enseigner à l'oral, pas à distribuer aux élèves.</p>

<h2>PARTIE 1 — Introduction : poser le cadre</h2>
<p><strong>Accroche à dire :</strong></p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">« Vous avez appris les Règles d'Or — le code du village. Aujourd'hui, on parle de VOTRE code. Celui que personne ne peut vous imposer. »</p>

<ul>
<li><strong>Nindo</strong> = littéralement « le chemin du ninja »</li>
<li>C'est la <strong>philosophie de vie personnelle</strong> d'un shinobi</li>
<li>Sa boussole intérieure — ce qui guide ses choix quand tout devient flou</li>
<li>Chaque ninja a le sien, et <strong>aucun n'est identique</strong></li>
</ul>

<p><strong>Question à poser :</strong></p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « À votre avis, quelle est la différence entre un objectif et une philosophie de vie ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Laisser répondre. Ne pas corriger tout de suite — la suite du cours va clarifier.</p>

<h2>PARTIE 2 — Ce que le Nindo N'EST PAS</h2>
<p><strong>Point clé à marteler :</strong> Un nindo n'est <strong>PAS</strong> un objectif. C'est l'erreur la plus courante.</p>

<table class="contenu-table">
<tr><th>Mauvais Nindo (objectif)</th><th>Pourquoi ça ne marche pas</th></tr>
<tr><td>« Je veux devenir Hokage ! »</td><td>C'est un but. Une fois atteint, il ne guide plus rien.</td></tr>
<tr><td>« Je veux devenir le meilleur médecin ! »</td><td>Pareil — et si tu y arrives, tu fais quoi après ?</td></tr>
<tr><td>« Je veux être le plus fort ! »</td><td>Fort pour quoi ? Pour qui ? Ça ne dit rien sur tes valeurs.</td></tr>
</table>

<p><strong>Explication orale :</strong></p>
<ul>
<li>Un objectif a une <strong>fin</strong> — une fois atteint, il ne guide plus</li>
<li>Un nindo est une <strong>direction permanente</strong> — il t'accompagne toute ta vie</li>
<li>Insister : « Devenir Hokage, c'est un rêve. Protéger ceux qu'on aime, c'est un nindo. »</li>
</ul>

<h2>PARTIE 3 — Ce que le Nindo EST</h2>
<p><strong>Définition à donner :</strong> Le nindo définit tes <strong>valeurs</strong> et ta <strong>vision du monde ninja</strong>. Court, direct, personnel.</p>

<table class="contenu-table">
<tr><th>Bon Nindo</th><th>La valeur derrière</th></tr>
<tr><td>« Je ne laisse personne derrière moi. »</td><td>Solidarité, refus de l'abandon</td></tr>
<tr><td>« La force sert à protéger, jamais à détruire. »</td><td>Vision claire du rôle de la puissance</td></tr>
<tr><td>« Chaque vie mérite qu'on se batte pour elle. »</td><td>Compassion universelle</td></tr>
<tr><td>« Je marcherai toujours droit, même dans la tempête. »</td><td>Intégrité, persévérance</td></tr>
</table>

<p><strong>Question à poser :</strong></p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « Parmi ces exemples, lequel vous parle le plus ? Pourquoi ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Exercice oral rapide — faire parler 2-3 élèves. Pas de bonne ou mauvaise réponse.</p>

<h2>PARTIE 4 — Comment se forge un Nindo</h2>
<p><strong>Points à aborder :</strong></p>
<ul>
<li>Le nindo <strong>ne s'invente pas du jour au lendemain</strong> — c'est normal de ne pas encore avoir le sien</li>
<li>Il se construit à travers les <strong>épreuves</strong> et l'<strong>introspection</strong></li>
<li>C'est souvent après un moment difficile qu'on comprend ce qui compte vraiment</li>
<li>On peut <strong>sonder ses aînés</strong> pour s'inspirer — mais le nindo final doit rester <strong>personnel</strong></li>
<li>On ne copie pas le nindo de son maître tel quel</li>
</ul>

<p><strong>Phrase de transition :</strong></p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">« Votre nindo n'a pas besoin d'être parfait tout de suite. Il mûrira avec vous. L'important, c'est de commencer à y réfléchir. »</p>

<h2>PARTIE 5 — Mise en pratique / échange</h2>
<p><strong>Exercice oral :</strong></p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « Repensez à une épreuve qui vous a marqué. Qu'avez-vous compris ce jour-là sur ce qui compte vraiment pour vous ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Laisser un temps de réflexion. Ceux qui veulent partagent, pas d'obligation. Guider ceux qui confondent encore objectif et philosophie.</p>

<p><strong>Si le temps le permet :</strong></p>
<ul>
<li>Demander à chaque élève de formuler un premier nindo (même brouillon)</li>
<li>Rappeler : court, direct, reflet de ses valeurs — pas un objectif</li>
<li>Les inviter à y revenir plus tard, après d'autres épreuves</li>
</ul>

<h2>Récap' — les 5 points à retenir</h2>
<ol>
<li>Le nindo est une <strong>philosophie de vie</strong>, pas un objectif</li>
<li>Il est <strong>personnel</strong> — chaque ninja a le sien</li>
<li>Les meilleurs nindos sont <strong>courts et directs</strong></li>
<li>Il se forge dans l'<strong>adversité</strong> et l'<strong>introspection</strong></li>
<li>Il accompagne le ninja <strong>toute sa vie</strong> — il évolue avec lui</li>
</ol>

<h2>Nindo d'Eraku — Réponse orale (version complète)</h2>
<p style="font-size:0.85rem;color:var(--text-dim)">Quand un élève demande le nindo d'Eraku en cours. Il donne sa réponse puis retourne la question aux élèves.</p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">« On me le demande à chaque fois. Alors je vous le donne, mais écoutez la fin.</p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic"><strong>Être une présence pour ceux qui n'en ont pas.</strong></p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">Je ne l'ai pas trouvé dans un livre. J'ai eu un ami. Il donnait sans compter, il était honnête jusqu'à l'os, et il est mort un jour où je n'étais pas là. Ce jour-là j'ai compris ce qui compte pour moi. Pas être fort. Être là. Pour celui qui tombe et qui n'a personne. Pour celui qui n'a pas de clan et qu'on a convaincu de rêver petit.</p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">Voilà pourquoi je suis devant vous. Vous croyez que je suis là pour les mudras. Je suis là pour que quelqu'un vous attende.</p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">Maintenant la fin : ce nindo est le mien. Si vous le recopiez, il ne vous servira à rien. Le vôtre est quelque part dans une épreuve que vous avez déjà traversée, ou pas encore. Cherchez-le là. »</p>

<h2>Nindo d'Eraku — Réponse courte (interruption en leçon)</h2>
<p style="font-size:0.85rem;color:var(--text-dim)">Version rapide quand un élève le coupe en pleine leçon.</p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">« Être une présence pour ceux qui n'en ont pas. Je vous raconterai d'où il vient quand vous aurez commencé à chercher le vôtre. »</p>
`,

"volonte_feu":`
<h2>Guide de cours oral — La Volonté du Feu</h2>
<p style="color:var(--text-dim);font-style:italic;border-left:3px solid var(--accent-gold);padding-left:12px;margin-bottom:16px">Support professeur - à enseigner à l'oral, pas à distribuer aux élèves.</p>

<h3>OUVERTURE</h3>
<p><strong>Accroche à dire :</strong></p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">"Avant de parler de techniques ou de jutsu, je veux que vous compreniez pourquoi vous vous battez. Pas comment - pourquoi. C'est ça, la Volonté du Feu."</p>

<h3>PARTIE 1 : Doctrine 1 - Protéger Konoha</h3>
<p><strong>Point clé à marteler :</strong> Le village passe avant tout. Tous les sacrifices sont nécessaires pour protéger Konoha.</p>
<p><strong>Question à poser :</strong></p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « Pour vous, c'est quoi "votre famille" à Konoha ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Laisser répondre. Ramener vers : chaque habitant est un membre de la famille de Konoha, qu'il soit ninja ou civil, qu'il partage votre sang ou non. Insister sur le "ou non" - c'est là que ça devient universel.</p>
<p><strong>Point clé à marteler :</strong> La Volonté du Feu n'est pas qu'un slogan. C'est la conviction que ce village vaut la peine d'être défendu, que les gens à l'intérieur de ces murs sont votre famille.</p>
<p><strong>Question à poser :</strong></p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « Est-ce que quelqu'un peut me dire la différence entre obéir à un ordre et défendre sa famille ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Attendre les réponses. L'objectif est de faire comprendre que la Volonté du Feu transforme le devoir en conviction personnelle - ce n'est plus un ordre, c'est un choix.</p>

<h3>PARTIE 2 : Doctrine 2 - La transmission des rêves</h3>
<p><strong>Accroche à dire :</strong></p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">"Un ninja peut mourir. Ses idéaux, eux, ne meurent jamais - à condition que quelqu'un les porte."</p>
<p><strong>Point clé à marteler :</strong> Les rêves non accomplis se transmettent aux descendants ou aux disciples. L'héritage d'Hashirama perdure à travers les générations.</p>
<p>Développer à l'oral : un ninja qui tombe au combat ne disparaît pas. Ses idéaux vivent à travers ceux qu'il a inspirés.</p>
<p><strong>Question à poser :</strong></p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « Hashirama rêvait d'un monde en paix. Il est mort. Est-ce que ce rêve est mort avec lui ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Réponse attendue : non. Développer : ce rêve vit dans chaque shinobi de Konoha qui protège un civil, forme un élève, ou refuse de céder face à l'adversité. Ce sont des actes concrets, pas des mots.</p>
<p><strong>Question à poser :</strong></p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « Vous, aujourd'hui, est-ce que vous portez le rêve de quelqu'un ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Question personnelle, ne pas forcer les réponses. L'idée est de connecter la doctrine à leur propre parcours de genin/chunin.</p>

<h3>FERMETURE</h3>
<p><strong>Récap' :</strong></p>
<ul>
<li>Doctrine 1 : le village et ses habitants sont votre famille - ninja ou civil, peu importe le sang.</li>
<li>Doctrine 2 : vos rêves et ceux de ceux qui vous ont formés continuent à vivre à travers vos actes.</li>
</ul>
<p><strong>Phrase de fermeture à dire :</strong></p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">"La Volonté du Feu, ce n'est pas quelque chose que vous recevez. C'est quelque chose que vous choisissez de porter, chaque jour, à travers chaque mission et chaque décision."</p>
`,

"histoire":`
<h2>Guide de cours oral - Les origines de Konoha et le rôle des grands clans</h2>
<p style="color:var(--text-dim);font-style:italic;border-left:3px solid var(--accent-gold);padding-left:12px;margin-bottom:16px">Support professeur - à enseigner à l'oral, pas à distribuer aux élèves.</p>

<hr style="border:none;border-top:1px solid var(--border);margin:18px 0">

<h3>OUVERTURE</h3>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">Accroche à dire : "Vous marchez chaque jour dans les rues de Konoha. Vous saluez les Jonin, vous traversez le quartier des clans, vous levez les yeux vers la Roche des Hokage. Mais est-ce que vous savez vraiment ce qu'il a fallu pour que tout ca existe ? Pas des légendes. Pas des mythes. De la boue, du sang, des alliances impossibles. Voila ce qu'on va regarder aujourd'hui en face."</p>

<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">Question à poser : → « Selon vous, pourquoi les villages cachés ont-ils été créés ? Qu'est-ce qui existait avant ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Laisser deux ou trois élèves répondre librement. L'objectif est de faire émerger l'idée de guerre et de chaos, pas d'obtenir la bonne réponse tout de suite. Rebondir sur leurs réponses pour introduire la Partie 1.</p>

<hr style="border:none;border-top:1px solid var(--border);margin:18px 0">

<h3>PARTIE 1 - Avant Konoha : un Pays du Feu en guerre</h3>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">Accroche à dire : "Imaginez le Pays du Feu sans Hokage. Sans académie. Sans village. Juste des territoires que des clans se disputent à coups de jutsu, et des familles entières qui vivent de contrats de guerre. C'est ca, le point de départ. Pas de paix. Pas de règles communes. Juste la survie."</p>

<p>Avant les villages cachés, le Pays du Feu n'est qu'un territoire fracturé. Clans et mercenaires vivent de guerre, de contrats et de survie. Cinq clans dominent ce paysage chaotique - retenez bien chacun d'eux, car ils sont tous encore présents dans Konoha aujourd'hui.</p>

<p><strong>Point clé à marteler :</strong> Ces cinq clans ne sont pas interchangeables. Chacun a une identité propre, une façon de penser et de se battre. Ce n'est pas anodin - ca explique encore aujourd'hui pourquoi ils occupent des rôles différents dans le village.</p>

<ul style="margin:10px 0 10px 20px">
<li style="margin-bottom:10px"><strong>Senju</strong> - Polyvalence totale : combat, soins, sceaux, stratégie. Leur vitalité est presque mythique. Ils ont aussi la capacité de rallier les familles mineures autour d'eux, ce qui en fait des leaders naturels.</li>
<li style="margin-bottom:10px"><strong>Uchiha</strong> - Puissance brute et Sharingan. Une fierté ardente, des mercenaires redoutés sur tout le continent. Ils sont, avant la fondation, les grands adversaires des Senju. Deux forces opposées d'égale puissance.</li>
<li style="margin-bottom:10px"><strong>Hyuga</strong> - Isolés dans les montagnes. Ils possèdent le Byakugan et maîtrisent le style Joken. Leur philosophie : observer le monde plutôt que le conquérir. Ce sont des gens qui regardent, analysent, attendent.</li>
<li style="margin-bottom:10px"><strong>Nara</strong> - Gardiens de forêt et éleveurs de cerfs. Leur technique signature est le contrôle des ombres. Leur philosophie est simple mais profonde : réfléchir avant d'agir. Toujours.</li>
<li style="margin-bottom:10px"><strong>Akimichi</strong> - Robustes et solidaires. Ils sont les remparts vivants de leurs alliés. Ils privilégient les alliances et la diplomatie plutôt que la conquête. La force au service de la cohésion.</li>
</ul>

<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">Question à poser : → « Si vous deviez choisir l'un de ces cinq clans pour être votre allié dans un monde en guerre, lequel serait-il et pourquoi ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Question de positionnement. Pas de mauvaise réponse. L'objectif est de faire réfléchir les élèves aux valeurs de chaque clan avant de passer à la fondation. Garder les réponses courtes - deux ou trois élèves maximum.</p>

<hr style="border:none;border-top:1px solid var(--border);margin:18px 0">

<h3>PARTIE 2 - Hashirama, Madara et la fondation de Konoha</h3>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">Accroche à dire : "Maintenant, je vais vous parler de deux hommes. Deux hommes qui se sont rencontrés enfants, qui ont rêvé de la même chose, et que le destin a opposés. L'un d'eux a failli réussir l'impossible. L'autre a failli tout faire basculer. Ensemble, ils ont quand même construit quelque chose que personne n'aurait cru possible."</p>

<p><strong>Hashirama Senju</strong> n'est pas un guerrier comme les autres. Ce qui le motive, ce n'est pas la gloire ou le territoire - c'est un rêve simple et radical : que les enfants ne meurent plus au combat. De l'autre côté, <strong>Madara Uchiha</strong>, façonné par des pertes successives, aspire lui aussi à protéger les siens. Deux hommes, deux clans ennemis, la même douleur profonde.</p>

<p>Leur amitié d'enfance est réelle - et elle sera brisée par le poids de leurs identités de chefs rivaux. Mais cette amitié, même fracturée, devient le moteur de quelque chose d'inédit : l'idée qu'une paix durable est possible.</p>

<p><strong>Point clé à marteler :</strong> Ce qui fonde Konoha, ce n'est pas une victoire militaire. C'est une alliance entre ennemis. C'est un choix délibéré de poser les armes alors que chacun aurait pu continuer à se battre. Ca, c'est fondamental pour comprendre la Volonté du Feu.</p>

<p>Après des affrontements sanglants, une alliance dite « impensable » finit par naître. Sur un terrain neutre façonné par le Mokuton d'Hashirama, ils fondent ensemble <strong>Konohagakure</strong> - le Village Caché dans les Feuilles. Hashirama devient le Premier Hokage et incarne dès ce moment la <strong>Volonté du Feu</strong> : l'idée que le village est une famille, et que chaque génération doit transmettre cette flamme à la suivante.</p>

<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">Question à poser : → « La fondation de Konoha repose sur une alliance entre deux clans ennemis. Est-ce que ca vous semble solide comme base ? Pourquoi ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Question ouverte pour provoquer une réflexion critique. Certains élèves diront que non, que des ennemis ne peuvent pas vraiment s'allier - c'est une excellente porte d'entrée vers la suite du cours, notamment le départ de Madara et la crise Uchiha sous Tobirama.</p>

<hr style="border:none;border-top:1px solid var(--border);margin:18px 0">

<h3>PARTIE 3 - Le rôle des grands clans dans la construction du village</h3>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">Accroche à dire : "Konoha ne s'est pas construit tout seul. Hashirama et Madara ont posé la première pierre, mais ce sont les clans qui ont bâti tout le reste. Chacun a apporté quelque chose de différent. Et ce qu'ils ont apporté à l'époque, ca définit encore aujourd'hui leur place dans le village."</p>

<h4 style="margin:14px 0 6px 0">1. Senju - Architectes du village</h4>
<p>Les Senju participent à tout : politique, infrastructures, lois, protection. Hashirama pose la vision d'ensemble. Son frère Tobirama, lui, la transforme en institutions concrètes - l'Académie, l'ANBU, le système de missions. Les Senju sont partout, dans chaque aspect de la fondation du village.</p>
<p>Après la mort d'Hashirama et de Tobirama, les Senju se dispersent dans toutes les couches du village. Moins visibles en tant que clan, oui - mais leur héritage est dilué dans chaque institution qui continue de fonctionner.</p>
<p><strong>Point clé à marteler :</strong> Quand vous passez l'Académie, quand vous recevez une mission classifiée par rang, vous utilisez un système pensé par Tobirama Senju. L'héritage Senju, c'est l'architecture invisible de Konoha.</p>

<h4 style="margin:14px 0 6px 0">2. Uchiha - Pilier militaire</h4>
<p>Madara accepte l'alliance. Mais son départ - et sa défaite à la Vallée de la Fin contre Hashirama - traumatisent profondément le clan Uchiha. Une blessure identitaire qui ne se referme jamais vraiment.</p>
<p>Sous Tobirama, les Uchiha reçoivent un rôle officiel : la Police de Konoha. En apparence, c'est une position de prestige. En réalité, leur quartier est déplacé vers la périphérie du village. Le résultat ? Un clan puissant militairement, mais politiquement isolé et constamment soupçonné de loyauté douteuse.</p>
<p><strong>Point clé à marteler :</strong> L'histoire des Uchiha à Konoha, c'est l'histoire d'une intégration qui n'a jamais été complète. Ce n'est pas un détail - ca aura des conséquences majeures pour le village bien des années plus tard.</p>

<h4 style="margin:14px 0 6px 0">3. Hyuga - Sentinelles silencieuses</h4>
<p>Les Hyuga développent le Joken au sein du village. Ils mettent en place la séparation entre Branche Principale et Branche Secondaire - une mesure destinée à protéger le secret du Byakugan en cas de capture ennemie. Une décision qui aura elle aussi des conséquences profondes sur le clan.</p>
<p>Ils rejoignent Konoha tardivement, mais dignement. Leur rôle dans le village : sécurité, surveillance, collecte d'informations. Des piliers stables, discrets, fiables.</p>

<h4 style="margin:14px 0 6px 0">4. Nara - Cerveaux et archives</h4>
<p>Le clan Nara apporte au village sa technique du Kagemane - le contrôle des ombres - mais surtout sa capacité à penser là où d'autres agissent. Ils tiennent les archives secrètes du village. Leur principe fondateur reste le même qu'avant la fondation : réfléchir avant d'agir.</p>
<p>Sous Tobirama, ils s'intègrent aux forces spéciales, à l'administration, et sont à l'origine de la Section des Renseignements. En période de crise, les Nara restent calmes et soutiennent les transitions politiques. Ce sont les stabilisateurs du village.</p>

<h4 style="margin:14px 0 6px 0">5. Akimichi - Force logistique et cohésion</h4>
<p>Les Akimichi et leur technique de Multi-Expansion n'ont pas que de la puissance brute à offrir. Ils portent avec eux une culture du partage, de la solidarité concrète. À la fondation : ils fournissent la main-d'oeuvre, les greniers, la logistique qui permet au village de tenir debout dans ses premières années.</p>
<p>Sous Tobirama, ils s'occupent de l'administration, de la logistique militaire, de la protection des civils. Et surtout, ils jouent un rôle de médiateurs entre les clans - parce que les Akimichi, tout le monde leur fait confiance.</p>

<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">Question à poser : → « Si l'un de ces cinq clans avait refusé de rejoindre Konoha, lequel aurait causé le plus de dégâts à la fondation du village ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Question ouverte de synthèse sur les rôles des clans. Bonne façon de vérifier que les élèves ont bien retenu les spécificités de chacun. Chaque réponse est défendable si elle est argumentée - valoriser le raisonnement, pas la réponse.</p>

<hr style="border:none;border-top:1px solid var(--border);margin:18px 0">

<h3>PARTIE 4 - Tobirama : l'institutionnalisation et la crise</h3>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">Accroche à dire : "Hashirama était un rêveur. Un géant. Quelqu'un qui imposait la paix par la seule force de sa présence. Quand il est mort, Konoha a hérité de Tobirama. Un homme très différent. Moins chaleureux, plus froid, plus méthodique. Et c'est précisément ce dont le village avait besoin pour survivre."</p>

<p>Tobirama Senju impose la structure là où son frère portait le rêve. Il comprend une chose essentielle : un village ne peut pas reposer sur la personnalité d'un seul homme. Il lui faut des institutions. Des systèmes qui fonctionnent même quand le chef n'est plus là.</p>

<p>Voila ce qu'il construit :</p>
<ul style="margin:10px 0 10px 20px">
<li style="margin-bottom:8px"><strong>L'Académie Ninja</strong> - une formation uniforme et encadrée pour tous les futurs shinobi du village. Plus de transmission clan par clan, au bon vouloir des familles : une formation commune, des standards communs.</li>
<li style="margin-bottom:8px"><strong>L'ANBU</strong> - les forces spéciales du village, pour les missions que le village ne peut pas reconnaître officiellement.</li>
<li style="margin-bottom:8px"><strong>Le système de missions classifiées par rang</strong> - D, C, B, A, S. Une hiérarchie claire pour organiser les contrats et adapter les équipes aux dangers réels.</li>
<li style="margin-bottom:8px"><strong>Les protocoles de sécurité et codes internes officiels</strong> - la colonne vertébrale administrative du village.</li>
</ul>

<p><strong>Point clé à marteler :</strong> Tobirama n'a pas juste géré l'après-Hashirama. Il a transformé un village-idée en un village-institution. C'est lui qui rend Konoha durable. Sans lui, la Volonté du Feu serait peut-être restée un beau discours sans structure pour la porter.</p>

<p>Mais Tobirama meurt en mission. Et avant de mourir, il désigne <strong>Hikamatsu Nara</strong> comme successeur. Le problème : cette décision n'est pas officialisée. Il n'y a pas de protocole de transmission clair. Résultat : un vide politique brutal.</p>

<p>Ce vide paralyse Konoha. Les factions deviennent inquiètes. Les décisions sont retardées. Les Jonin sont désorientés. Les civils sentent la tension. Le village, dans cet état d'incertitude, devient vulnérable.</p>

<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">Question à poser : → « Tobirama a construit des institutions solides - et pourtant sa propre succession a failli faire s'effondrer ce qu'il avait construit. Comment est-ce possible ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">C'est la question de synthèse centrale de ce cours. L'idée est de faire comprendre aux élèves que même les systèmes les plus solides ont des angles morts. Tobirama a pensé aux institutions mais pas assez au protocole de succession. Une leçon directement applicable à leur propre rôle futur dans le village.</p>

<hr style="border:none;border-top:1px solid var(--border);margin:18px 0">

<h3>FERMETURE</h3>
<p><strong>Récap des points essentiels :</strong></p>
<ul style="margin:8px 0 12px 20px">
<li style="margin-bottom:6px">Avant Konoha, le Pays du Feu est un territoire de guerre fracturé entre clans - cinq d'entre eux dominent : Senju, Uchiha, Hyuga, Nara, Akimichi, chacun avec ses forces propres.</li>
<li style="margin-bottom:6px">Hashirama Senju et Madara Uchiha, anciens amis et chefs ennemis, fondent Konohagakure sur une alliance impensable. Hashirama devient le Premier Hokage et incarne la Volonté du Feu.</li>
<li style="margin-bottom:6px">Chaque grand clan joue un rôle distinct dans la construction du village : les Senju en architectes, les Uchiha comme pilier militaire mais politiquement isolés, les Hyuga en sentinelles, les Nara en cerveaux et archives, les Akimichi en force logistique et médiatrice.</li>
<li style="margin-bottom:6px">Tobirama transforme le rêve d'Hashirama en institutions durables : Académie, ANBU, système de missions, protocoles de sécurité.</li>
<li style="margin-bottom:6px">La mort de Tobirama et la désignation non officialisée d'Hikamatsu Nara comme successeur créent un vide politique qui fragilise tout le village.</li>
</ul>

<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">Phrase de fermeture à dire : "Konoha n'est pas tombé du ciel. Il a été voulu, négocié, construit - et presque détruit plusieurs fois avant même d'avoir véritablement commencé. Chaque institution que vous utilisez, chaque règle que vous suivez, chaque clan que vous croisez dans ces rues : tout ca a une histoire. Et connaître cette histoire, c'est comprendre pourquoi ce village vaut la peine d'être défendu. On s'arrête là pour aujourd'hui."</p>
`,

"decomposition_chakra":`
<h2>Guide de cours oral — Décomposition du Chakra</h2>
<p style="color:var(--text-dim);font-style:italic;border-left:3px solid var(--accent-gold);padding-left:12px;margin-bottom:16px">Support professeur — à enseigner à l'oral, pas à distribuer aux élèves.</p>

<h2>OUVERTURE — Poser le cadre</h2>
<p><strong>Accroche à dire :</strong></p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">« Approchez. Aujourd'hui, pas de technique. Pas de jutsu. On va parler de ce qui les rend tous possibles.<br><br>Dites-moi : quand vous malaxez votre chakra, qu'est-ce que vous faites, concrètement ? Vous fermez les yeux, vous serrez les poings, et vous sentez quelque chose monter en vous. Mais cette chose, c'est quoi ? D'où elle vient ? De quoi elle est faite ?<br><br>Si vous ne savez pas répondre, c'est normal. C'est justement pour ça qu'on est là. Avant de courir, on apprend à marcher. Avant de lancer un jutsu, on apprend ce qui le nourrit. »</p>

<p><strong>Question à poser :</strong></p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « À votre avis, le chakra vient d'où ? De vos mains ? De votre ventre ? Du ciel ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Laisser répondre librement. Ne pas corriger tout de suite — le cours va construire la réponse.</p>

<h2>PARTIE 1 — Le chakra, une énergie composée</h2>
<p><strong>Point clé à marteler :</strong> Le chakra ne tombe pas du ciel. Il naît <strong>en toi</strong>, de la rencontre de deux énergies que tu portes déjà.</p>

<ul>
<li>Le chakra est la <strong>fusion</strong> de deux énergies : le corps et l'esprit</li>
<li>Quand ces deux énergies se rencontrent dans la bonne proportion, le chakra devient utilisable</li>
<li>C'est cette fusion qui permet de gravir un arbre sans les mains, de marcher sur l'eau, ou de lancer une technique</li>
<li>Pas de corps sans esprit, pas d'esprit sans corps — le chakra vit de leur <strong>équilibre</strong></li>
</ul>

<p><strong>Explication orale :</strong></p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">« Pensez à un feu. Il lui faut du bois et de l'air. Enlevez l'un des deux, le feu s'éteint. Le chakra, c'est pareil : il a besoin de vos deux énergies en même temps. »</p>

<h2>PARTIE 2 — Les deux composantes</h2>
<p><strong>Tableau à présenter :</strong></p>

<table class="contenu-table">
<tr><th>Énergie</th><th>Ce qu'elle représente</th><th>Polarité</th><th>Nature</th></tr>
<tr><td>Énergie physique</td><td>Le corps, les cellules, la force vitale</td><td>Yang</td><td>Yôton</td></tr>
<tr><td>Énergie spirituelle</td><td>L'esprit, l'expérience, l'entraînement mental</td><td>Yin</td><td>Inton</td></tr>
</table>

<p><strong>Points à développer :</strong></p>
<ul>
<li>L'énergie physique se renforce par l'effort du <strong>corps</strong> : entraînement, endurance, vitalité</li>
<li>L'énergie spirituelle se renforce par l'effort de l'<strong>esprit</strong> : méditation, expérience, volonté</li>
<li>Un ninja qui ne travaille que son corps aura un chakra <strong>instable</strong></li>
<li>Un ninja qui ne travaille que son esprit aura un chakra <strong>faible</strong></li>
<li>Insister : « Un déséquilibre épuise vite le chakra et la fusion devient instable. »</li>
</ul>

<p><strong>Question à poser :</strong></p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « D'après vous, pourquoi un shinobi qui médite mais ne s'entraîne jamais physiquement serait en difficulté en combat ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Orienter vers l'idée de déséquilibre. Le corps nourrit le Yang, l'esprit nourrit le Yin — il faut les deux.</p>

<h2>PARTIE 3 — Le réseau et le noyau</h2>
<p><strong>Point clé :</strong> Le chakra ne reste pas immobile. Il <strong>circule</strong> dans tout le corps par un réseau qui lui est propre.</p>

<ul>
<li>Au centre : le <strong>noyau du chakra</strong>, situé dans l'abdomen — le foyer d'où tout part</li>
<li>Depuis ce noyau, le chakra se répartit vers le reste du corps</li>
<li>Le chakra peut se <strong>séparer en différents flux</strong> : un flux pour les pieds qui escaladent, un autre pour les mains qui forment les mudras, un autre pour une technique en préparation</li>
</ul>

<p><strong>Image à donner :</strong></p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">« Imaginez une rivière qui prend sa source dans votre ventre. Elle se divise en ruisseaux qui alimentent chaque partie de votre corps. Quand vous marchez sur l'eau, un ruisseau descend vers vos pieds. Quand vous composez des mudras, un autre monte vers vos mains. Le noyau, c'est la source. Tout part de là. »</p>

<h2>PARTIE 4 — Les Tenketsu</h2>
<p><strong>Définition à donner :</strong> Un Tenketsu est un <strong>point de chakra</strong>. Le corps en compte <strong>361</strong> au total.</p>

<ul>
<li>Parmi ces 361 points, <strong>64 sont importants</strong> : ce sont des carrefours majeurs du réseau</li>
<li>Le chakra se concentre et se redistribue à ces points</li>
<li>Maîtriser ses Tenketsu = diriger son énergie avec <strong>précision</strong></li>
<li>Certaines techniques visent les Tenketsu de l'adversaire : <strong>fermer un Tenketsu bloque le passage du chakra</strong> à cet endroit</li>
</ul>

<p><strong>Chiffres à retenir (faire répéter) :</strong></p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « Combien de Tenketsu dans le corps ? <strong>361.</strong> Combien d'importants ? <strong>64.</strong> »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Faire répéter à voix haute. Poser la question plus tard dans le cours pour vérifier.</p>

<p><strong>Exemple concret :</strong></p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">« Un Hyūga qui frappe un Tenketsu dans votre bras, c'est comme si quelqu'un posait un barrage sur un ruisseau. L'eau s'arrête. Le chakra aussi. Votre bras ne peut plus malaxer. Et la technique que vous prépariez ? Elle s'effondre. »</p>

<h2>PARTIE 5 — La Compensation (Sosaï)</h2>
<p><strong>Transition à faire :</strong></p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">« Maintenant que vous savez comment le chakra circule en vous, parlons de ce qui se passe quand deux chakras se rencontrent. Quand vos techniques croisent celles de l'ennemi. »</p>

<p><strong>Point clé :</strong> La Compensation, ou <strong>Sosaï</strong>, se produit quand deux jutsus s'annulent mutuellement.</p>

<p><strong>Les deux conditions (doivent être réunies en même temps) :</strong></p>
<ul>
<li><strong>Même niveau</strong> — puissance équivalente</li>
<li><strong>Même nature</strong> — la même énergie en jeu</li>
</ul>

<p><strong>À bien expliquer :</strong></p>
<ul>
<li>Si les deux conditions sont remplies : les techniques <strong>s'annulent</strong>, aucune ne l'emporte</li>
<li>Si une condition manque, ce n'est <strong>plus</strong> une Compensation :
  <ul>
  <li>Différence de <strong>niveau</strong> → la technique la plus forte passe</li>
  <li>Différence de <strong>nature</strong> → on entre dans le cycle des natures (étudié dans un autre module)</li>
  </ul>
</li>
</ul>

<p><strong>Question à poser :</strong></p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « Un Katon de rang Genin croise un Katon de rang Genin. Que se passe-t-il ? Et si l'un des deux est de rang Chūnin ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Première réponse : Compensation, annulation. Deuxième réponse : pas de Compensation — le plus fort passe.</p>

<h2>PARTIE 6 — Vérification rapide</h2>
<p><strong>Questions orales à poser (vrai ou faux) :</strong></p>
<ol>
<li>« Le chakra naît uniquement de l'énergie physique. »<br>
<span style="color:var(--konoha-red)">→ FAUX.</span> <span style="font-size:0.85rem;color:var(--text-dim)">Il naît de la fusion de deux énergies : physique (Yang, Yôton) et spirituelle (Yin, Inton).</span></li>
<li>« Le noyau du chakra se situe dans l'abdomen. »<br>
<span style="color:var(--accent-leaf)">→ VRAI.</span> <span style="font-size:0.85rem;color:var(--text-dim)">C'est le foyer central, l'énergie part de là.</span></li>
<li>« Le corps compte 64 Tenketsu au total. »<br>
<span style="color:var(--konoha-red)">→ FAUX.</span> <span style="font-size:0.85rem;color:var(--text-dim)">361 au total. 64 sont les points importants.</span></li>
<li>« Le chakra peut se séparer en différents flux pendant qu'il circule. »<br>
<span style="color:var(--accent-leaf)">→ VRAI.</span> <span style="font-size:0.85rem;color:var(--text-dim)">C'est ce qui permet de répartir l'énergie vers plusieurs usages en même temps.</span></li>
<li>« L'énergie spirituelle correspond au Yang. »<br>
<span style="color:var(--konoha-red)">→ FAUX.</span> <span style="font-size:0.85rem;color:var(--text-dim)">L'énergie spirituelle correspond au Yin (Inton). Le Yang (Yôton) est l'énergie physique.</span></li>
</ol>

<h2>FERMETURE — Récap' et ouverture</h2>
<p><strong>Les 5 points à retenir :</strong></p>
<ol>
<li>Le chakra naît de la <strong>fusion</strong> de deux énergies : physique (Yang, Yôton) et spirituelle (Yin, Inton)</li>
<li>Son <strong>noyau</strong> se situe dans l'abdomen</li>
<li>Il circule dans un <strong>réseau</strong> et peut se séparer en plusieurs flux</li>
<li>Le corps compte <strong>361 Tenketsu</strong>, dont 64 importants</li>
<li>La <strong>Compensation</strong> (Sosaï) annule deux jutsus de même niveau et de même nature</li>
</ol>

<p><strong>Phrase de fermeture :</strong></p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">« Maintenant vous savez de quoi le chakra est fait. Vous savez d'où il vient, comment il circule, et ce qui se passe quand deux techniques se rencontrent. La prochaine étape, c'est apprendre à le mettre en forme. C'est le rôle des Mudras et des Natures, dans les modules suivants.<br><br>Retenez une chose : le chakra n'est pas un réservoir à vider. C'est un courant à maîtriser. »</p>
`,

"mudras_cours":`
<h2>Guide de cours oral — Les Mudras</h2>
<p style="color:var(--text-dim);font-style:italic;border-left:3px solid var(--accent-gold);padding-left:12px;margin-bottom:16px">Support professeur — à enseigner à l'oral, pas à distribuer aux élèves.</p>

<h3>OUVERTURE</h3>
<p>Accroche à dire :</p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">« Avant même de lancer un jutsu, vous devez parler le langage du chakra. »</p>

<h3>PARTIE 1 - Définition et liste des mudras</h3>
<p>Question à poser :</p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « C'est quoi des mudras ? Et combien il en existe ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Laisser les élèves répondre, puis compléter.</p>
<p><strong>Point clé à marteler :</strong> Ce sont des gestes qui permettent de modeler le chakra. Sans mudras, le chakra est instable, ce qui amène à des jutsu ratés. Il y en a <strong>12</strong> : Bélier, Bœuf, Cheval, Chien, Coq, Dragon, Lièvre, Rat, Sanglier, Serpent, Singe, Tigre.</p>

<h3>PARTIE 2 - Fonctions des mudras</h3>
<p>Question à poser :</p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « A quoi servent-ils ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Attendre des propositions, puis dérouler les trois fonctions.</p>
<p><strong>Point clé à marteler :</strong> Les mudras servent à :</p>
<ul>
<li><strong>Canaliser</strong> le chakra</li>
<li><strong>Transformer</strong> le chakra (eau, feu, etc.)</li>
<li><strong>Stabiliser</strong> le chakra</li>
</ul>

<h3>PARTIE 3 - Execution correcte d'un mudra</h3>
<p>Question à poser :</p>
<p style="background:var(--bg-input);padding:8px 14px;border-radius:6px">→ « Quelles sont les choses importantes quand on realise un Mudra ? »</p>
<p style="font-size:0.85rem;color:var(--text-dim)">Laisser les élèves proposer, puis insister sur chaque point.</p>
<p><strong>Point clé à marteler :</strong></p>
<ul>
<li>Etre <strong>précis</strong>, <strong>rapide</strong> et <strong>fluide</strong></li>
<li>L'<strong>ordre des mudras</strong> est crucial</li>
<li>Si vous réfléchissez pendant vos mudras, vous êtes déjà en retard - <strong>ça doit être instinctif</strong></li>
</ul>

<h3>PARTIE 4 - Tableau des 12 Mudras</h3>
<p>Présenter le tableau en détaillant chaque mudra et sa fonction dans le flux de chakra :</p>
<table class="contenu-table">
<tr><th>#</th><th>Mudra</th><th>Fonction</th></tr>
<tr><td>1</td><td>Rat</td><td>Initie la mise en mouvement du chakra</td></tr>
<tr><td>2</td><td>Bœuf</td><td>Donne une structure au chakra et empêche la technique de se disperser</td></tr>
<tr><td>3</td><td>Tigre</td><td>Amplifie et intensifie le flux</td></tr>
<tr><td>4</td><td>Lièvre</td><td>Fluidifie le flux de chakra</td></tr>
<tr><td>5</td><td>Dragon</td><td>Concentre le chakra sous une forme dense</td></tr>
<tr><td>6</td><td>Serpent</td><td>Apporte la précision</td></tr>
<tr><td>7</td><td>Cheval</td><td>Intensifie et accélère le flux</td></tr>
<tr><td>8</td><td>Bélier / Chèvre</td><td>Équilibre et harmonise le chakra</td></tr>
<tr><td>9</td><td>Singe</td><td>Coordonne les enchaînements complexes</td></tr>
<tr><td>10</td><td>Coq / Oiseau</td><td>Projette et dirige le chakra</td></tr>
<tr><td>11</td><td>Chien</td><td>Protège et structure en défense</td></tr>
<tr><td>12</td><td>Sanglier / Cochon</td><td>Permet une libération plus brutale du chakra</td></tr>
</table>

<h3>FERMETURE</h3>
<p>Récap' oral : rappeler les 3 fonctions (canaliser, transformer, stabiliser), les 3 qualités d'exécution (précis, rapide, fluide) et l'importance de l'ordre.</p>
<p>Phrase de fermeture :</p>
<p style="background:var(--bg-parchment);padding:10px 14px;border-radius:6px;font-style:italic">« Travaillez vos mudras jusqu'à ce qu'ils deviennent un réflexe… car le jour où votre vie en dépendra… vous n'aurez pas droit à l'erreur. »</p>
`,

"nature_theorie":`
<h2>Le Cycle des 5 Natures</h2>
<p>Chaque nature de chakra est supérieure à une autre et inférieure à une autre, formant un cycle :</p>
<p style="text-align:center;font-size:1rem;font-weight:600;margin:12px 0">🔥 Katon → 🌬️ Futon → ⚡ Raiton → 🌍 Doton → 💧 Suiton → 🔥 Katon</p>
<table class="contenu-table">
<tr><th>Nature</th><th>Élément</th><th>Force spéciale</th><th>Bat</th><th>Perd contre</th></tr>
<tr><td>Katon</td><td>Feu</td><td>Inflige des brûlures</td><td>Futon</td><td>Suiton</td></tr>
<tr><td>Futon</td><td>Vent</td><td>Accélère la vitesse</td><td>Raiton</td><td>Katon</td></tr>
<tr><td>Raiton</td><td>Foudre</td><td>Étourdit la cible</td><td>Doton</td><td>Futon</td></tr>
<tr><td>Doton</td><td>Terre</td><td>Renforce la robustesse</td><td>Suiton</td><td>Raiton</td></tr>
<tr><td>Suiton</td><td>Eau</td><td>Absorbe le chakra</td><td>Katon</td><td>Doton</td></tr>
</table>

<h2>Le Test de la Feuille</h2>
<p>Méthode pour déterminer sa nature de chakra :</p>
<ul>
<li><strong>Katon</strong> — la feuille brûle</li>
<li><strong>Suiton</strong> — la feuille s'humidifie</li>
<li><strong>Doton</strong> — la feuille s'effrite</li>
<li><strong>Raiton</strong> — la feuille se plie</li>
<li><strong>Futon</strong> — la feuille se coupe</li>
</ul>

<h2>Kekkei Genkai — Combinaisons avancées</h2>
<p>Certains shinobi peuvent combiner deux natures pour créer un élément unique :</p>
<table class="contenu-table">
<tr><th>Kekkei Genkai</th><th>Combinaison</th><th>Art</th></tr>
<tr><td>Mokuton</td><td>Doton + Suiton</td><td>Bois</td></tr>
<tr><td>Hyoton</td><td>Suiton + Futon</td><td>Glace</td></tr>
<tr><td>Yoton</td><td>Doton + Katon</td><td>Lave</td></tr>
<tr><td>Bakuton</td><td>Doton + Raiton</td><td>Explosions</td></tr>
<tr><td>Ranton</td><td>Suiton + Raiton</td><td>Orage</td></tr>
<tr><td>Shakuton</td><td>Katon + Futon</td><td>Chaleur</td></tr>
<tr><td>Jinton</td><td>Katon + Futon + Doton</td><td>Particules (Kekkei Tōta — 3 natures)</td></tr>
</table>
`,

"taijutsu_theorie":`
<h2>Les 3 branches du combat ninja</h2>
<p>Tout shinobi peut se spécialiser dans l'une ou plusieurs de ces branches :</p>
<ul>
<li><strong>Ninjutsu</strong> — Techniques basées sur le chakra et les mudras</li>
<li><strong>Genjutsu</strong> — Illusions qui trompent les sens de l'adversaire</li>
<li><strong>Taijutsu</strong> — Combat au corps à corps, mains nues ou armes</li>
</ul>

<h2>Le Taijutsu</h2>
<p>Le Taijutsu est l'art du combat physique. Il ne requiert généralement <strong>ni chakra ni mudras</strong>, ce qui lui donne un avantage clé : la <strong>rapidité d'exécution</strong>. Pas besoin de composer des mudras — le corps est l'arme.</p>
<p>Le Taijutsu n'est pas de la force brute. C'est un <strong>savoir-faire</strong> : la maîtrise du corps, la vitesse, le timing, le positionnement. Un combattant malin en Taijutsu bat un adversaire plus fort mais moins technique.</p>
`,

"armes_cours":`
<h2>Armes de lancer</h2>
<h3>Kunai (20-30 cm)</h3>
<p>Poignard robuste avec anneau. L'arme la plus polyvalente du ninja : attaquer, lancer, grimper, creuser. Peut servir d'outil autant que d'arme.</p>
<h3>Shuriken (5-10 cm)</h3>
<p>Étoile métallique à plusieurs pointes. Efficace à distance ou au corps à corps. Matériel indispensable du shinobi.</p>
<h3>Senbon (15-25 cm)</h3>
<p>Aiguilles fines et légères. Permettent de toucher des points vitaux ou neutraliser discrètement. Arme de précision.</p>

<h2>Armes de mêlée</h2>
<h3>Katana (~1m total, 60-80 cm de lame)</h3>
<p>Sabre traditionnel à lame courbée. Combat rapproché, frappes rapides et précises. Peut être amélioré en y insufflant du chakra.</p>

<h2>Équipement tactique</h2>
<h3>Makibishi (2-5 cm)</h3>
<p>Petites pointes métalliques dispersées au sol pour ralentir ou blesser les ennemis en fuite ou en poursuite.</p>
<h3>Clochettes (quelques cm)</h3>
<p>Dispositifs sonores pour détecter ou piéger un ennemi. Combinables avec un Kunai pour décentraliser l'attention de l'adversaire.</p>
<h3>Bombe fumigène (5-10 cm)</h3>
<p>Capsule libérant un nuage de fumée pour masquer les mouvements, fuir ou surprendre. Effet non permanent.</p>
<h3>Parchemin explosif (10-20 cm)</h3>
<p>Feuille avec sceau de Fuinjutsu déclenchant une explosion. Utilisable comme piège ou arme à distance.</p>
`,

"infiltration":`
<h2>Les bases de l'infiltration</h2>
<p>L'infiltration est l'art de passer inaperçu en territoire ennemi ou inconnu. Elle repose sur quatre piliers : la tenue, l'attitude, l'apparence et le mensonge.</p>

<h3>1. Changement de tenue</h3>
<p>Adapter sa tenue à l'environnement et au type de mission. Tenue sobre de marchand ou paysan pour un hameau, tenue adaptée au village ennemi pour une infiltration militaire. L'objectif : ne pas attirer l'attention.</p>

<h3>2. Changement d'attitude</h3>
<p>S'identifier à quelqu'un d'autre pour ne pas dévoiler ses traits de caractère. Ne pas être trop suspicieux ni trop impatient. Contrôler ses réactions naturelles — un ninja infiltré qui sursaute au bruit d'un kunai grille immédiatement sa couverture.</p>

<h3>3. Changement d'apparence</h3>
<p>Modifier son apparence physique (cheveux, vêtements, posture). Se préparer psychologiquement à un changement d'identité qui peut durer longtemps.</p>

<h3>4. Mensonge convaincant</h3>
<p>Trouver un rôle pertinent et crédible. Un paysan ou marchand dans un hameau vaut mieux qu'un prince perdu. Rester convaincant et ouvert à l'imprévu. Maintenir sa couverture sous pression.</p>
`,

"bourrasque":`
<h2>La Bourrasque Ardente</h2>
<p>Technique de coup de pied rotatif à 360°. Requiert une bonne souplesse des hanches — la jambe doit agir comme un fouet. Entraînement progressif : d'abord les low kicks, puis la rotation complète.</p>

<h3>Phase 1 : Série de Low Kicks</h3>
<ul>
<li>Travail des coups de pied bas en duo sur Pao (cible rembourrée), série de 10</li>
<li>Montée progressive en intensité</li>
<li>Low kick rotatif sur surface rigide (arbre/poteau), série de 10 — roll possible</li>
</ul>

<h3>Phase 2 : La Bourrasque (rotation 360°)</h3>
<ul>
<li>Saut avec rotation 360° et retombée sur pieds (×5)</li>
<li>Extension de la jambe non-appui pendant la rotation</li>
<li>Exécution au sol : vitesse de rotation, engagement épaules/hanches, jambe tendue</li>
</ul>
`,

"pied_aube":`
<h2>Le Pied de l'Aube</h2>
<p>Technique de saut offensif. Les muscles fessiers sont la base de la puissance de saut. Technique facilement parable si vue, mais permet de combler l'espace — sert aux offensives surprise et ouvertures d'enchaînement.</p>

<h3>Phase 1 : Travail des fessiers et élasticité</h3>
<p>Tour de terrain avec alternance de positions :</p>
<ul>
<li>Position accroupie / en canard</li>
<li>Saut groupé vertical (genoux au torse)</li>
<li>Saut de grenouille</li>
<li>Sprint</li>
</ul>

<h3>Phase 2 : Squats en binôme</h3>
<p>Séries de squats face à face. Au signal, l'un saute sur les épaules de l'autre. Chanter « L'Aube est l'espoir de Konoha » pendant l'exercice. Alternance au second signal.</p>

<h3>Phase 3 : Technique du Pied de l'Aube</h3>
<p>Démonstration par un HG, puis exécution. Application en offensive surprise et ouverture d'enchaînement.</p>
`,

"saut_chakra":`
<h2>Saut de Chakra</h2>
<p>Le saut de chakra est une question de <strong>précision</strong>, pas de force brute. Le chakra se concentre dans la plante des pieds.</p>
<ul>
<li><strong>Trop de chakra</strong> = perte de contrôle, propulsion incontrôlée</li>
<li><strong>Pas assez</strong> = pas de décollage</li>
</ul>
<p>Adapter les angles selon la situation : haut (esquive/toit), avant (distance), côté (esquive latérale), arrière (repli).</p>

<h3>Mudras requis</h3>
<p><strong>Rat → Bélier → Tigre</strong></p>

<h3>Déroulement</h3>
<ul>
<li>Échauffement : sauts sans chakra</li>
<li>Malaxer le chakra et concentrer sur la plante des pieds (roll 50+)</li>
<li>Libérer le chakra pour propulsion</li>
<li>Objectif : rejoindre le professeur sur le toit de l'Académie</li>
</ul>
`,

"nature_combat":`
<h2>Analyse et Combat par Nature de Chakra</h2>
<p>Apprendre à lire un combat, adapter ses techniques en fonction des natures de chakra adverses, et éviter l'effet tunnel. Observer, réfléchir, puis agir.</p>

<h3>Phase 1 : Analyse des forces et faiblesses</h3>
<p>Former des groupes mixtes par nature de chakra. Discussion des forces et faiblesses de chaque nature (10 min), puis exposé des conclusions au groupe complet.</p>

<h3>Phase 2 : Combat avec analyse tactique</h3>
<ul>
<li>Combats en équipe avec obligation d'analyser et construire des actions</li>
<li>Collaborer avec ses coéquipiers</li>
<li>Débriefing : chaque équipe donne 2 points positifs et 2 à améliorer</li>
<li>Le groupe vainqueur affronte les Chūnins</li>
</ul>
`,

"jeu_roi":`
<h2>Le Jeu du Roi</h2>
<p>Exercice de protection de cible prioritaire. Le <strong>Roi</strong> est un professeur. Deux groupes : attaque et défense. Combat, diplomatie et négociation sont autorisés.</p>
<p><strong>Règle fondamentale :</strong> si le Roi est blessé, tout le monde échoue — attaquants comme défenseurs.</p>

<h3>Équipe Défense — Protection de cible</h3>
<ul>
<li>Organiser la défense autour du Roi</li>
<li>Gérer les menaces multiples simultanément</li>
<li>Maintenir la protection sans blesser le Roi par accident</li>
</ul>

<h3>Équipe Attaque — Capture stratégique</h3>
<ul>
<li>Capturer le Roi <strong>sans le blesser</strong></li>
<li>Utiliser combat, diplomatie et négociation</li>
<li>Coordonner l'approche en équipe</li>
</ul>
`,

"permutation":`
<h2>La Permutation</h2>
<p>La Permutation est une technique de substitution fondamentale. Elle consiste à remplacer son corps par un objet (rondin, pierre, etc.) au moment précis où une attaque va toucher, permettant au ninja d'esquiver et de se repositionner.</p>

<h3>Principe</h3>
<p>Le ninja doit anticiper l'attaque adverse et, au bon moment, substituer son corps avec un objet à proximité. L'adversaire croit avoir touché sa cible, mais ne frappe qu'un leurre.</p>
<ul>
<li>Le timing est essentiel — trop tôt, l'adversaire s'adapte ; trop tard, le coup touche</li>
<li>L'objet de substitution doit être à portée</li>
<li>Après la permutation, le ninja doit immédiatement se repositionner pour contre-attaquer ou fuir</li>
</ul>

<h3>Utilité tactique</h3>
<ul>
<li><strong>Défensif</strong> — Esquiver une attaque qui semblait inévitable</li>
<li><strong>Offensif</strong> — Créer une ouverture en surprenant l'adversaire après la substitution</li>
<li><strong>Repositionnement</strong> — Se dégager d'une situation dangereuse</li>
</ul>
`,

"raiton_cours":`
<h2>Techniques Raiton — La Foudre</h2>
<p>Le Raiton est l'art de manipuler la nature de chakra Foudre. Ces techniques demandent une bonne maîtrise des mudras et une concentration précise du chakra dans les paumes.</p>

<h3>Ninjutsu Raiton</h3>

<h4>1. Rayon Instantané</h4>
<p><strong>Mudras :</strong> Serpent → Lièvre</p>
<p><strong>Type :</strong> Offensif — possibilité de toucher plusieurs ennemis en même temps</p>
<p>L'utilisateur concentre son chakra dans sa paume droite afin de lancer un rayon d'éclair là où il vise. Plus il le canalise en amont, plus il durera longtemps.</p>

<h4>2. Boule Fulgurante</h4>
<p><strong>Mudras :</strong> Dragon → Serpent</p>
<p><strong>Type :</strong> Offensif fort — favorise le corps à corps, difficile à toucher à distance</p>
<p>L'utilisateur concentre son chakra dans les paumes de ses mains avant de les diriger en avant pour envoyer une boule de foudre droit vers où il vise. Inflige de lourds dégâts.</p>

<h4>3. Ruée Foudroyante</h4>
<p><strong>Mudras :</strong> Singe → Cheval → Serpent</p>
<p><strong>Type :</strong> Offensif et défensif — contrôle de zone</p>
<p>L'utilisateur concentre son chakra dans ses paumes afin de le libérer au sol sous une ruée de foudre qui va tout droit vers la direction visée. Cette ruée reste un moment au sol. Si elle touche quelqu'un de front, elle infligera des dégâts. Si une personne marche sur la ligne laissée, elle prendra aussi les dégâts. La ligne disparaît au bout d'un certain temps.</p>

<h4>4. Zone Fulgurante</h4>
<p><strong>Mudras :</strong> Serpent → Rat → Chien</p>
<p><strong>Type :</strong> Offensif — large zone d'effet</p>
<p>L'utilisateur concentre son chakra dans ses paumes afin de le libérer au sol, donnant forme à une zone électrique tout autour.</p>

<h3>Taijutsu</h3>

<h4>5. Bourrasque Ardente</h4>
<p><strong>Mudras :</strong> Aucun</p>
<p>Technique de taijutsu au corps à corps.</p>

<h4>6. Pied de l'Aube</h4>
<p><strong>Mudras :</strong> Aucun</p>
<p>Technique de taijutsu au corps à corps.</p>
`,

"capture_drapeau":`
<h2>Simulation — Capture de Drapeau</h2>
<p>Simulation tactique en <strong>1 à 3 manches</strong>. Chaque manche se déroule en deux phases. Retour entre chaque manche pour adaptation de la stratégie.</p>

<h3>Phase Diplomatie (7 minutes)</h3>
<p>Négociation entre les équipes avant chaque phase de combat. Que la négociation aboutisse ou non, le combat suit. Préparer une stratégie diplomatique, adapter selon le résultat.</p>

<h3>Phase Combat (5 minutes)</h3>
<ul>
<li>Organiser la défense de position autour du drapeau</li>
<li>Coordonner l'offensive pour capturer le drapeau adverse</li>
<li>Gérer les priorités en temps réel</li>
<li>Débriefing et adaptation entre les manches</li>
</ul>
`,

"infiltration_pratique":`
<h2>Infiltration — Exercice pratique</h2>
<p style="color:var(--text-dim);font-style:italic;border-left:3px solid var(--accent-gold);padding-left:12px;margin-bottom:16px">Support professeur — Proposé par Akio Fukurō. Lieu : Hameau des rizières. Minimum 6 senseis, 20-30 élèves.</p>

<h3>Préparation</h3>
<p>Les senseis se rendent au Hameau des rizières avant les élèves et prennent position en tant que bandits. Chacun a un <strong>défaut exploitable</strong> défini à l'avance (gourmandise, cupidité, stupidité...) qui l'amènera à lâcher l'information recherchée. Se mettre d'accord sur l'information secrète à partager.</p>

<h3>Déroulement</h3>
<p>Les élèves forment des groupes de 5 avec radio. Missions : s'infiltrer sans se faire repérer comme ninja, et récolter l'information secrète en faisant parler les senseis.</p>
<ul>
<li>Si un élève est identifié comme ninja → direction la taverne « prison »</li>
<li>Si un élève bloque trop longtemps sur un sensei → le sensei dit « Je ne veux plus te parler »</li>
<li>Espionner un autre groupe ou une conversation est une méthode valide</li>
<li><strong>COMBAT INTERDIT</strong></li>
</ul>
<p>Durée : 30 minutes.</p>

<h3>Évaluation</h3>
<ul>
<li>Groupe ayant obtenu l'information ou non</li>
<li>Groupe revenu en entier ou non</li>
<li>Méthode d'obtention (manipulation, espionnage...)</li>
</ul>

<h3>Conclusion</h3>
<p>Rassemblement par équipe. Chaque sensei donne son point de vue et des pistes d'amélioration. Retour à l'Académie.</p>
`,

"traque":`
<h2>La Traque</h2>
<p style="color:var(--text-dim);font-style:italic;border-left:3px solid var(--accent-gold);padding-left:12px;margin-bottom:16px">Support professeur — Proposé par Inoshi Baikutai & Gaoh Uragiri. Besoin : plusieurs senseis + police si besoin.</p>

<h3>Mise en situation</h3>
<p>Le professeur annonce aux élèves qu'une missive est arrivée : l'Académie est mandatée pour retrouver un ninja recherché.</p>
<p><em>« Chers élèves, nous avons été contactés pour localiser / interpeller un ninja qui a commis plusieurs délits envers Konoha. Les membres de la police sont déjà à sa poursuite et pourront vous donner des informations. Formez vos équipes et venez chercher l'indice. »</em></p>

<h3>Indices possibles</h3>
<ul>
<li>Le nom du ninja</li>
<li>Un détail physique</li>
<li>La tenue portée</li>
</ul>
<p>Un ou plusieurs senseis se cachent / se baladent dans une zone définie. Des leurres sont aussi présents.</p>

<h3>Conclusion</h3>
<p>Féliciter les élèves ayant réussi. Proposer à chaque élève d'exposer sa méthode. Discuter les difficultés rencontrées et trouver des solutions ensemble. Faire participer tout le monde.</p>
`,

"enquete":`
<h2>L'Enquête</h2>
<p style="color:var(--text-dim);font-style:italic;border-left:3px solid var(--accent-gold);padding-left:12px;margin-bottom:16px">Support professeur — Proposé par Inoshi Baikutai. Nécessite préparation de scénarios en amont.</p>

<h3>Scénario</h3>
<p>Un ninja a été attaqué en traître. Plusieurs suspects, plusieurs témoins à interroger. Les élèves mènent l'enquête et doivent fournir une réponse argumentée à la fin.</p>

<h3>Déroulement</h3>
<ul>
<li>Présentation de la situation aux élèves</li>
<li>Phase d'interrogatoire libre des témoins (joués par les senseis)</li>
<li>Les élèves recoupent les témoignages</li>
<li>Chaque groupe rend sa conclusion</li>
</ul>

<h3>Conclusion</h3>
<p>Recueillir le ressenti des élèves. Identifier les sources de difficulté. Organiser un groupe de parole pour partager les astuces et méthodologies de chacun.</p>
`,

"orientation_terrain":`
<h2>Course d'orientation et analyse du terrain</h2>
<p style="color:var(--text-dim);font-style:italic;border-left:3px solid var(--accent-gold);padding-left:12px;margin-bottom:16px">Support professeur — Proposé par Akio Fukurō. Max 9 élèves par sensei. Supervision par radio. Durée : 20-30 min.</p>

<h3>Principe</h3>
<p>Les élèves reçoivent un indice menant à un lieu du Pays du Feu et un élément à identifier sur place. 4 lieux à trouver au total.</p>

<h3>Lieux possibles</h3>
<ul>
<li>Temple du Feu</li>
<li>Hameau des rizières</li>
<li>Vallée de la fin</li>
<li>Domaine militaire</li>
<li>Autres lieux du Pays du Feu</li>
</ul>

<h3>Déroulement</h3>
<ul>
<li>Distribution du premier indice (énigme)</li>
<li>Les élèves déchiffrent et se rendent au lieu</li>
<li>Identification de l'élément sur place</li>
<li>Nouvel indice pour le lieu suivant</li>
</ul>
`,

"pays_feu_visite":`
<h2>Pays du Feu — Orientation et visite</h2>
<p style="color:var(--text-dim);font-style:italic;border-left:3px solid var(--accent-gold);padding-left:12px;margin-bottom:16px">Support professeur — Proposé par Jihon Ichirin. Visite guidée complète.</p>

<h3>Itinéraire</h3>
<ul>
<li><strong>Départ :</strong> Konoha</li>
<li><strong>Pays des Rivières</strong> — zone dangereuse, expliquer les risques</li>
<li><strong>Pays des Plages</strong> — zone neutre</li>
<li><strong>Domaine Uchiwa</strong> — histoire du clan</li>
<li><strong>Forêt interdite</strong> — règles et dangers</li>
<li><strong>Temple du Feu</strong> — lieu sacré</li>
<li><strong>Pays du Fer</strong> — haut risque, frontière sensible</li>
<li><strong>Vallée de la fin</strong> — lieu historique (Hashirama vs Madara)</li>
<li><strong>Tanzaku</strong> — ville civile</li>
<li><strong>Frontières du Marais et d'Ame</strong> — INTERDITES</li>
</ul>

<h3>Contrôle en cours de route</h3>
<p>Interroger les élèves sur les directions. Retour par le domaine militaire. Conclusion sur la plateforme des Hokage.</p>
`,

"simulation_mission":`
<h2>Simulation de Mission — Dilemmes moraux</h2>
<p style="color:var(--text-dim);font-style:italic;border-left:3px solid var(--accent-gold);padding-left:12px;margin-bottom:16px">Support professeur — Proposé par Gromlof. Besoin : plusieurs acteurs (espion, marchand, bandits).</p>

<h3>Briefing aux élèves</h3>
<p>Donner une information confidentielle du village aux élèves : <em>« Il y a un rendez-vous du conseil du feu à 23h dans le domaine des Uchiha. »</em></p>
<p>Mission : transmettre cette info à un homme masqué au village des rizières. Délai : 5 minutes. Échec = privation d'examen pendant 2 ans.</p>

<h3>Dilemme 1 — Mission vs Village</h3>
<p>L'homme masqué est en conversation et mentionne qu'il doit faire un rapport à <strong>Amegakure</strong> (s'assurer qu'au moins 3 élèves l'entendent).</p>
<ul>
<li>S'ils donnent l'info → ils ont perdu (la mission nuit au village)</li>
<li>S'ils ne la donnent pas → ils ont gagné (esprit critique face à la hiérarchie)</li>
</ul>

<h3>Dilemme 2 — Mission vs Protection</h3>
<p>Un acteur joue un marchand de Konoha attaqué par 2 bandits (acteurs). Il appelle à l'aide.</p>
<ul>
<li>S'ils l'ignorent → ils ont perdu</li>
<li>S'ils l'aident → ils ont gagné (les bandits fuient si tous les élèves se rassemblent, ~3 min)</li>
</ul>

<h3>Conclusion</h3>
<p>Révéler toute la vérité. Féliciter ceux qui ont réussi. Aucune conséquence réelle — l'exercice teste le jugement moral.</p>
`,

"simulation_escorte":`
<h2>Simulation d'Escorte</h2>
<p style="color:var(--text-dim);font-style:italic;border-left:3px solid var(--accent-gold);padding-left:12px;margin-bottom:16px">Support professeur — Par Yumi Amano. 10 élèves max, 3 professeurs, 3 policiers.</p>

<h3>Trajets possibles</h3>
<ul>
<li>Village → Temple du Feu</li>
<li>Village → Hameau des Rizières</li>
<li>Village → Hameau des Pêcheurs</li>
</ul>

<h3>Types de missions</h3>
<ul>
<li>Escorte de personne</li>
<li>Livraison sécurisée</li>
<li>Surveillance de trajet</li>
</ul>

<h3>Axes travaillés</h3>

<li>Gestion du stress en déplacement</li>
<li>Communication en terrain ouvert</li>
<li>Placement défensif</li>
<li>Réaction face à l'imprévu</li>
<li>Capacité de négociation</li>
<li>Sortir les élèves de leur zone de confort</li>
</ul>
`

let modeProf=false;
function getIState(cid){const r=S.n[cid+'::istate'];if(r)try{return JSON.parse(r)}catch(e){};return{done:[],answers:{},notes:{}}}
function saveIState(cid,st){S.n[cid+'::istate']=JSON.stringify(st);save()}
function iFirstIncomplete(cid){const ist=getIState(cid),blocs=INTERACTIF[cid];for(let i=0;i<blocs.length;i++)if(!ist.done.includes(i))return i;return blocs.length-1}
function iCalcScore(cid){
  const blocs=INTERACTIF[cid],ist=getIState(cid);let total=0,obtained=0;
  blocs.forEach((b,i)=>{
    if(b.type==='qcm'&&b.scored){total++;if(ist.answers[i]===b.correct)obtained++}
    if(b.type==='vrai_faux'&&b.scored){const ans=ist.answers[i]||{};b.items.forEach((it,j)=>{total++;if(ans[j]===it.reponse)obtained++})}
    if(b.type==='tri'&&b.scored){const ans=ist.answers[i]||{};b.items.forEach((it,j)=>{total++;if(ans[j]===it.cat)obtained++})}
  });return{total,obtained};
}
