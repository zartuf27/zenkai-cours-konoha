nindo:{
  sage:'Votre nindo n\'a pas besoin d\'être parfait tout de suite. Il mûrira avec vous. L\'important, c\'est de commencer à y réfléchir.',
  dur:'Un ninja sans nindo est un kunai sans lame. Arrêtez de tourner en rond et forgez-vous une conviction. Maintenant.',
  guerrier:'Votre nindo, c\'est le cri qui monte de vos tripes quand tout semble perdu ! Trouvez-le, et plus rien ne pourra vous faire tomber !',
  bienveillant:'Prenez le temps de chercher votre nindo. Il n\'y a pas de mauvaise réponse, juste des chemins différents. Le vôtre est déjà en vous.',
  mysterieux:'Le nindo ne se trouve pas. Il se révèle — souvent dans les moments où l\'on n\'avait plus la force de chercher.',
  stratege:'Le nindo est votre algorithme de décision quand toutes les données manquent. Sans lui, vous ne faites que réagir. Avec lui, vous décidez.',
  veteran:'J\'ai changé de nindo trois fois. La première fois par naïveté, la deuxième par douleur, la troisième parce que j\'ai enfin compris ce pour quoi je me battais vraiment.',
  fraternel:'Ton nindo, c\'est pas un truc qu\'on t\'impose. C\'est ce qui te fait te lever le matin même quand tout va mal. Prends le temps de le trouver, je serai là.',
  ironique:'Ah, le nindo... Vous allez tous me sortir "protéger mes amis", n\'est-ce pas ? Original. Essayez de trouver quelque chose qui vous appartient vraiment.',
  ermite:'Mon premier nindo, c\'était "manger des ramens tous les jours". Bon, j\'ai évolué depuis — mais au moins, c\'était sincère ! Le vôtre doit l\'être aussi.',
  ombre:'Le nindo est un luxe que les agents de terrain ne peuvent pas toujours se permettre. Mais c\'est aussi ce qui les empêche de devenir des machines. Trouvez le vôtre.',
  sensei_noble:'Le nindo est un serment que l\'on prête devant soi-même. Il n\'y a pas de parjure plus grave que de trahir sa propre voie.',
  rebelle:'On m\'a dit que mon nindo était stupide. Que je ne pouvais pas changer le système. Devinez quoi — c\'est toujours mon nindo, et je suis toujours debout.',
  mentor:'Le nindo naît dans le silence intérieur. Ne le cherchez pas dans le bruit du monde — fermez les yeux, respirez, et écoutez ce que votre cœur murmure.',
  chasseur:'Mon nindo, c\'est simple : traquer jusqu\'au bout, ne jamais abandonner une piste. Trouvez le vôtre avec la même clarté. Pas de fioritures.',
  tacticien:'Le nindo est l\'outil le plus dangereux qui soit. Montrez-le à l\'ennemi, et il saura exactement comment vous manipuler. Gardez-le pour vous.'
},
volonte_feu:{
  sage:'La flamme ne s\'éteint que si personne ne la porte. Vous êtes la prochaine génération à la transmettre.',
  dur:'La Volonté du Feu n\'est pas un joli discours pour les cérémonies. C\'est ce qui vous empêche de fuir quand tout brûle autour de vous.',
  guerrier:'Cette flamme coule dans vos veines ! Si vous la sentez, alors relevez la tête et marchez ! Konoha ne tombe que si ses enfants abandonnent !',
  bienveillant:'La Volonté du Feu, c\'est simplement ça : protéger les gens qu\'on aime, et transmettre le meilleur de soi à ceux qui viennent après nous.',
  mysterieux:'Le feu ne demande pas à être compris. Il demande à être porté. Certains le portent comme un flambeau. D\'autres le deviennent.',
  stratege:'La Volonté du Feu est le principe unificateur de Konoha. Sans cohésion doctrinale, un village n\'est qu\'un amas de maisons. Retenez-le.',
  veteran:'J\'ai vu des camarades mourir en portant cette flamme. Ils n\'ont pas hésité. La Volonté du Feu, ce n\'est pas un concept — c\'est le dernier souffle de ceux qui vous ont précédés.',
  fraternel:'La Volonté du Feu, c\'est ce truc bizarre qui fait que tu risquerais ta vie pour le gamin d\'à côté sans même réfléchir. C\'est ça, être une famille.',
  ironique:'Ah, la Volonté du Feu. Le discours préféré de chaque Hokage quand il faut motiver les troupes. Sauf que — et c\'est agaçant — ça marche vraiment.',
  ermite:'La Volonté du Feu ? Moi je dis que c\'est comme le saké : ça réchauffe, ça donne du courage, et ça fait faire des trucs qu\'on n\'aurait jamais osé sobre.',
  ombre:'La Volonté du Feu est un outil de cohésion efficace. Dans l\'ombre, nous la servons sans la brandir. Le résultat compte, pas le symbole.',
  sensei_noble:'Cette flamme fut allumée par les fondateurs eux-mêmes. La porter est un honneur sacré, pas un slogan. Traitez-la avec la révérence qu\'elle mérite.',
  rebelle:'J\'ai longtemps cru que la Volonté du Feu, c\'était du bourrage de crâne. Et puis un jour, j\'ai failli perdre quelqu\'un. Et j\'ai compris que cette flamme, c\'était juste l\'amour.',
  mentor:'La flamme extérieure n\'est que le reflet de celle qui brûle en vous. Avant de porter la Volonté du Feu pour le village, allumez-la dans votre propre cœur.',
  chasseur:'Le feu marque un territoire. La Volonté du Feu, c\'est notre façon de dire : cette terre est à nous, et on la défendra crocs dehors.',
  tacticien:'La Volonté du Feu est un pacte implicite entre chaque ninja de Konoha. Celui qui le comprend peut unir n\'importe quel groupe. C\'est un levier redoutable.'
},
histoire:{
  sage:'Connaître l\'histoire de votre village, c\'est comprendre pourquoi il vaut la peine d\'être défendu.',
  dur:'Si vous ne connaissez pas l\'histoire de Konoha, vous ne méritez pas de porter ce bandeau. Apprenez, ou dégagez.',
  guerrier:'Des guerres, du sang, des sacrifices immenses ! Konoha n\'est pas née d\'un souhait — elle est née de la sueur et du courage de ceux qui ont refusé de baisser les bras !',
  bienveillant:'Chaque pierre de ce village raconte une histoire de sacrifice et d\'espoir. En les connaissant, vous comprendrez pourquoi tant de gens se sont battus pour nous.',
  mysterieux:'L\'histoire n\'est pas le passé. C\'est un miroir. Regardez bien — vous verrez votre propre reflet parmi les ombres de ceux qui vous ont précédés.',
  stratege:'L\'histoire est une base de données de succès et d\'échecs. L\'ignorer, c\'est se condamner à refaire les erreurs de ses prédécesseurs.',
  veteran:'J\'étais là quand certaines de ces pages d\'histoire s\'écrivaient. Croyez-moi, elles étaient bien moins glorieuses en vrai. Mais c\'est justement pour ça qu\'il faut les connaître.',
  fraternel:'L\'histoire de Konoha, c\'est l\'histoire de ta famille. Les Senju, les Uchiha, tous ceux qui ont bâti ce village — ce sont tes ancêtres, même si tu ne portes pas leur nom.',
  ironique:'Formidable, un cours d\'histoire. Je vois déjà vos yeux se fermer. Pourtant, chaque ninja qui a ignoré le passé a fini par le répéter. Amusant, non ?',
  ermite:'L\'histoire, c\'est comme un bon roman d\'aventure — sauf que les personnages sont réels et que la suite dépend de vous. Pas mal comme pression, hein ?',
  ombre:'L\'histoire officielle est une version. Il en existe d\'autres, classifiées. Retenez au moins celle qu\'on vous autorise à connaître.',
  sensei_noble:'Hashirama et Madara ont posé la première pierre de ce village. Chaque nom gravé dans notre histoire mérite d\'être prononcé avec respect.',
  rebelle:'L\'histoire est écrite par les vainqueurs. N\'avalez pas tout sans réfléchir. Mais connaissez-la quand même — pour savoir ce qu\'on ne vous dit pas.',
  mentor:'L\'histoire d\'un village est le karma collectif de ses habitants. Comprendre d\'où l\'on vient éclaire le chemin qu\'il reste à parcourir.',
  chasseur:'Chaque sentier de Konoha a été foulé par des légendes. Quand tu marches dans la forêt, tu marches sur leurs traces. Respecte le territoire.',
  tacticien:'L\'histoire est un répertoire de stratégies testées en conditions réelles. Celui qui l\'étudie dispose d\'un arsenal que les autres n\'imaginent même pas.'
},
decomposition_chakra:{
  sage:'Le chakra n\'est pas un réservoir à vider. C\'est un courant à maîtriser.',
  dur:'Pas de place pour l\'à-peu-près. Un déséquilibre de chakra, et c\'est votre propre technique qui vous détruit. Concentration absolue.',
  guerrier:'Le chakra brûle en vous ! Apprenez à le sentir, à le diriger, et vous pourrez déplacer des montagnes ! Mais d\'abord, comprenez-le !',
  bienveillant:'Le chakra est votre allié le plus fidèle. Prenez le temps de le comprendre, il ne vous décevra jamais si vous le respectez.',
  mysterieux:'L\'eau qui coule ne se pose pas de questions sur sa destination. Le chakra non plus. Votre rôle n\'est pas de le forcer — mais de lui ouvrir le chemin.',
  stratege:'Deux composantes, un réseau, 361 points d\'interaction. Mémorisez l\'architecture avant de tenter de la manipuler.',
  veteran:'J\'ai vu un shinobi se vider de son chakra en plein combat parce qu\'il n\'avait jamais appris à le doser. Il est mort les yeux ouverts. Apprenez la théorie.',
  fraternel:'Le chakra, c\'est comme ton souffle — si tu le forces, tu t\'essouffles. Vas-y doucement, sens-le couler en toi. Je te guiderai étape par étape.',
  ironique:'Énergie physique plus énergie spirituelle. Simple, non ? Alors pourquoi est-ce que la moitié d\'entre vous n\'arrive même pas à faire coller une feuille sur son front ?',
  ermite:'Le chakra, c\'est rigolo — plus tu essaies de le contrôler, plus il te file entre les doigts. Détends-toi, bois un thé, et laisse-le venir à toi.',
  ombre:'Le chakra est un outil. Ni bon, ni mauvais. Sa nature dépend de l\'intention de l\'utilisateur. Comprenez son fonctionnement froidement, sans romantisme.',
  sensei_noble:'Le chakra est le souffle sacré hérité de nos ancêtres. Le gaspiller est une offense. Le maîtriser est un devoir envers ceux qui vous l\'ont transmis.',
  rebelle:'On m\'a enseigné le chakra avec des livres poussiéreux. J\'ai vraiment compris le jour où j\'ai failli exploser ma propre technique. Rien ne vaut l\'expérience.',
  mentor:'Le chakra naît de l\'union du corps et de l\'esprit. Si l\'un domine l\'autre, le déséquilibre apparaît. Méditez avant de malaxer.',
  chasseur:'Le chakra, c\'est ton énergie vitale. Comme un loup sent ses forces baisser après une longue chasse, tu dois apprendre à sentir tes réserves diminuer.',
  tacticien:'Celui qui connaît le système de chakra de son adversaire connaît ses limites. Et connaître les limites de l\'ennemi, c\'est déjà avoir la main.'
},
mudras_cours:{
  sage:'Travaillez vos mudras jusqu\'à ce qu\'ils deviennent un réflexe. Le jour où votre vie en dépendra, vous n\'aurez pas droit à l\'erreur.',
  dur:'Un mudra raté, c\'est un jutsu raté. Un jutsu raté en combat, c\'est la mort. Répétez. Encore. Jusqu\'à ce que vos doigts saignent s\'il le faut.',
  guerrier:'Vos mains sont les armes les plus puissantes que vous possédez ! Chaque mudra est un coup de tonnerre en attente ! Maîtrisez-les avec fierté !',
  bienveillant:'Ne vous découragez pas si vos doigts hésitent au début. La fluidité vient avec la pratique, et je serai là pour corriger chaque geste.',
  mysterieux:'Les mains parlent une langue que la bouche ne connaît pas. Quand vos doigts trouveront leur voix, votre chakra chantera.',
  stratege:'12 signes, des milliers de combinaisons possibles. La vitesse d\'exécution est un multiplicateur de puissance. Optimisez chaque transition.',
  veteran:'Sur le terrain, personne ne vous laisse le temps de réfléchir à quel mudra vient après. Vos doigts doivent se souvenir tout seuls, même quand ils tremblent de peur.',
  fraternel:'Hé, ne t\'inquiète pas si tu mélanges encore Tatsu et Mi. On est tous passés par là. Allez, on reprend ensemble, doucement.',
  ironique:'Douze mudras. Douze. Certains d\'entre vous en connaissent moins que de doigts. L\'ironie serait drôle si elle n\'était pas aussi triste.',
  ermite:'J\'ai appris mes mudras en rattrapant des grenouilles à mains nues. Pas orthodoxe, mais mes doigts n\'ont jamais été aussi agiles ! Trouvez votre propre méthode.',
  ombre:'La vitesse d\'enchaînement des mudras fait la différence entre neutraliser une cible et être neutralisé. Entraînez-vous dans le noir, sans repères visuels.',
  sensei_noble:'Chaque mudra porte le nom d\'un animal du zodiaque. Cette tradition a un sens. Honorez la forme autant que la fonction.',
  rebelle:'J\'ai voulu inventer mes propres mudras une fois. Résultat : trois doigts cassés et un jutsu qui m\'a explosé à la figure. Apprenez les bases d\'abord.',
  mentor:'Les mudras sont une méditation en mouvement. Chaque signe aligne le corps et l\'esprit. Ne précipitez pas — la fluidité naît du calme intérieur.',
  chasseur:'Tes doigts sont tes crocs. Plus ils sont rapides, plus ta proie est surprise. Entraîne-les comme un prédateur aiguise ses griffes.',
  tacticien:'Un adversaire qui montre ses mudras vous révèle son jutsu. Apprenez à lire les signes des autres autant qu\'à exécuter les vôtres.'
},
nature_theorie:{
  sage:'Connaître sa nature, c\'est se connaître soi-même. Et connaître celle de l\'adversaire, c\'est déjà un avantage.',
  dur:'La nature de chakra n\'est pas un jeu de devinette. C\'est votre identité de combattant. Si vous ne la maîtrisez pas, l\'ennemi l\'exploitera.',
  guerrier:'Votre nature de chakra est le rugissement de votre âme ! Feu, vent, foudre, terre ou eau — embrassez-la et faites-la gronder !',
  bienveillant:'Chaque nature est unique et belle à sa manière. Il n\'y en a pas de meilleure — juste celle qui vous correspond.',
  mysterieux:'La feuille brûle, se mouille, s\'effrite, se plie ou se coupe. La réponse n\'est pas dans la feuille — elle est dans celui qui la tient.',
  stratege:'Le cycle élémentaire est une matrice d\'avantages et de vulnérabilités. Celui qui le maîtrise transforme chaque affrontement en équation résolue.',
  veteran:'J\'ai affronté un utilisateur Suiton alors que je suis Katon. J\'ai survécu parce que je connaissais mon désavantage. Ceux qui l\'ignorent ne survivent pas.',
  fraternel:'Quelle que soit ta nature, elle est parfaite pour toi. Y\'a pas de mauvaise nature, juste des façons différentes de briller. On va trouver la tienne.',
  ironique:'Katon bat Futon, Futon bat Raiton... Vous voyez, c\'est un cycle. Comme vos erreurs en combat — elles se répètent aussi si vous ne les étudiez pas.',
  ermite:'J\'ai découvert ma nature de chakra par accident — j\'ai éternué si fort que j\'ai déraciné un arbre. Futon, apparemment. La vie est pleine de surprises !',
  ombre:'Connaître la nature de votre cible avant l\'engagement est une priorité absolue. Le cycle élémentaire n\'est pas de la théorie — c\'est du renseignement.',
  sensei_noble:'Les cinq natures sont les cinq piliers du monde shinobi. Chacune porte une dignité propre. Ne méprisez jamais celle d\'un adversaire.',
  rebelle:'On m\'a dit que le Doton était "ennuyeux". J\'ai répondu en faisant surgir un mur qui a arrêté trois techniques Suiton d\'affilée. Chaque nature a sa fierté.',
  mentor:'Votre nature de chakra reflète votre tempérament profond. L\'accepter, c\'est faire un pas vers l\'harmonie avec soi-même.',
  chasseur:'Dans la nature, chaque élément domine un autre. Le feu consume le vent, l\'eau éteint le feu. Apprenez le cycle comme un loup apprend la chaîne alimentaire.',
  tacticien:'Le cycle élémentaire est votre grille de lecture en combat. Identifiez la nature adverse, appliquez le contre — et regardez l\'ennemi comprendre trop tard.'
},
taijutsu_theorie:{
  sage:'Un combattant malin en Taijutsu bat un adversaire plus fort mais moins technique. Le corps est votre première arme, soignez-le.',
  dur:'Pas de mudras, pas d\'excuses. Le taijutsu, c\'est vous contre le monde avec rien d\'autre que vos poings. Soyez à la hauteur ou restez à terre.',
  guerrier:'Le taijutsu, c\'est le cri pur du guerrier ! Pas de chakra à gaspiller, pas de signes à préparer — juste vous, votre corps, et la victoire !',
  bienveillant:'Le taijutsu n\'exige pas d\'être le plus fort. Il demande de la persévérance et de la technique. Et ça, tout le monde peut l\'acquérir.',
  mysterieux:'Le poing qui frappe sans penser est un marteau. Le poing qui frappe en sachant pourquoi est une clé.',
  stratege:'Le taijutsu élimine la variable "temps de préparation". Zéro mudra = zéro fenêtre d\'interception. C\'est son avantage tactique principal.',
  veteran:'J\'ai vu des maîtres de ninjutsu tomber face à un combattant au taijutsu brut. Quand le chakra est épuisé, il ne reste que vos poings. Soyez prêts.',
  fraternel:'Le taijutsu, c\'est le combat le plus honnête qui soit. Juste toi et ton corps. Pas besoin d\'être un génie — juste d\'avoir du cœur et de la sueur.',
  ironique:'Alors comme ça, vous voulez apprendre le taijutsu ? Montrez-moi d\'abord vingt pompes. Non ? Ah. On va avoir un problème.',
  ermite:'Le meilleur taijutsu que j\'ai appris, c\'était en dansant dans un festival. Rythme, équilibre, timing — tout y est. Ne sous-estimez jamais la danse.',
  ombre:'Le taijutsu est silencieux. Pas de flash lumineux, pas de bruit. Un coup précis, et la cible tombe sans que personne n\'ait rien vu. Efficacité pure.',
  sensei_noble:'Le taijutsu est l\'art le plus ancien et le plus noble du combat shinobi. Il ne demande rien d\'autre que la perfection du geste.',
  rebelle:'Les "experts" disent que le taijutsu est inférieur au ninjutsu. Qu\'ils viennent me le dire en face — je leur répondrai avec mes poings.',
  mentor:'Le corps est le premier temple du guerrier. Avant de maîtriser le chakra, maîtrisez le souffle. Avant le souffle, la posture. Tout commence par la base.',
  chasseur:'Un animal ne lance pas de jutsu. Il frappe, il mord, il esquive. Le taijutsu, c\'est l\'instinct du prédateur traduit en technique de combat.',
  tacticien:'En taijutsu, chaque mouvement de l\'adversaire est une information. Sa garde révèle son école, son pied d\'appui révèle son prochain coup. Lisez-le.'
},
armes_cours:{
  sage:'Une arme ne vaut que par celui qui la manie. Connaissez vos outils, un kunai bien placé vaut cent techniques mal maîtrisées.',
  dur:'Une arme n\'est pas un jouet. Si vous ne savez pas la manier, elle vous blessera avant de blesser l\'ennemi. Respectez-la ou posez-la.',
  guerrier:'Chaque arme est le prolongement de votre volonté ! Un kunai dans la main d\'un guerrier vaut plus qu\'un katana dans celle d\'un lâche !',
  bienveillant:'Prenez le temps de trouver l\'arme avec laquelle vous êtes le plus à l\'aise. Il n\'y a pas de honte à préférer les senbon au katana.',
  mysterieux:'L\'arme la plus dangereuse du monde est celle que l\'adversaire n\'a pas vue venir. La taille ne compte pas — l\'intention, oui.',
  stratege:'8 armes, chacune avec un ratio portée/dégâts/discrétion différent. Adaptez votre loadout à la mission, pas à vos préférences.',
  veteran:'J\'ai tué avec un senbon une fois. Pas par choix — parce que c\'était tout ce qui me restait. Apprenez à utiliser chaque arme, même celle que vous méprisez.',
  fraternel:'Trouve l\'arme qui te parle. Celle que tu tiens naturellement, celle qui prolonge ton bras. Quand tu l\'auras trouvée, tu le sauras.',
  ironique:'Un kunai dans chaque main et un air confiant — voilà le kit de démarrage du genin moyen. Essayons de viser un peu plus haut, d\'accord ?',
  ermite:'Mon arme préférée ? Un bâton trouvé par terre. Sérieusement. L\'arme la plus dangereuse est celle que personne ne s\'attend à voir.',
  ombre:'Chaque arme a un profil sonore. Le kunai siffle, le shuriken chante, le senbon est muet. En opération nocturne, la discrétion prime sur la puissance.',
  sensei_noble:'Une arme est le prolongement de l\'âme du guerrier. La traiter avec négligence, c\'est se manquer de respect à soi-même.',
  rebelle:'On m\'a forcé à apprendre le katana pendant des mois. J\'ai fini par le jeter et prendre des kunai explosifs. Parfois, il faut briser le moule.',
  mentor:'L\'arme n\'est qu\'un outil. C\'est l\'intention derrière le geste qui donne au coup son sens. Méditez sur le pourquoi avant de perfectionner le comment.',
  chasseur:'Un bon chasseur connaît la portée exacte de chaque arme comme il connaît la distance de son bond. Kunai, shuriken, senbon — chacun a sa zone de frappe.',
  tacticien:'L\'arme visible est une déclaration. L\'arme cachée est une surprise. Portez toujours les deux, et ne montrez que celle que vous voulez qu\'on voie.'
},
infiltration:{
  sage:'L\'infiltration ne commence pas quand vous entrez en territoire ennemi. Elle commence quand vous décidez qui vous allez être.',
  dur:'En infiltration, une seule erreur suffit. Vous serez repéré, capturé, interrogé. Et là, personne ne viendra vous chercher. Soyez parfait.',
  guerrier:'L\'infiltration est un combat silencieux ! Chaque pas, chaque regard, chaque mot est un coup porté dans l\'ombre. Les guerriers les plus forts sont ceux qu\'on ne voit jamais venir !',
  bienveillant:'L\'infiltration peut faire peur au début. C\'est normal. Mais avec de la pratique, vous apprendrez à devenir quelqu\'un d\'autre — et à revenir vous-même.',
  mysterieux:'Le meilleur déguisement n\'est pas un masque. C\'est la vérité — celle que les gens veulent entendre.',
  stratege:'L\'infiltration repose sur trois piliers : couverture crédible, contrôle émotionnel, extraction de données. Manquez-en un, et la mission échoue.',
  veteran:'J\'ai passé six mois sous couverture dans un village ennemi. Six mois à mentir chaque jour. On ne vous prépare jamais assez à ce que ça coûte à l\'intérieur.',
  fraternel:'L\'infiltration, ça peut être flippant. Mais rappelle-toi : tu n\'es jamais vraiment seul. Ton équipe t\'attend de l\'autre côté. Concentre-toi et reviens en un morceau.',
  ironique:'Devenir quelqu\'un d\'autre ? Facile — vous le faites déjà quand vous mentez à votre sensei sur vos heures d\'entraînement. Autant officialiser le talent.',
  ermite:'L\'infiltration, c\'est un peu comme la drague — si tu forces trop, ça se voit. Sois naturel, détendu, et les portes s\'ouvrent toutes seules.',
  ombre:'L\'infiltration est mon domaine. Chaque détail compte : la démarche, le regard, la respiration. Un battement de cils de trop, et votre couverture tombe.',
  sensei_noble:'Se faire passer pour un autre est un acte qui exige une discipline absolue. L\'honneur n\'est pas dans le mensonge — il est dans la mission qui le justifie.',
  rebelle:'L\'infiltration m\'a appris un truc : les gens voient ce qu\'ils veulent voir. Donnez-leur ce qu\'ils attendent, et ils ne chercheront jamais plus loin.',
  mentor:'Avant de devenir un autre, connaissez-vous vous-même parfaitement. Celui qui ne sait pas qui il est se perd dans ses propres masques.',
  chasseur:'L\'infiltration, c\'est la chasse à l\'affût. Tu ne bouges pas, tu ne fais pas de bruit, tu te fonds dans le décor. Et quand l\'information passe — tu la saisis.',
  tacticien:'Une bonne couverture est un piège dans lequel la cible entre volontairement. Construisez-la avec soin, et c\'est l\'ennemi qui viendra vous donner ses secrets.'
},
bourrasque:{
  sage:'Ne cherchez pas à frapper fort. Cherchez à tourner vite. La puissance vient de la rotation, pas du muscle.',
  dur:'Si votre rotation est molle, votre coup sera pathétique. Le 360° ne pardonne pas la demi-mesure. À fond ou rien.',
  guerrier:'La Bourrasque est un ouragan de puissance ! Sentez le sol sous vos pieds, pivotez avec toute votre âme, et fracassez tout sur votre passage !',
  bienveillant:'La rotation vient avec le temps. Ne forcez pas au début — écoutez votre corps, trouvez votre centre, et le reste suivra naturellement.',
  mysterieux:'Le vent ne frappe pas — il tourne. Et dans sa rotation, il emporte tout. Soyez le vent.',
  stratege:'360° de rotation = transfert d\'énergie cinétique maximal dans un plan horizontal. Optimisez l\'angle de hanche pour maximiser le rendement.',
  veteran:'J\'ai brisé trois côtes d\'un jōnin avec cette technique. Pas parce que j\'étais plus fort — parce que ma rotation était parfaite. La technique bat la force.',
  fraternel:'Les premiers essais, tu vas trébucher, et c\'est pas grave. On rigolera ensemble, et après on recommencera jusqu\'à ce que tu tournes comme une toupie.',
  ironique:'Un conseil : ne tentez pas la Bourrasque sur un sol mouillé. Sauf si vous voulez offrir un spectacle comique à vos coéquipiers.',
  ermite:'La Bourrasque ? Moi je l\'ai inventée en glissant sur une peau de banane. Bon, pas vraiment — mais le principe est le même : laissez le mouvement vous emporter !',
  ombre:'La Bourrasque est bruyante et visible. Utile en combat ouvert, mais à éviter en opération discrète. Connaissez ses limites autant que sa puissance.',
  sensei_noble:'La Bourrasque de Konoha est l\'héritage de générations de combattants. Chaque rotation porte la mémoire de ceux qui l\'ont perfectionnée avant vous.',
  rebelle:'On m\'a dit que la Bourrasque était "trop basique". J\'ai répondu en envoyant le gars à travers un mur. Basique mais efficace, ça me va.',
  mentor:'La rotation naît du centre. Trouvez votre axe intérieur, ancrez-vous dans votre respiration, et le corps suivra naturellement le mouvement.',
  chasseur:'La Bourrasque, c\'est le mouvement du loup qui pivote pour mordre ce qui est derrière lui. Rapide, instinctif, dévastateur.',
  tacticien:'La Bourrasque couvre un angle de 360° — aucun angle mort. C\'est sa force défensive. Utilisez-la quand vous êtes encerclé, pas quand vous avez l\'initiative.'
},
pied_aube:{
  sage:'Vous ne frappez pas en montant. Vous frappez en tombant. La gravité fait le travail, vous, vous visez.',
  dur:'Un saut mal calibré, c\'est un atterrissage en tant que cible. Maîtrisez la hauteur ou restez au sol avec les vers de terre.',
  guerrier:'Montez vers le ciel comme un aigle, et retombez comme la foudre ! Le Pied de l\'Aube est la technique de ceux qui refusent de rester à terre !',
  bienveillant:'Chacun a son rythme pour apprivoiser les airs. Les premiers sauts seront hésitants, et c\'est parfait. Je vous rattraperai s\'il le faut.',
  mysterieux:'L\'aube commence dans l\'obscurité. Le pied qui frappe commence par la chute. Ce qui semble descendre est ce qui s\'élève.',
  stratege:'Le saut crée un vecteur d\'attaque vertical que la plupart des combattants n\'anticipent pas. Avantage de surprise : élevé. Risque en cas de raté : critique.',
  veteran:'J\'ai vu un genin rater son atterrissage et se briser la cheville en plein combat. La gravité ne pardonne pas. Maîtrisez la descente autant que la montée.',
  fraternel:'T\'en fais pas si tu rates les premiers sauts. Je te rattraperai, promis. L\'important c\'est d\'oser monter — le reste viendra.',
  ironique:'Le Pied de l\'Aube : cette technique où vous sautez très haut pour frapper très fort... ou pour atterrir très bêtement si vous ratez. Pas de milieu.',
  ermite:'J\'ai un jour frappé un ours en plein saut. Ne me demandez pas pourquoi. Mais j\'ai appris que la gravité est votre meilleure alliée quand on sait l\'utiliser.',
  ombre:'L\'attaque aérienne expose votre silhouette. En plein jour, c\'est un risque. De nuit, combinée à un angle mort, c\'est une exécution parfaite.',
  sensei_noble:'Le Pied de l\'Aube est un geste d\'une grâce martiale rare. Chaque phase — l\'ascension, l\'apex, la descente — doit être exécutée avec une élégance absolue.',
  rebelle:'Tout le monde dit que le combat aérien c\'est risqué. Bien sûr que c\'est risqué. C\'est justement pour ça que personne ne s\'y attend.',
  mentor:'Le saut est un acte de foi. Vous quittez la terre ferme, vous abandonnez la sécurité. C\'est dans ce lâcher-prise que la technique prend son sens.',
  chasseur:'L\'aigle ne réfléchit pas en plongeant sur sa proie. Il sent le moment, il frappe. Le Pied de l\'Aube, c\'est cet instinct traduit en technique.',
  tacticien:'Le Pied de l\'Aube est une technique à haut risque, haut rendement. Ne l\'utilisez que lorsque l\'ennemi est engagé ailleurs. Jamais en ouverture.'
},
saut_chakra:{
  sage:'Mobilité = survie. Un ninja qui ne sait pas bouger est un ninja qui ne rentre pas de mission.',
  dur:'Si vous ne maîtrisez pas le saut de chakra, vous êtes une cible immobile. Et les cibles immobiles ne reviennent pas de mission.',
  guerrier:'Le saut de chakra, c\'est la liberté absolue ! Le ciel n\'est pas une limite — c\'est votre terrain de chasse ! Propulsez-vous !',
  bienveillant:'Le plus dur est de trouver le bon dosage. Trop ou pas assez, ça rate. Mais chaque tentative vous rapproche du bon équilibre.',
  mysterieux:'L\'oiseau ne pense pas à voler. Il vole. Le jour où vous cesserez de penser au chakra dans vos pieds, vous volerez aussi.',
  stratege:'Concentration dans la plante des pieds + libération contrôlée = propulsion. La variable critique est le roll de malaxage. En dessous de 50, recalibrez.',
  veteran:'En mission, le saut de chakra m\'a sauvé la vie plus de fois que n\'importe quel jutsu offensif. On ne peut pas frapper ce qu\'on ne peut pas atteindre.',
  fraternel:'Le dosage viendra avec le temps, fais-moi confiance. Commence petit, un bond à la fois. Bientôt tu sauteras de toit en toit sans même y penser.',
  ironique:'Trop de chakra : vous traversez le plafond. Pas assez : vous sautillez comme un lapin fatigué. Le dosage, c\'est tout un art, n\'est-ce pas ?',
  ermite:'Moi, j\'ai appris le saut de chakra en fuyant un sanglier géant. Rien de tel qu\'une motivation concrète pour perfectionner sa propulsion !',
  ombre:'Le saut de chakra est la base de tout déplacement tactique. Sans lui, vous êtes confiné au sol comme un civil. Inacceptable pour un agent.',
  sensei_noble:'Maîtriser le saut de chakra, c\'est s\'élever — au sens propre comme au figuré. Un shinobi qui domine la verticalité domine le terrain.',
  rebelle:'Les profs vous diront de doser votre chakra avec précision. Moi je dis : poussez à fond et apprenez à gérer les conséquences. C\'est comme ça qu\'on progresse.',
  mentor:'Le chakra dans vos pieds est une extension de votre volonté. Ne pensez pas "sauter" — pensez "s\'élever". L\'intention guide l\'énergie.',
  chasseur:'Un prédateur qui ne sait pas bondir est un prédateur mort. Le saut de chakra est votre bond. Sans lui, vous restez cloué au sol pendant que la proie s\'enfuit.',
  tacticien:'La mobilité verticale crée des options que l\'adversaire au sol n\'a pas. Chaque surface devient un point d\'appui potentiel. Exploitez la dimension oubliée.'
},
nature_combat:{
  sage:'Observer, réfléchir, puis agir. Un combat gagné sans réflexion est un coup de chance.',
  dur:'Si vous foncez tête baissée sans analyser la nature de l\'adversaire, vous méritez la raclée qui suivra. Réfléchissez, bon sang.',
  guerrier:'Connaître la nature de son ennemi, c\'est déjà à moitié gagner ! L\'analyse n\'est pas la lenteur — c\'est l\'instinct du vrai combattant !',
  bienveillant:'L\'analyse prend du temps au début, et c\'est normal. Avec l\'expérience, vous lirez votre adversaire en un coup d\'œil.',
  mysterieux:'L\'eau qui observe la pierre sait exactement par où passer. Observez avant d\'agir — la réponse vient d\'elle-même.',
  stratege:'Analyse = données. Nature de l\'ennemi + cycle élémentaire = vecteur d\'attaque optimal. Combat sans analyse = variable aléatoire. Inacceptable.',
  veteran:'J\'ai survécu à des adversaires bien plus forts que moi, simplement parce que j\'avais pris trois secondes pour observer avant de foncer. Ces trois secondes valent une vie.',
  fraternel:'Pas besoin d\'être un génie pour analyser. Regarde comment il bouge, ce qu\'il prépare, et adapte-toi. Je t\'apprendrai à lire un combat comme on lit un ami.',
  ironique:'Foncer sans analyser la nature de l\'ennemi ? Brillant. Autant jouer à pierre-feuille-ciseaux les yeux fermés. Au moins, là, c\'est assumé.',
  ermite:'Un jour, j\'ai analysé mon adversaire pendant si longtemps qu\'il s\'est endormi. Bon, c\'est exagéré — mais prenez le temps de regarder avant d\'agir, hein ?',
  ombre:'L\'analyse est la première phase de tout engagement. Nature identifiée, style de combat catalogué, faiblesses repérées. Ensuite seulement, on frappe.',
  sensei_noble:'Le guerrier cultivé observe avant de dégainer. La précipitation est l\'apanage des brutes. L\'analyse est la marque d\'un combattant noble.',
  rebelle:'On m\'a reproché de trop improviser. Mais même l\'improvisation se nourrit d\'observation. J\'analyse vite, c\'est tout — et ça a l\'air spontané.',
  mentor:'Observer l\'adversaire, c\'est comme méditer : il faut faire taire son propre bruit intérieur pour entendre ce que l\'autre révèle.',
  chasseur:'Avant de bondir, le prédateur observe sa proie pendant des heures. Son pas, son rythme, ses habitudes. L\'analyse, c\'est la patience du chasseur.',
  tacticien:'Chaque adversaire a un schéma. Deux ou trois échanges suffisent pour le décrypter. Après, vous n\'avez plus qu\'à exploiter la faille.'
},
raiton_cours:{
  sage:'La foudre est précise par nature. Si votre technique part dans tous les sens, c\'est que vous n\'êtes pas prêt.',
  dur:'Le Raiton ne tolère pas la médiocrité. Une décharge mal contrôlée, et c\'est vous qui grillez. Soyez précis ou laissez tomber.',
  guerrier:'La foudre est la colère du ciel canalisée dans vos mains ! Faites-la rugir avec la fureur d\'un guerrier et la précision d\'un chasseur !',
  bienveillant:'Le Raiton peut impressionner, mais ne vous laissez pas intimider par votre propre chakra. Apprivoisez-le pas à pas, mudra après mudra.',
  mysterieux:'La foudre ne prévient pas. Elle frappe, et quand le son arrive, il est déjà trop tard. Soyez le silence qui précède le tonnerre.',
  stratege:'Le Raiton excelle en précision et paralysie. Quatre techniques complémentaires : rayon directionnel, projectile, contrôle de zone linéaire et radial. Appliquer selon la situation.',
  veteran:'La foudre m\'a traversé le bras lors d\'un raté en mission. Depuis, mes doigts tremblent quand il pleut. Le Raiton ne pardonne aucune approximation.',
  fraternel:'Le Raiton, ça picote au début, et c\'est normal. On va y aller progressivement. Si tu sens que ça chauffe trop, tu me le dis tout de suite, d\'accord ?',
  ironique:'Le Raiton, c\'est simple : soit vous le contrôlez, soit il vous grille les terminaisons nerveuses. Pas de juste milieu. Charmant, n\'est-ce pas ?',
  ermite:'J\'ai découvert le Raiton en me prenant la foudre pendant un orage. Littéralement. Depuis, on s\'entend bien, le tonnerre et moi. Question d\'affinité.',
  ombre:'Le Raiton est l\'élément de l\'assassin. Rapide, silencieux si bien dosé, et capable de paralyser avant que la cible ne crie. Mon élément de prédilection.',
  sensei_noble:'La foudre est la plus noble des forces naturelles. La canaliser exige rigueur et respect. Un shinobi Raiton indigne de cette puissance ne mérite pas de la manier.',
  rebelle:'Le Raiton, c\'est brut, c\'est direct, ça fait mal. Pas de fioritures, pas de détours. Mon genre de technique.',
  mentor:'La foudre est la manifestation la plus vive du chakra. Pour la maîtriser, votre esprit doit être aussi clair et direct qu\'un éclair.',
  chasseur:'La foudre frappe comme un serpent — rapide, précise, sans avertissement. Canalisez cet instinct de prédateur dans chaque décharge.',
  tacticien:'Le Raiton offre quatre vecteurs d\'application distincts. La vraie maîtrise n\'est pas d\'en connaître un parfaitement, mais de choisir le bon au bon moment.'
},
permutation:{
  sage:'La permutation n\'est pas une fuite. C\'est un repositionnement intelligent. Celui qui esquive bien frappe mieux.',
  dur:'Si vous utilisez la permutation pour fuir, vous n\'avez rien compris. C\'est un outil de combat, pas une porte de sortie pour les lâches.',
  guerrier:'Disparaître pour mieux réapparaître et frapper dans le dos ! La permutation est l\'arme du combattant rusé, pas du couard !',
  bienveillant:'C\'est une technique qui sauve des vies. Apprenez-la bien, et elle deviendra votre meilleur filet de sécurité.',
  mysterieux:'Le vrai ninja n\'est jamais là où on croit. Il est déjà derrière. La permutation n\'est qu\'une illusion de plus.',
  stratege:'Substitution = neutralisation de l\'offensive adverse + repositionnement avantageux. Timing critique : trop tôt, l\'adversaire corrige. Trop tard, impact subi.',
  veteran:'La permutation m\'a sauvé d\'un kunai en plein cœur. Une demi-seconde de retard, et vous ne seriez pas en train de m\'écouter. Le timing, c\'est la vie.',
  fraternel:'C\'est une technique rassurante, tu verras. Quand tu la maîtrises, tu sais que tu as toujours une porte de sortie. Ça donne confiance.',
  ironique:'La permutation : l\'art noble de laisser une bûche encaisser le coup à votre place. Élégant ? Non. Efficace ? Absolument.',
  ermite:'J\'ai une fois permuté avec une grenouille par accident. La tête du gars en face valait tous les jutsu du monde. Bref — contrôlez votre cible de substitution.',
  ombre:'La permutation est le fondement de tout engagement tactique. Disparaître du champ visuel de l\'ennemi en une fraction de seconde change l\'équation du combat.',
  sensei_noble:'La permutation n\'est pas une fuite — c\'est un repositionnement stratégique digne d\'un combattant réfléchi. Aucun déshonneur à esquiver intelligemment.',
  rebelle:'Ceux qui disent que la permutation c\'est pour les lâches n\'ont jamais vu quelqu\'un réapparaître dans leur dos avec un kunai. Fuyez malin, frappez fort.',
  mentor:'La permutation enseigne le détachement. Lâcher sa position, accepter le changement, se recentrer instantanément. C\'est une leçon de vie autant qu\'une technique.',
  chasseur:'La permutation, c\'est l\'instinct de survie du renard — disparaître au moment exact où les mâchoires se referment, et reparaître là où on ne l\'attend pas.',
  tacticien:'La permutation ne sert pas qu\'à esquiver. Utilisée offensivement, elle désorganise la lecture du combat adverse. Permutez, et l\'ennemi perd son plan.'
},
simulation_escorte:{
  sage:'En escorte, votre vie passe en second. La cible rentre en un morceau, c\'est la seule chose qui compte.',
  dur:'Si votre cible meurt, vous avez échoué. Pas d\'excuses, pas de "j\'ai essayé". Le résultat est binaire. Protégez-la ou assumez.',
  guerrier:'Protéger quelqu\'un, c\'est le plus noble des combats ! Placez-vous entre la cible et le danger, et montrez de quoi vous êtes fait !',
  bienveillant:'Protéger, c\'est la mission la plus humaine. Vous portez la vie de quelqu\'un sur vos épaules — et cette responsabilité fait de vous un meilleur ninja.',
  mysterieux:'Le bouclier le plus efficace n\'est pas celui qui absorbe les coups. C\'est celui que l\'ennemi ne sait pas contourner.',
  stratege:'Formation en losange autour de la cible. Éclaireur devant, flancs couverts, arrière-garde en alerte. Répartition des rôles = division du risque.',
  veteran:'J\'ai perdu un client en escorte. Une seule fois. Son visage me hante encore. Depuis, je ne laisse plus rien au hasard. Vous non plus, vous ne devriez pas.',
  fraternel:'En escorte, ta cible c\'est comme ton petit frère. Tu le protèges, tu le rassures, et tu te mets entre lui et le danger sans réfléchir. Point.',
  ironique:'Votre cible va paniquer, courir dans la mauvaise direction, et probablement vous gêner. Bienvenue en escorte. Le vrai ennemi, c\'est parfois le client.',
  ermite:'J\'ai un jour escorté un marchand qui s\'est arrêté toutes les cinq minutes pour cueillir des herbes. J\'ai appris la patience ce jour-là. Et la botanique.',
  ombre:'En escorte, l\'objectif est binaire : la cible arrive vivante, ou la mission est un échec. Aucune nuance. Aucune excuse.',
  sensei_noble:'Protéger un être sans défense est le plus noble des devoirs du shinobi. Votre honneur se mesure à la vie de ceux que vous escortez.',
  rebelle:'L\'escorte, c\'est frustrant. Tu ne choisis pas le rythme, tu ne choisis pas le chemin. Mais c\'est justement là que tu apprends la discipline — la vraie.',
  mentor:'Protéger autrui exige de mettre son ego de côté. Votre vie passe en second. Cette acceptation est une forme de sagesse martiale profonde.',
  chasseur:'En escorte, tu deviens le loup gardien du troupeau. Tes sens en alerte, tes yeux qui balayent chaque buisson. Chaque bruit est une menace potentielle.',
  tacticien:'L\'escorte est un exercice de gestion de risque pur. Anticipez les points d\'embuscade, préparez les itinéraires de repli, et gardez toujours un plan B actif.'
},
simulation_mission:{
  sage:'La vraie mission n\'est jamais ce qu\'on vous dit. C\'est ce que vous décidez de faire quand les ordres ne suffisent plus.',
  dur:'En mission, les dilemmes ne se résolvent pas avec des larmes. Prenez une décision, assumez-la, et avancez. Le doute tue plus sûrement qu\'un kunai.',
  guerrier:'Le vrai guerrier choisit avec ses tripes ! Mission ou village, il n\'y a pas de bonne réponse — il y a VOTRE réponse ! Assumez-la avec fierté !',
  bienveillant:'Les dilemmes moraux n\'ont pas de réponse facile. C\'est justement pour ça qu\'on s\'entraîne — pour que le jour venu, votre cœur sache quoi faire.',
  mysterieux:'L\'ordre et la conscience tirent dans deux directions. Le ninja qui résout ce paradoxe ne choisit pas — il transcende.',
  stratege:'Mission vs valeurs : un arbre de décision avec des branches infinies. Priorisez les conséquences à long terme, pas le confort immédiat.',
  veteran:'J\'ai déjà reçu un ordre que je savais injuste. Je l\'ai exécuté. Et je vis avec ça. Les dilemmes de mission ne se résolvent pas proprement — jamais.',
  fraternel:'Y\'a pas de bonne réponse dans ces situations. L\'important, c\'est que tu puisses te regarder dans le miroir après. Je serai là pour en parler, quoi que tu choisisses.',
  ironique:'Un dilemme moral en mission ? Charmant. La théorie dit de suivre les ordres. La pratique dit que parfois les ordres sont idiots. Bonne chance.',
  ermite:'La vie est trop courte pour les regrets. Fais ce qui te semble juste sur le moment, assume, et avance. Le reste, c\'est de la philosophie de comptoir.',
  ombre:'La mission prime. Toujours. Les états d\'âme se traitent après le debriefing. Sur le terrain, l\'hésitation tue plus sûrement qu\'un mauvais choix.',
  sensei_noble:'Face au dilemme, le shinobi noble choisit ce qui préserve l\'honneur — le sien et celui du village. Même si le prix est élevé.',
  rebelle:'Les ordres sont parfois pourris. Et parfois, désobéir est la seule chose décente à faire. J\'assume chaque insubordination de ma carrière.',
  mentor:'Le dilemme n\'est pas un obstacle — c\'est un miroir. Il révèle qui vous êtes vraiment. Accueillez-le avec lucidité, pas avec peur.',
  chasseur:'En mission, l\'instinct parle plus vite que la morale. Écoutez vos tripes — elles ont souvent raison avant votre tête.',
  tacticien:'Le dilemme moral est un piège classique de l\'ennemi. Créer une situation où chaque choix vous coûte quelque chose. La solution : chercher le troisième choix, celui qu\'on ne voit pas.'
},
capture_drapeau:{
  sage:'La diplomatie n\'est pas une perte de temps. C\'est la première arme du shinobi intelligent.',
  dur:'Si vous perdez votre drapeau, ne venez pas pleurer. Défendez mieux ou attaquez plus fort. Le terrain ne se gagne pas avec des mots vides.',
  guerrier:'Sept minutes de négociation, cinq minutes de feu ! Chaque seconde compte — battez-vous avec la rage de ceux qui ont quelque chose à protéger !',
  bienveillant:'La diplomatie est une force, pas une faiblesse. Ceux qui savent convaincre sans combattre sont souvent les plus forts.',
  mysterieux:'Le drapeau n\'est qu\'un bout de tissu. Ce qui a de la valeur, c\'est ce qu\'il vous a coûté pour le garder.',
  stratege:'Phase diplomatique : collecte de renseignements et désinformation. Phase combat : exécution du plan issu des 7 minutes. Ne séparez jamais les deux.',
  veteran:'J\'ai vu des batailles gagnées par un mot bien placé et des batailles perdues malgré une force écrasante. La diplomatie n\'est pas une option — c\'est une arme.',
  fraternel:'La capture de drapeau, c\'est un jeu d\'équipe. Si tu ne fais pas confiance à tes coéquipiers, aucune stratégie ne marchera. Parlez-vous, couvrez-vous.',
  ironique:'Sept minutes pour négocier. Vous allez probablement les gaspiller en menaces vides et en bravades. Prouvez-moi le contraire, je vous en prie.',
  ermite:'La diplomatie ? Facile ! Souriez, dites des trucs sympas, et pendant que l\'autre réfléchit, envoyez quelqu\'un piquer son drapeau. Classique.',
  ombre:'La phase diplomatique est une fenêtre d\'infiltration. Pendant que vos diplomates occupent l\'adversaire, vos agents se positionnent. Simple et redoutable.',
  sensei_noble:'La diplomatie est l\'art des nobles et des sages. Un shinobi qui sait négocier honore la tradition des fondateurs qui ont bâti la paix par le dialogue.',
  rebelle:'La diplomatie, c\'est bien. Mais quand l\'autre refuse de jouer le jeu, il faut être prêt à retourner la table. Soyez prêts pour les deux.',
  mentor:'Convaincre sans contraindre est la plus haute forme de force. Celui qui gagne sans combattre a déjà transcendé le conflit.',
  chasseur:'La négociation, c\'est de la traque verbale. Tu suis les mots de l\'adversaire, tu repères ses failles, et tu bondis au bon moment.',
  tacticien:'Les sept minutes de négociation sont sept minutes de renseignement gratuit. Chaque mot de l\'adversaire trahit sa stratégie. Écoutez plus que vous ne parlez.'
},
jeu_roi:{
  sage:'Protéger quelqu\'un, c\'est plus dur que se battre pour soi. C\'est là que se révèle un vrai shinobi.',
  dur:'Le Roi tombe, tout le monde échoue. Point final. Si vous ne pouvez pas protéger une cible immobile, comment comptez-vous protéger un village ?',
  guerrier:'Le Roi est votre honneur ! Si un seul coup le touche, c\'est votre fierté qui saigne ! Protégez-le comme vous protégeriez vos rêves !',
  bienveillant:'C\'est un exercice difficile, mais il vous apprend l\'essentiel : la valeur de la responsabilité envers les autres. Faites de votre mieux.',
  mysterieux:'Le roi est immobile. Le gardien est partout. Qui est le plus puissant — celui qu\'on protège, ou celui qui choisit de protéger ?',
  stratege:'Protection de cible = couverture 360°, priorisation des menaces, gestion des angles morts. Celui qui ne calcule pas les lignes de tir perd la partie.',
  veteran:'J\'ai protégé un commandant pendant une embuscade de douze heures. Quand c\'est fini, vous ne sentez plus vos jambes, mais le Roi est debout. C\'est tout ce qui compte.',
  fraternel:'Protéger le Roi, c\'est comme protéger ton meilleur ami. Tu te mets devant lui sans réfléchir, parce que c\'est ce qu\'on fait pour ceux qui comptent.',
  ironique:'Votre Roi est immobile, incapable de se défendre, et vous êtes sa seule protection. Aucune pression, hein ? Amusez-vous bien.',
  ermite:'Protéger quelqu\'un sans bouger, c\'est dur. Protéger quelqu\'un en bougant constamment, c\'est de l\'art. Soyez des artistes, pas des statues.',
  ombre:'Le Jeu du Roi est un exercice de périmètre. Chaque angle mort est une faille létale. Éliminez-les méthodiquement, sans émotion.',
  sensei_noble:'La protection du souverain est le devoir le plus sacré du samouraï. Considérez chaque Roi comme votre Hokage, et défendez-le avec cette ferveur.',
  rebelle:'Protéger une cible immobile, c\'est contre-intuitif pour moi. Mais j\'ai appris que rester en place demande plus de discipline que foncer. Et ça, ça forge.',
  mentor:'Protéger l\'autre, c\'est oublier soi-même. Cet exercice vous enseigne l\'abnégation — la qualité la plus rare et la plus précieuse du shinobi.',
  chasseur:'Dans la meute, le plus fort protège les petits. Le Jeu du Roi active cet instinct. Sens la menace arriver avant qu\'elle ne frappe.',
  tacticien:'Le Roi est un appât contrôlé. Vous savez où l\'ennemi va frapper — il suffit de transformer cette certitude en piège.'
},
infiltration_pratique:{

const NATURE_PARTICLES={

function applySkin(){
  const s=getSensei();
  const root=document.documentElement;
  if(s.nature) root.setAttribute('data-skin',s.nature);
  else root.removeAttribute('data-skin');
  spawnParticles(s.nature);
  if(S.noAnim)document.documentElement.setAttribute('data-no-anim','');
}
function spawnParticles(nature){
  const container=document.getElementById('nature-particles');
  if(!container)return;
  container.innerHTML='';
  if(!nature||!NATURE_PARTICLES[nature])return;
  const chars=NATURE_PARTICLES[nature];
  const count=nature==='raiton'?14:20;
  for(let i=0;i<count;i++){
    const p=document.createElement('span');
    p.className='np';
    p.textContent=chars[i%chars.length];
    p.style.left=Math.random()*100+'%';
    p.style.top=(nature==='katon'?80+Math.random()*20:Math.random()*100)+'%';
    const dur=6+Math.random()*10;
    p.style.animationDuration=dur+'s';
    p.style.animationDelay=Math.random()*dur+'s';
    p.style.fontSize=(0.7+Math.random()*1.2)+'rem';
    container.appendChild(p);
  }
}
function toggleTheme(){
  const root=document.documentElement;
  const isDark=root.getAttribute('data-theme')==='dark';
  if(isDark){root.removeAttribute('data-theme');S.darkMode=false;}
  else{root.setAttribute('data-theme','dark');S.darkMode=true;}
  save();
  updateThemeBtn();
}
function updateThemeBtn(){
  const btn=document.getElementById('themeToggle');
  if(btn) btn.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙';
}
function applyThemeOnLoad(){
  if(S.darkMode) document.documentElement.setAttribute('data-theme','dark');
  applySkin();
  updateThemeBtn();
}
function toggleAnimations(){
  const root=document.documentElement;
  if(S.noAnim){delete S.noAnim;root.removeAttribute('data-no-anim');applySkin();}
  else{S.noAnim=true;root.setAttribute('data-no-anim','');document.getElementById('nature-particles').innerHTML='';}
  save();
}

function getQuote(coursId){
  const s=getSensei();
  // If sensei has a custom signature, use it instead
  if(s.signature&&s.signature.trim()) return s.signature.trim();
  const type=s.type||'sage';
  let q=null;
  if(SENSEI_QUOTES[coursId]&&SENSEI_QUOTES[coursId][type]) q=SENSEI_QUOTES[coursId][type];
  else if(SENSEI_QUOTES[coursId]) q=SENSEI_QUOTES[coursId].sage;
  if(!q)return null;
  // Append nature flavor if nature is set
  if(s.nature&&NATURE_CLOSING[s.nature]){
    const c=cours(coursId);
    if(c&&NATURE_CLOSING[s.nature][c.mod]){
      q=q+' '+NATURE_CLOSING[s.nature][c.mod];
    }
  }
  return q;
}

function applySenseiName(html,coursId){
  const name=senseiFullName();
  const s=getSensei();
  const type=s.type||'sage';
  const typeInfo=senseiTypeInfo();
  const natInfo=s.nature?D.natures.find(n=>n.id===s.nature):null;
  let out=html;
  // Replace name (escape HTML to prevent injection from localStorage)
  if(name!=='Eraku Morikawa') out=out.replace(/Eraku Morikawa/g,esc(name));
  // Replace quote text if personality is not sage and we have a courseId
  if(coursId&&type!=='sage'&&SENSEI_QUOTES[coursId]){
    const origQuote=SENSEI_QUOTES[coursId].sage;
    const newQuote=SENSEI_QUOTES[coursId][type]||origQuote;
    if(origQuote!==newQuote) out=out.replace(new RegExp(origQuote.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),newQuote);
  }
  // Append nature closing line to the quote in the rendered content
  if(coursId&&s.nature&&NATURE_CLOSING[s.nature]){
    const c=cours(coursId);
    if(c&&NATURE_CLOSING[s.nature][c.mod]){
      const natLine=NATURE_CLOSING[s.nature][c.mod];
      // Inject into HTML version (before the "— Name" in parchment blocks)
      out=out.replace(/(— (?:<strong>)?(?:Eraku Morikawa|[^<]+?)(?:<\/strong>)?<\/p>)/,natLine+' $1');
      // Inject into plain text copy versions (before the last "Name" on its own line)
    }
  }
  // Replace 🍃 icon with nature icon if nature set, otherwise personality icon
  const replaceIcon=natInfo?natInfo.icon:(type!=='sage'?typeInfo.icon:null);
  if(replaceIcon) out=out.replace(/🍃/g,replaceIcon);
  return out;
}

function mudra(id){return D.mudras.find(m=>m.id===id)}
function cours(id){return D.cours.find(c=>c.id===id)}
function findTech(id){for(const c of D.cours)for(const t of c.techs)if(t.id===id)return{t,c};return null}

function items(tech){
  const r=[];
  if(tech.mudras?.length)tech.mudras.forEach((m,i)=>{const md=mudra(m);r.push({k:tech.id+'::m::'+m,l:md?md.nom:m,s:md?md.fonction:'',i:i+1,type:'mudra'})});
  if(tech.etapes?.length)tech.etapes.forEach((e,i)=>r.push({k:tech.id+'::e::'+i,l:e,s:'',i:i+1,type:'etape'}));
  return r;
}
function techProg(tech){const it=items(tech);if(!it.length)return{d:0,t:0,p:100};const d=it.filter(x=>chk(x.k)).length;return{d,t:it.length,p:Math.round(d/it.length*100)}}
function techState(tech){const p=techProg(tech);if(p.t===0)return'maitrisee';if(p.p===100)return'maitrisee';if(p.d>0)return'en-cours';return'non-vue'}
function coursProg(c){
  if(INTERACTIF[c.id]){const blocs=INTERACTIF[c.id],ist=getIState(c.id),t=blocs.length,d=ist.done.length;return{d,t,p:t?Math.round(d/t*100):0}}
  let d=0,t=0;c.techs.forEach(tc=>{const p=techProg(tc);d+=p.d;t+=p.t});return{d,t,p:t?Math.round(d/t*100):0}}
function coursState(c){
  if(INTERACTIF[c.id]){const blocs=INTERACTIF[c.id],ist=getIState(c.id);if(ist.done.length>=blocs.length)return'maitrisee';if(ist.done.length>0)return'en-cours';return'non-vue'}
  const st=c.techs.map(techState);if(st.every(s=>s==='maitrisee'))return'maitrisee';if(st.some(s=>s!=='non-vue'))return'en-cours';return'non-vue'}
function prereqOk(tid){const f=findTech(tid);return!f||techState(f.t)==='maitrisee'}

function stBadge(s){const l={'non-vue':'Non vue','en-cours':'En cours','maitrisee':'Maîtrisée'};return`<span class="state-badge state-${s}">${l[s]}</span>`}
function tIcon(t){return{connaissance:'📖',mudras:'🤞',taijutsu:'🥋',chakra:'🔥',tactique:'🎯',ninjutsu:'⚡'}[t]||'📌'}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

const VIEWS=[
  {id:'dashboard',icon:'📊',label:'Tableau de bord'},
  {id:'cours',icon:'📚',label:'Cours'},
  {id:'mudras',icon:'🤞',label:'Mudras'},
  {id:'natures',icon:'🔥',label:'Natures'},
  {id:'armes',icon:'🗡️',label:'Armes'},
  {id:'hierarchie',icon:'👑',label:'Hiérarchie'},
  {id:'admin',icon:'📋',label:'Règlement'},
  {id:'annonces',icon:'📢',label:'Annonces'},
  {id:'bilan',icon:'📊',label:'Fin de mois'},
  {id:'historique',icon:'📜',label:'Historique'},
  {id:'sensei',icon:'👤',label:'Sensei'},
];

let curView='dashboard', curCours=null;

function buildSidebar(){
  const sb=document.getElementById('sidebar');
  const mn=document.getElementById('mobileNav');
  let shtml=`<div class="sidebar-section"><div class="sidebar-label">Navigation</div>`;
  let mhtml='';
  VIEWS.forEach(v=>{
    const a=curView===v.id&&!curCours?'active':'';
    shtml+=`<div class="sidebar-item ${a}" onclick="nav('${v.id}')"><span class="si-icon">${v.icon}</span>${v.label}</div>`;
    mhtml+=`<div class="mobile-nav-item ${a}" onclick="nav('${v.id}')">${v.icon} ${v.label}</div>`;
  });
  shtml+=`</div>`;

  // Module shortcuts
  const mods=[...new Set(D.cours.map(c=>c.mod))];
  shtml+=`<div class="sidebar-section"><div class="sidebar-label">Modules</div>`;
  mods.forEach(m=>{
    const cc=D.cours.filter(c=>c.mod===m);
    const done=cc.filter(c=>coursState(c)==='maitrisee').length;
    const icon=modIcons[m]||'›';
    shtml+=`<div class="sidebar-item" onclick="nav('cours');setTimeout(()=>{const el=document.getElementById('mod-${m.replace(/\s/g,'')}');if(el)el.scrollIntoView({behavior:'smooth'})},100)">
      <span class="si-icon">${icon}</span>${m}<span class="si-badge">${done}/${cc.length}</span></div>`;
  });
  shtml+=`</div>`;
  sb.innerHTML=shtml;
  mn.innerHTML=mhtml;
}

function nav(viewId){
  curView=viewId;curCours=null;
  buildSidebar();
  render();
  window.scrollTo(0,0);
}

function openCours(id){
  curCours=id;curView='detail';
  if(INTERACTIF[id]){iStep=iFirstIncomplete(id);window._qcmSel=undefined;window._vfAnswers=undefined;window._triAnswers=undefined}
  buildSidebar();
  render();
  window.scrollTo(0,0);
}

function render(){
  const el=document.getElementById('content');
  el.innerHTML='';
  switch(curView){
    case'dashboard':el.innerHTML=renderDash();break;
    case'cours':el.innerHTML=renderCoursList();break;
    case'detail':el.innerHTML=renderDetail();break;
    case'mudras':el.innerHTML=renderMudras();break;
    case'natures':el.innerHTML=renderNatures();break;
    case'armes':el.innerHTML=renderArmes();break;
    case'hierarchie':el.innerHTML=renderHier();break;
    case'admin':el.innerHTML=renderAdmin();break;
    case'annonces':el.innerHTML=renderAnnonces();break;
    case'bilan':el.innerHTML=renderBilan();break;
    case'historique':el.innerHTML=renderHistorique();break;
    case'sensei':el.innerHTML=renderSensei();break;
  }
}

let fText='',fCat='',fRang='',fEtat='',fMod='';
// Map course IDs to their required nature (only nature-specific combat courses)
const COURS_NATURE={raiton_cours:'raiton'};
// Returns the nature ID if this is a nature-locked course, or null
function coursNature(cid){return COURS_NATURE[cid]||null;}
// Check if a nature course should be visible for this sensei
function coursVisibleForSensei(c){
  const nat=coursNature(c.id);
  if(!nat)return true; // not nature-specific → always visible
  const senNat=getSensei().nature;
  if(!senNat)return true; // no nature chosen → show all
  return nat===senNat;
}

function renderCoursList(){
  const allMods=[...new Set(D.cours.map(c=>c.mod))];
  const senNat=getSensei().nature;
  const senNatInfo=D.natures.find(n=>n.id===senNat);
  let h=`<div class="page-header"><div class="page-title">Cours</div><div class="page-desc">Tous les enseignements de l'Académie${senNatInfo?' · Affinité '+senNatInfo.icon+' '+senNatInfo.nom:''}</div></div>`;
  h+=`<div class="filters">
    <input class="filter-input" type="text" placeholder="Rechercher..." value="${esc(fText)}" oninput="fText=this.value;clearTimeout(window._searchTimeout);window._searchTimeout=setTimeout(()=>{const v=document.querySelector('.filter-input');const pos=v?.selectionStart;document.getElementById('content').innerHTML=renderCoursList();const v2=document.querySelector('.filter-input');if(v2){v2.focus();v2.selectionStart=v2.selectionEnd=pos}},200)">
    <select class="filter-select" onchange="fCat=this.value;document.getElementById('content').innerHTML=renderCoursList()">
      <option value="">Catégorie</option><option value="theorique"${fCat==='theorique'?' selected':''}>Théorique</option><option value="pratique"${fCat==='pratique'?' selected':''}>Pratique</option></select>
    <select class="filter-select" onchange="fMod=this.value;document.getElementById('content').innerHTML=renderCoursList()">
      <option value="">Module</option>${allMods.map(m=>`<option value="${m}"${fMod===m?' selected':''}>${m}</option>`).join('')}</select>
    <select class="filter-select" onchange="fRang=this.value;document.getElementById('content').innerHTML=renderCoursList()">
      <option value="">Rang</option>${D.rangs.slice(0,5).map(r=>`<option value="${r}"${fRang===r?' selected':''}>${r}</option>`).join('')}</select>
    <select class="filter-select" onchange="fEtat=this.value;document.getElementById('content').innerHTML=renderCoursList()">
      <option value="">État</option><option value="non-vue"${fEtat==='non-vue'?' selected':''}>Non vue</option><option value="en-cours"${fEtat==='en-cours'?' selected':''}>En cours</option><option value="maitrisee"${fEtat==='maitrisee'?' selected':''}>Maîtrisée</option></select>
  </div>`;

  const mods={};D.cours.forEach(c=>{if(!mods[c.mod])mods[c.mod]=[];mods[c.mod].push(c)});
  const srch=fText.toLowerCase();

  for(const[m,cc]of Object.entries(mods)){
    const fl=cc.filter(c=>{
      if(!coursVisibleForSensei(c))return false;
      if(fCat&&c.cat!==fCat)return false;
      if(fMod&&c.mod!==fMod)return false;
      if(fRang&&c.rang!==fRang)return false;
      if(fEtat&&coursState(c)!==fEtat)return false;
      if(srch&&!(c.titre+' '+c.desc+' '+c.techs.map(t=>t.nom+' '+t.desc).join(' ')).toLowerCase().includes(srch))return false;
      return true;
    });
    if(!fl.length)continue;
    const md=fl.reduce((a,c)=>a+coursProg(c).d,0),mt=fl.reduce((a,c)=>a+coursProg(c).t,0);
    h+=`<div class="module-section" id="mod-${m.replace(/\s/g,'')}">
      <div class="module-header"><span class="module-name">${modIcons[m]||'📚'} ${m}</span><span class="module-count">${fl.length} cours — ${mt?Math.round(md/mt*100):0}%</span></div>
      <div class="cours-grid">`;
    fl.forEach(c=>{
      const st=coursState(c),p=coursProg(c);
      const pOk=c.prereq.every(pid=>{const pc=cours(pid);return pc&&coursState(pc)==='maitrisee'});
      const cNat=coursNature(c.id);
      const isMyNature=cNat&&cNat===senNat;
      const natInfo=cNat?D.natures.find(n=>n.id===cNat):null;
      h+=`<div class="card card-clickable${!pOk?' prereq-warn':''}" onclick="openCours('${c.id}')" ${isMyNature?'style="border-color:var(--skin-primary);box-shadow:0 0 12px var(--skin-glow)"':''}>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div class="cours-card-title">${isMyNature?natInfo.icon+' ':''}${c.titre}</div>${stBadge(st)}
        </div>
        <div class="cours-badges"><span class="badge badge-${c.cat==='theorique'?'theo':'prat'}">${c.cat}</span><span class="badge badge-rang">${c.rang}</span>
          ${isMyNature?`<span class="badge" style="background:var(--skin-bg-tint);color:var(--skin-primary);font-weight:600">${natInfo.icon} ${natInfo.nom}</span>`:''}
          ${c.auteur?`<span class="badge" style="background:rgba(0,0,0,0.04);color:var(--text-dim)">par ${c.auteur}</span>`:''}</div>
        <div class="cours-card-desc">${c.desc}</div>
        <div class="cours-card-footer">
          <div class="pbar" style="flex:1;margin-right:10px"><div class="pbar-fill${p.p===100?' complete':''}" style="width:${p.p}%"></div></div>
          <span class="pbar-text">${p.p}%</span>
        </div>
        ${!pOk?'<div style="font-size:0.68rem;color:var(--konoha-red-bright);margin-top:4px">⚠ Prérequis manquants</div>':''}
      </div>`;
    });
    h+=`</div></div>`;
  }
  return h;
}
